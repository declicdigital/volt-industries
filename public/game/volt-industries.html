<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volt Industries - Laboratoire d'élite</title>
<style>
  :root{
    --accent:#00c2ff; --accent-dark:#0088cc; --accent-soft: rgba(0,194,255,.15);
    --gold:#ffb020; --red:#ff3b5c; --green:#22c98a;
    --bg0:#03060d; --bg1:#070c18;
    --panel: rgba(14,20,34,.72); --line: rgba(120,180,255,.18);
    --ink:#eef3fb; --dim:#8ea0bd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse 90% 70% at 50% -10%, var(--accent-soft), transparent 65%),
      radial-gradient(ellipse 70% 60% at 100% 100%, var(--accent-soft), transparent 60%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 55%, var(--bg0));
    color:var(--ink); font-family: -apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; overflow-x:hidden; position:relative; transition: background 1.4s ease;
  }
  .bg-grid{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 46px 46px; mask-image: radial-gradient(ellipse 100% 90% at 50% 10%, black 30%, transparent 85%); animation: gridshift 30s linear infinite; }
  @keyframes gridshift{ from{ background-position:0 0,0 0;} to{ background-position:46px 46px,-46px 46px; } }
  .scanline{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5; background: repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0px, transparent 1px, transparent 3px); }
  .glow-orb{ position:fixed; border-radius:50%; filter: blur(90px); opacity:.28; z-index:0; animation: float 14s ease-in-out infinite; transition: background 1s ease;}
  .glow-orb.a{ width:420px;height:420px; background:var(--accent); top:-140px; left:-100px; }
  .glow-orb.b{ width:360px;height:360px; background:var(--accent-dark); bottom:-120px; right:-80px; animation-delay:4s;}
  @keyframes float{ 0%,100%{ transform: translateY(0) translateX(0);} 50%{ transform: translateY(-36px) translateX(24px);} }
  #app{ position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:28px 20px 90px; perspective:1200px; }
  .card.page-slide-in{ animation: pageSlideIn .38s cubic-bezier(.2,.8,.3,1); transform-origin:left center; }
  @keyframes pageSlideIn{ from{ opacity:0; transform: translateX(24px) rotateY(-8deg); } to{ opacity:1; transform:translateX(0) rotateY(0); } }
  @media (max-width:560px){
    .card.page-slide-in{ animation: pageSlideInMobile .34s cubic-bezier(.2,.85,.3,1); }
    @keyframes pageSlideInMobile{ from{ opacity:0; transform:translateX(34px) rotateY(-12deg) scale(.985); } to{ opacity:1; transform:translateX(0) rotateY(0) scale(1); } }
  }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
  .brand{ font-weight:800; letter-spacing:4px; font-size:15px; display:flex; align-items:center; gap:10px; color:var(--ink); transition:opacity .15s; }
  .brand:hover{ opacity:.8; }
  .logo-mark{ width:34px; height:34px; filter: drop-shadow(0 0 8px var(--accent)); flex-shrink:0; }
  .langsel{ display:flex; gap:6px; }
  .langsel button{ border:1px solid var(--line); background:rgba(255,255,255,.03); padding:6px 14px; border-radius:20px; font-size:12px; font-weight:700; letter-spacing:1px; cursor:pointer; color:var(--dim); }
  .langsel button.active{ background:var(--accent); color:#03060d; border-color:var(--accent);}
  .topopts{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
  .palsel{ display:flex; gap:5px; flex-wrap:wrap; }
  .palsel .swatch{ width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); cursor:pointer; padding:0; transition:transform .12s, box-shadow .12s; }
  .palsel .swatch:hover{ transform:scale(1.15); }
  .palsel .swatch.active{ border-color:#fff; box-shadow:0 0 0 2px var(--accent-soft), 0 0 10px var(--accent); transform:scale(1.12); }
  @media(max-width:560px){ .palsel .swatch{ width:17px; height:17px; } .langsel button{ padding:5px 10px; } }
  .rank-badge{ position:fixed; top:16px; right:16px; z-index:80; background:rgba(8,12,22,.85); backdrop-filter:blur(12px);
    border:1.5px solid var(--line); border-radius:16px; padding:10px 16px; text-align:right; box-shadow:0 10px 30px -12px rgba(0,0,0,.6); }
  .rank-badge .rname{ font-size:12px; font-weight:800; color:var(--ink); letter-spacing:1px; }
  .rank-badge .rlabel{ font-size:9.5px; font-weight:800; letter-spacing:1.5px; color:var(--dim); text-transform:uppercase; margin-top:2px;}
  .rank-badge .stars{ margin-top:4px; font-size:15px; letter-spacing:2px; }
  .rank-badge .score-line{ margin-top:3px; font-size:13px; font-weight:900; }
  .rank-badge .rlove{ margin-top:6px; display:flex; align-items:center; justify-content:flex-end; gap:6px;
    font-size:10.5px; font-weight:800; letter-spacing:.6px; }
  .rank-badge .rlove .hb{ font-size:13px; animation:heartBeat 1.4s ease-in-out infinite; }
  @keyframes heartBeat{ 0%,100%{ transform:scale(1); } 45%{ transform:scale(1.28); } }
  .game-shell{ display:flex; gap:26px; align-items:flex-start; }
  .side-avatar{ position:sticky; top:20px; width:300px; flex-shrink:0; }
  .main-col{ flex:1; min-width:0; }
  @media (max-width:920px){ .game-shell{ flex-direction:column; } .side-avatar{ position:relative; top:0; width:100%; } }
  .card{ background: var(--panel); backdrop-filter: blur(18px); border:1px solid var(--line); border-radius:22px; padding:34px;
    box-shadow: 0 30px 70px -30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.04); animation: rise .5s ease; }
  @keyframes rise{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
  h1{ font-size: clamp(26px, 4.5vw, 42px); letter-spacing:-1px; margin:0 0 8px; color:var(--ink);}
  h2{ font-size:21px; margin:0 0 4px; letter-spacing:-0.4px; color:var(--ink);}
  h3{ font-size:15.5px; margin:22px 0 6px; color:var(--ink); text-transform:uppercase; letter-spacing:1px;}
  .eyebrow{ text-transform:uppercase; font-size:11px; letter-spacing:3.5px; font-weight:800; color:var(--accent); margin-bottom:10px; display:block; text-shadow:0 0 12px var(--accent-soft); }
  p.lead{ color:var(--dim); font-size:15.5px; line-height:1.65; max-width:680px; }
  input[type=text]{ width:100%; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px; font-size:16px; outline:none; transition:.2s; background:rgba(255,255,255,.03); color:var(--ink); }
  input[type=text]::placeholder{ color:#5a6a85; }
  input[type=text]:focus{ border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  input[type=color]{ width:52px;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:2px;cursor:pointer; background:transparent;}
  input[type=range]{ accent-color: var(--accent); width:100%; }
  .btn{ display:inline-flex; align-items:center; gap:8px; justify-content:center; background:rgba(255,255,255,.06); color:var(--ink);
    border:1px solid var(--line); padding:14px 26px; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; transition:.15s; }
  .btn:hover{ transform:translateY(-2px); border-color:var(--accent); }
  .btn:disabled{ opacity:.3; cursor:not-allowed; transform:none; }
  .btn.ghost{ background:transparent; }
  .btn.cyan{ background:linear-gradient(135deg, var(--accent), var(--accent-dark)); color:#03060d; border:none; box-shadow:0 12px 28px -10px var(--accent);}
  .actions{ margin-top:26px; display:flex; gap:12px; flex-wrap:wrap; }
  .optgrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-top:12px;}
  .opt{ border:1.5px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; text-align:left; background:rgba(255,255,255,.02); transition:.15s; color:var(--ink); }
  .opt:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .opt.selected{ border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft); }
  .opt .oname{ font-weight:800; font-size:14px; margin-bottom:3px;}
  .opt .odesc{ font-size:12px; color:var(--dim); line-height:1.4;}
  .opt.disabled{ opacity:.3; cursor:not-allowed; }
  .badge{ display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:1px; padding:3px 9px; border-radius:20px; margin-left:8px; vertical-align:middle;}
  .badge.tech{ background:rgba(0,194,255,.18); color:#7fe0ff;} .badge.mystique{ background:rgba(139,92,246,.2); color:#c8b3ff;}
  .badge.physique{ background:rgba(255,176,32,.2); color:#ffd28a;} .badge.psychique{ background:rgba(34,201,138,.2); color:#8fe8c8;}
  .avatar-wrap{ background: radial-gradient(ellipse at 50% 15%, var(--accent-soft), transparent 70%), rgba(255,255,255,.015);
    border:1.5px solid var(--line); border-radius:20px; padding:14px; display:flex; align-items:center; justify-content:center; min-height:320px; position:relative; overflow:hidden; }
  .avatar-wrap::before{ content:''; position:absolute; inset:0; background-image: repeating-linear-gradient(0deg, var(--accent-soft) 0 1px, transparent 1px 30px); opacity:.35; pointer-events:none; }
  .hud-label{ position:absolute; top:10px; left:14px; font-size:9.5px; letter-spacing:2px; font-weight:800; color:var(--accent); opacity:.85; }
  .hud-corner{ position:absolute; width:20px; height:20px; border-color:var(--accent); opacity:.7; }
  .hud-corner.tl{ top:8px; left:8px; border-top:2px solid; border-left:2px solid; } .hud-corner.tr{ top:8px; right:8px; border-top:2px solid; border-right:2px solid; }
  .hud-corner.bl{ bottom:8px; left:8px; border-bottom:2px solid; border-left:2px solid; } .hud-corner.br{ bottom:8px; right:8px; border-bottom:2px solid; border-right:2px solid; }
  .sidebar-stats{ margin-top:14px; }
  .statbar{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .stat{ flex:1; min-width:100px; background:rgba(255,255,255,.03); border-radius:12px; padding:9px 12px; border:1px solid var(--line);}
  .stat .slabel{ font-size:9.5px; letter-spacing:1.2px; font-weight:800; color:var(--dim); margin-bottom:5px; text-transform:uppercase;}
  .barbg{ height:6px; background:rgba(255,255,255,.06); border-radius:10px; overflow:hidden;}
  .barfill{ height:100%; border-radius:10px; transition:width .5s ease; }
  .align-track{ height:9px; border-radius:10px; background:linear-gradient(90deg, var(--red), rgba(255,255,255,.08) 50%, var(--accent)); position:relative; margin-top:6px;}
  .align-dot{ position:absolute; top:-4px; width:16px; height:16px; border-radius:50%; background:var(--ink); border:3px solid var(--bg0); box-shadow:0 2px 12px rgba(0,0,0,.6); transition:left .5s ease; transform:translateX(-50%);}
  .mission-tag{ font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--gold); text-transform:uppercase;}
  .mission-year{ font-size:12px; color:var(--dim); font-weight:700; margin-bottom:6px;}
  .mission-loc{ font-size:12.5px; color:var(--accent); font-weight:700; margin:4px 0 2px; }
  .choice{ display:block; width:100%; text-align:left; background:rgba(255,255,255,.02); border:1.5px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-top:12px; cursor:pointer; font-size:15px; line-height:1.5; transition:.15s; color:var(--ink); }
  .choice:hover{ border-color:var(--cp-color, var(--accent)); transform:translateX(4px); box-shadow:0 8px 26px -14px var(--cp-color, var(--accent)); background:color-mix(in srgb, var(--cp-color, var(--accent)) 12%, transparent); }
  .jv-tip{ display:flex; gap:10px; align-items:flex-start; margin-top:14px; padding:11px 14px; border-radius:12px;
    border:1px solid color-mix(in srgb, var(--jvc, var(--accent)) 55%, transparent); background:color-mix(in srgb, var(--jvc, var(--accent)) 10%, transparent);
    font-size:13px; line-height:1.5; color:#d6e2f5; box-shadow:0 0 26px -16px var(--jvc, var(--accent)); }
  .jv-tip .jv-tip-name{ flex:0 0 auto; font-size:10px; letter-spacing:2px; font-weight:900; color:var(--jvc, var(--accent));
    padding-top:2px; animation:jvTipPulse 2.4s ease-in-out infinite; }
  @keyframes jvTipPulse{ 0%,100%{ opacity:.65; } 50%{ opacity:1; } }
  .choice.jv-reco{ border-color:var(--jvc, var(--accent)); box-shadow:0 0 24px -14px var(--jvc, var(--accent)); }
  .choice.jv-reco::after{ content:attr(data-reco); display:inline-block; margin-left:8px; font-size:9.5px; letter-spacing:1.6px;
    font-weight:900; color:var(--jvc, var(--accent)); vertical-align:middle; }
  .log-entry{ border-left:3px solid var(--accent); padding:10px 16px; margin-bottom:10px; background:rgba(255,255,255,.02); border-radius:0 10px 10px 0; font-size:14px; color:#c3cee2;}
  .log-entry.villain{ border-left-color:var(--red); }
  .relwrap{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:14px;}
  .relcard{ border:1px solid var(--line); border-radius:12px; padding:12px; background:rgba(255,255,255,.02);}
  .relcard .rn{ font-weight:800; font-size:13px; margin-bottom:6px;}
  .team-hero-banner{ border-radius:18px; padding:22px; margin-top:18px; text-align:center; background: radial-gradient(ellipse at 50% 0%, var(--accent-soft), transparent 70%); border:1.5px solid var(--accent); }
  .team-hero-banner .tname{ font-size:22px; font-weight:900; letter-spacing:2px; color:var(--accent); text-shadow:0 0 20px var(--accent);}
  .dl-box{ margin-top:26px; border:1.5px solid var(--accent); border-radius:18px; padding:22px; text-align:center;
    background: radial-gradient(ellipse at 50% 0%, var(--accent-soft), transparent 72%); }
  .dl-box .dl-title{ font-size:13px; font-weight:900; letter-spacing:3px; text-transform:uppercase; color:var(--accent); }
  .dl-box .dl-sub{ color:var(--muted); font-size:13.5px; margin:8px 0 16px; }
  .dl-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-top:14px; }
  .kpi{ border:1px solid var(--line); border-radius:14px; padding:16px; background:rgba(255,255,255,.02); text-align:center;}
  .kpi .kval{ font-size:24px; font-weight:900; color:var(--accent); } .kpi .klabel{ font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-top:4px;}
  details.yearcard{ border:1px solid var(--line); border-radius:12px; padding:10px 16px; margin-top:10px; background:rgba(255,255,255,.02); }
  details.yearcard summary{ cursor:pointer; font-weight:800; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
  details.yearcard summary .tag{ font-size:11px; font-weight:700; padding:2px 10px; border-radius:12px; }
  .ymission{ font-size:13px; color:#c3cee2; padding:8px 0; border-top:1px solid var(--line); }
  .ymission:first-of-type{ border-top:none; }
  .death-banner{ border:1.5px solid var(--red); background:rgba(255,59,92,.08); border-radius:18px; padding:22px; text-align:center; margin-bottom:22px;}
  .death-banner .dtitle{ font-size:20px; font-weight:900; letter-spacing:2px; color:var(--red); }
  .turn-item{ font-size:13.5px; color:#c3cee2; padding:8px 0; border-bottom:1px dashed var(--line); }
  .preset-card{ border:1.5px solid var(--line); border-radius:16px; padding:0 0 14px; background:rgba(255,255,255,.02); cursor:pointer; transition:.15s; text-align:center; overflow:hidden; }
  .preset-card:hover{ border-color:var(--pc-color, var(--accent)); transform:translateY(-3px); box-shadow:0 0 26px -8px var(--pc-color, var(--accent)); }
  .preset-card .pname{ font-weight:900; font-size:14px; margin-top:10px; padding:0 12px; }
  .preset-card .pdesc{ font-size:11.5px; color:var(--dim); margin-top:4px; line-height:1.4; padding:0 12px; }
  .preset-photo{ position:relative; height:230px; overflow:hidden; background:radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--pc-color) 22%, transparent), rgba(0,0,0,.55)); }
  .preset-photo img{ width:100%; height:100%; object-fit:cover; object-position:50% 14%; }
  .preset-photo::after{ content:''; position:absolute; inset:0; box-shadow: inset 0 0 55px -12px var(--pc-color), inset 0 -40px 40px -30px rgba(0,0,0,.9); }
  /* ---- Face Forge (creation joueur a partir d'une photo) ---- */
  .ff-card{ border:1.5px dashed color-mix(in srgb, var(--accent) 60%, transparent); border-radius:18px; padding:16px; margin:14px 0 22px;
    background:linear-gradient(140deg, color-mix(in srgb, var(--accent) 12%, transparent), rgba(255,255,255,.02)); cursor:pointer; transition:.15s; }
  .ff-card:hover{ transform:translateY(-2px); box-shadow:0 0 30px -10px var(--accent); border-style:solid; }
  .ff-card h4{ margin:0; font-size:16px; font-weight:900; letter-spacing:.4px; }
  .ff-card p{ margin:6px 0 0; font-size:12px; color:var(--dim); line-height:1.5; }
  .ff-grid{ display:grid; grid-template-columns:minmax(0,320px) minmax(0,1fr); gap:18px; margin-top:14px; align-items:start; }
  @media (max-width:760px){ .ff-grid{ grid-template-columns:1fr; } }
  .ff-stage{ position:relative; border-radius:16px; overflow:hidden; border:1.5px solid var(--line); aspect-ratio:3/4; background:rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center; }
  .ff-stage img, .ff-stage video, .ff-stage canvas{ width:100%; height:100%; object-fit:cover; display:block; }
  .ff-stage .ff-empty{ font-size:12px; color:var(--dim); text-align:center; padding:18px; line-height:1.6; }
  .ff-stage.beam::after{ content:''; position:absolute; inset:0; pointer-events:none;
    box-shadow: inset 0 0 60px -10px var(--ff-col, var(--accent)); border:1px solid color-mix(in srgb, var(--ff-col, var(--accent)) 70%, transparent); border-radius:16px; }
  .ff-stage.loading img{ filter:blur(16px); transform:scale(1.04); }
  .ff-progress{ position:absolute; bottom:0; left:0; right:0; padding:8px 10px; font-size:11px; font-weight:800; letter-spacing:1px;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,.85)); text-align:center; }
  .ff-opt{ display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px; }
  .ff-chip{ font-size:11.5px; font-weight:800; letter-spacing:.5px; padding:8px 12px; border-radius:999px; border:1.4px solid var(--line);
    background:rgba(255,255,255,.03); cursor:pointer; transition:.13s; }
  .ff-chip:hover{ border-color:var(--ff-col, var(--accent)); }
  .ff-chip.on{ border-color:var(--ff-col, var(--accent)); box-shadow:0 0 18px -6px var(--ff-col, var(--accent)); background:color-mix(in srgb, var(--ff-col, var(--accent)) 16%, transparent); }
  .ff-sw{ width:30px; height:30px; border-radius:50%; border:2px solid var(--line); cursor:pointer; }
  .ff-sw.on{ border-color:#fff; box-shadow:0 0 14px -2px currentColor; }
  .ff-lab{ font-size:10.5px; font-weight:900; letter-spacing:1.6px; color:var(--dim); margin-top:14px; }
  .ff-err{ font-size:12px; color:var(--red); margin-top:10px; }
  .ff-thumbs{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .ff-thumbs img{ width:56px; height:72px; object-fit:cover; border-radius:8px; border:1.5px solid var(--line); cursor:pointer; }
  .ff-thumbs img.on{ border-color:var(--ff-col, var(--accent)); }
  .preset-badge{ position:absolute; top:10px; left:10px; z-index:2; font-size:9.5px; font-weight:900; letter-spacing:1.4px;
    padding:4px 8px; border-radius:999px; color:#0a0d14; background:var(--pc-color); box-shadow:0 0 14px var(--pc-color); }
  .preset-mini{ width:100%; display:flex; justify-content:center; }
  .portrait-avatar{ width:100%; height:100%; min-height:200px; aspect-ratio:3/4; border-radius:12px; overflow:hidden; position:relative; }
  .portrait-avatar img{ width:100%; height:100%; object-fit:cover; object-position:50% 12%; }
  .pstats{ margin-top:8px; font-size:10.5px; font-weight:900; letter-spacing:1px; color:var(--pc-color); }
  .ptrait{ margin-top:6px; font-size:11.5px; line-height:1.45; color:var(--muted); }
  .ptrait.good{ color:#7ef0c0; } .ptrait.bad{ color:#ff9aa8; }
  .pgal{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin-top:10px; }
  .pgal{ grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); }
  .pgal .pitem{ position:relative; border:2px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; height:126px; background:rgba(255,255,255,.03); transition:.15s; }
  .pgal .pitem img{ width:100%; height:100%; object-fit:cover; object-position:50% 12%; }
  .pgal .pitem.sel{ border-color:var(--accent); box-shadow:0 0 20px -6px var(--accent); }
  .pgal .pitem.none{ display:flex; align-items:center; justify-content:center; text-align:center; font-size:10.5px; font-weight:800; color:var(--dim); padding:6px; }

  .scratch-card{ border:1.5px dashed var(--accent); border-radius:16px; padding:22px; text-align:center; cursor:pointer; background: var(--accent-soft); margin-bottom:18px; }

<script>
/* ============================ STORAGE (localStorage) ============================ */
(function(){
  var PREFIX = 'volt:';
  function ok(v){ return Promise.resolve(v); }
  window.storage = {
    set: function(key, value){
      try{ localStorage.setItem(PREFIX+key, String(value)); }catch(e){}
      return ok({ key:key, ok:true });
    },
    get: function(key){
      var v = null;
      try{ v = localStorage.getItem(PREFIX+key); }catch(e){}
      return ok(v===null ? null : { key:key, value:v });
    },
    delete: function(key){
      try{ localStorage.removeItem(PREFIX+key); }catch(e){}
      return ok({ key:key, ok:true });
    },
    list: function(prefix){
      var keys = [];
      try{
        for(var i=0;i<localStorage.length;i++){
          var k = localStorage.key(i);
          if(k && k.indexOf(PREFIX)===0){
            var bare = k.slice(PREFIX.length);
            if(!prefix || bare.indexOf(prefix)===0) keys.push(bare);
          }
        }
      }catch(e){}
      return ok({ keys:keys });
    }
  };
})();

/* ============================ THEME ============================ */
function lerp(a,b,tt){ return a+(b-a)*tt; }
function hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)]; }
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join(''); }
const PALETTES = [
  { id:'auto',   fr:'Auto',    en:'Auto',    swatch:'linear-gradient(135deg,#8e99a6,#00c2ff 50%,#ff3b5c)' },
  { id:'acier',  fr:'Acier',   en:'Steel',   accent:'#9aa7b4', accentDark:'#5c6874', bg0:'#0a0c0f', bg1:'#191d23', swatch:'#9aa7b4' },
  { id:'azur',   fr:'Azur',    en:'Azure',   accent:'#00c2ff', accentDark:'#0088cc', bg0:'#020913', bg1:'#071429', swatch:'#00c2ff' },
  { id:'cramoisi',fr:'Cramoisi',en:'Crimson',accent:'#ff3b5c', accentDark:'#a5122f', bg0:'#1a0206', bg1:'#3d0a14', swatch:'#ff3b5c' },
  { id:'violet', fr:'Violet',  en:'Violet',  accent:'#a76bff', accentDark:'#6a2fc4', bg0:'#0c0518', bg1:'#1d0f38', swatch:'#a76bff' },
  { id:'emeraude',fr:'Emeraude',en:'Emerald',accent:'#28dc9a', accentDark:'#12946a', bg0:'#04120d', bg1:'#0a2a20', swatch:'#28dc9a' },
  { id:'or',     fr:'Or',      en:'Gold',    accent:'#ffc23d', accentDark:'#b57c07', bg0:'#120c02', bg1:'#2b1f06', swatch:'#ffc23d' },
  { id:'rose',   fr:'Rose',    en:'Rose',    accent:'#ff5c9d', accentDark:'#c01f63', bg0:'#160410', bg1:'#340f26', swatch:'#ff5c9d' },
  { id:'orange', fr:'Ambre',   en:'Amber',   accent:'#ff7a2f', accentDark:'#b34405', bg0:'#150703', bg1:'#33130a', swatch:'#ff7a2f' },
];
function themeColors(align){
  const p = PALETTES.find(x=>x.id===S.palette);
  if(p && p.id!=='auto') return { accent:p.accent, accentDark:p.accentDark, bg0:p.bg0, bg1:p.bg1 };
  const tt = clamp((align+40)/80, 0, 1);
  const villain = hexToRgb('#ff3b5c'), villainDark = hexToRgb('#a5122f');
  const hero = hexToRgb('#00c2ff'), heroDark = hexToRgb('#0088cc');
  const bg0Villain = hexToRgb('#200308'), bg0Hero = hexToRgb('#020913');
  const bg1Villain = hexToRgb('#4a0d18'), bg1Hero = hexToRgb('#071429');
  return {
    accent: rgbToHex(lerp(villain[0],hero[0],tt), lerp(villain[1],hero[1],tt), lerp(villain[2],hero[2],tt)),
    accentDark: rgbToHex(lerp(villainDark[0],heroDark[0],tt), lerp(villainDark[1],heroDark[1],tt), lerp(villainDark[2],heroDark[2],tt)),
    bg0: rgbToHex(lerp(bg0Villain[0],bg0Hero[0],tt), lerp(bg0Villain[1],bg0Hero[1],tt), lerp(bg0Villain[2],bg0Hero[2],tt)),
    bg1: rgbToHex(lerp(bg1Villain[0],bg1Hero[0],tt), lerp(bg1Villain[1],bg1Hero[1],tt), lerp(bg1Villain[2],bg1Hero[2],tt)),
  };
}
function applyTheme(){
  const {accent, accentDark, bg0, bg1} = themeColors(S.align);
  document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--accent-dark', accentDark);
  document.documentElement.style.setProperty('--bg0', bg0);
  document.documentElement.style.setProperty('--bg1', bg1);
  const rgb = hexToRgb(accent);
  document.documentElement.style.setProperty('--accent-soft', `rgba(${rgb[0]},${rgb[1]},${rgb[2]},.24)`);
}

/* ============================ LOGO ============================ */
function logoSVG(size, withText){
  const uid = 'lg'+Math.random().toString(36).slice(2,7);
  const ticks = Array.from({length:12}).map((_,i)=>{
    const ang=i*30*Math.PI/180;
    const x1=(50+41*Math.cos(ang)).toFixed(1), y1=(50+41*Math.sin(ang)).toFixed(1);
    const x2=(50+46*Math.cos(ang)).toFixed(1), y2=(50+46*Math.sin(ang)).toFixed(1);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="url(#${uid}g)" stroke-width="1.4" opacity="0.55"/>`;
  }).join('');
  const textPart = withText ? `
    <path id="${uid}circ" d="M 50,50 m -33,0 a 33,33 0 1,1 66,0 a 33,33 0 1,1 -66,0" fill="none"/>
    <text font-size="6.6" font-weight="800" letter-spacing="2.6" fill="url(#${uid}g)">
      <textPath href="#${uid}circ" startOffset="1%">VOLT INDUSTRIES • VOLT INDUSTRIES •</textPath>
    </text>` : '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${uid}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--accent-dark)"/></linearGradient>
      <filter id="${uid}f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#${uid}g)" stroke-width="2.5" opacity="0.9"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="url(#${uid}g)" stroke-width="1" opacity="0.45"/>
    ${ticks}
    ${textPart}
    <polygon points="50,20 76,68 24,68" fill="none" stroke="url(#${uid}g)" stroke-width="4.5" stroke-linejoin="round" filter="url(#${uid}f)"/>
    <polygon points="50,36 64,60 36,60" fill="url(#${uid}g)" opacity="0.9"/>
    <circle cx="50" cy="50" r="2.6" fill="#ffffff"/>
  </svg>`;
}

function factionEmblemSVG(side, tier, size){

    case 'skyline': icon = `<rect x="30" y="46" width="10" height="24" fill="#fff" opacity="0.9"/><rect x="44" y="34" width="12" height="36" fill="#fff" opacity="0.95"/><rect x="60" y="52" width="10" height="18" fill="#fff" opacity="0.85"/>`; break;

    case 'galaxy': icon = `<path d="M50 48 C60 40 62 30 50 26 C40 30 40 40 50 48 C58 56 58 66 48 70 C38 66 38 56 50 48 Z" fill="#fff" opacity="0.9"/>`; break;
    case 'fist': icon = `<rect x="36" y="38" width="28" height="24" rx="8" fill="#fff" opacity="0.92"/><rect x="34" y="30" width="8" height="16" rx="3" fill="#fff"/><rect x="44" y="26" width="8" height="20" rx="3" fill="#fff"/><rect x="54" y="28" width="8" height="18" rx="3" fill="#fff"/>`; break;

  if(used.length >= arr.length) used = [];

  { fr:(n,T,S_,L)=>`Le passe de ${n} refait surface a ${L}, entremele a ${T}. Certaines verites sont difficiles a entendre.`,

function generateSignatureMission(rank){
  const type = pick(['combat','combat','rescue','social']);
  const charKey = type==='combat' ? pickOpponentKey() : pick(otherCharKeys());
  const c = CHARACTERS[charKey];
  const roleT = pickNoRepeat('sigrole', SIGNATURE_ROLE_TEMPLATES);
  const threat = pickNoRepeat('threats', THREATS), stakes = pickNoRepeat('stakes', STAKES); let locName = null;
  const scope = pickScopeForRank(rank);
  locName = randLocationName(scope);
  const danger = dangerForScope(scope, type);
  const fr = roleT.fr(c.fr, threat.fr, stakes.fr, locName);
  const en = roleT.en(c.en, threat.en, stakes.en, locName);
  const dirSign = c.align==='hero' ? 1 : (c.align==='villain' ? -1 : (Math.random()<0.5?1:-1));
  const choices = [
    { fr:`Te ranger sans hesiter aux cotes de ${c.fr}.`, en:`Stand without hesitation by ${c.en}'s side.`,
      eff:{ align: dirSign*randInt(7,12), courage:randInt(3,7), rel:{[charKey]: randInt(4,7)} } },
    { fr:`Aider ${c.fr}, tout en gardant tes distances.`, en:`Help ${c.en}, while keeping your distance.`,
      eff:{ align: dirSign*randInt(2,5), intelligence:randInt(3,7), rel:{[charKey]: randInt(1,3)} } },
    { fr:`Profiter de la situation de ${c.fr} a ton propre avantage.`, en:`Use ${c.en}'s situation to your own advantage.`,
      eff:{ align: -dirSign*randInt(6,11), popularity:-randInt(2,6), rel:{[charKey]: -randInt(4,8)} } },
  ];
  return { id:'gensig', generated:true, signature:true, type, danger, scope, charKey,
    tagFr:'Personnage', tagEn:'Character arc', fr, en, choices, location:{ name: locName, type: scope } };
}

  let h = 0; for(let i=0;i<key.length;i++) h = (h*31 + key.charCodeAt(i)) % 9973;
  const t2 = (typeof CHAR_TIER!=='undefined' && S.playerCharKey && CHAR_TIER[S.playerCharKey]) ? CHAR_TIER[S.playerCharKey] : 5;
  if(t2 >= 9) return 'late';
  const m = h % 3;
  return m===0 ? 'late' : (m===1 ? 'early' : 'stable');
}
function agingDelta(){
  const a = currentAge(), p = agingProfile();
  if(p==='late') return clamp(Math.round((a-32)*0.8), -8, 16);
  if(p==='early'){ return a <= 30 ? clamp(Math.round((a-24)*1.0), 0, 7) : clamp(-Math.round((a-30)*0.9), -18, 0); }
  return clamp(Math.round((a-34)*0.2), -4, 5);
}

function playerStrength(){
  const statAvg = (S.stats.courage + S.stats.intelligence + S.stats.popularity)/3;
  const f = (S.battleForm && S.battleForm) || { momentum:0 };
  const inj = (typeof injuryActive === 'function') ? injuryActive() : null;
  let s = computePowerLevel()*0.8 + statAvg*0.35;
  s += (f.momentum||0)*2.5 + (S.skills||[]).length*2.5;
  if(inj) s -= inj.sev*6;
  if(S.team) s += 2 + (S.team.tier||1);
  return Math.round(clamp(s, 10, 110));
}
function foeStrength(foeKey, mission){
  const mv = (typeof foeMovesFor === 'function') ? foeMovesFor(foeKey) : [];

  const danger = (mission && mission.danger) || 1;

  return Math.round(30 + danger*7 + scope*1.6 + (tier-24)*1.4 + (charTier(foeKey)-5)*6);
}
function winOdds(foeKey, mission){
  const diff = playerStrength() - foeStrength(foeKey, mission);
  const p = 1/(1+Math.exp(-diff/9));

/* ---------- Note de carriere : composite coherent avec le bilan ---------- */
function careerScore(){
  const fr = S.lang==='fr';
  const fights = S.combat.won + S.combat.lost;
  // Le niveau ne mesure que la force et la reussite : rien ici ne depend du camp (heros/villain).
  // 1) Palmares : taux de victoires, pondere par le nombre de combats (peu de combats = peu de credit)
  const winRate = fights ? S.combat.won / fights : 0;
  const reliability = fights ? Math.min(1, fights/4) : 0;
  const combatPart = fights ? (winRate * 30 * reliability + 30*(1-reliability)*0.55) : 30*0.45;
  // 2) Impact terrain : lieux marques, ponderes par leur ampleur (peu importe si sauves ou detruits)
  const uniqueLocs = {}; S.locations.forEach(l=>{ uniqueLocs[l.type+':'+l.name]=l; });
  const locArr = Object.values(uniqueLocs);
  const locWeight = locArr.reduce((s,l)=> s + (1 + (l.type||1)*0.6), 0);
  const expected = Math.max(3, (S.missionsPlan.length||10) * 0.62);
  const impact = clamp(locWeight/expected, 0, 1) * 22;
  // 3) Puissance : statistiques et niveau atteint
  const statAvg = (S.stats.courage + S.stats.intelligence + S.stats.popularity)/3;
  const power = ((statAvg/100)*0.6 + (computePowerLevel()/100)*0.4) * 20;
  // 4) Heritage : eleves formes (peu importe leur camp final), alliances, coeur, techniques apprises
  const goodMentees = S.mentees.filter(m=> m.outcome==='hero'||m.outcome==='villain').length;
  const lostMentees = S.mentees.filter(m=> m.outcome==='died').length;
  const relVals = Object.keys(S.rel).map(k=>S.rel[k]);
  const allies = relVals.filter(v=>v>=6).length;
  const romancePts = S.romance ? (S.romance.stage>=3 ? 3 : 2) : (S.romanceHistory.length ? 1 : 0);
  let legacy = Math.min(6, goodMentees*2.4) + Math.min(6, allies*1.5) + romancePts + Math.min(3, S.skills.length*0.75);
  legacy = clamp(legacy - lostMentees*0.8, 0, 16);
  // 5) Envergure cosmique : missions de tres grande ampleur (systeme/cosmique) reussies au fil de la carriere
  const cosmicBonus = clamp((S.cosmicWins||0)/3, 0, 1) * 12;
  // Malus : defaites en serie, mort, blessure non refermee
  let malus = 0;
  if(fights) malus += Math.min(6, S.combat.lost * (winRate<0.4 ? 0.7 : 0.28));
  if(S.dead) malus += 4;
  if(S.battleForm && S.battleForm.injury) malus += 1;
  const parts = [
    { label: fr?'Palmares au combat':'Combat record', value: combatPart, max:30 },
    { label: fr?'Impact sur le terrain':'Field impact', value: impact, max:22 },
    { label: fr?'Puissance atteinte':'Power reached', value: power, max:20 },
    { label: fr?'Heritage et liens':'Legacy and bonds', value: legacy, max:16 },
    { label: fr?'Envergure cosmique':'Cosmic scale', value: cosmicBonus, max:12 },
    { label: fr?'Sanctions et pertes':'Setbacks', value: -malus, max:0 },
  ];
  const total = clamp(Math.round(combatPart + impact + power + legacy + cosmicBonus - malus), 1, 100);
  let grade, gradeLabelFr, gradeLabelEn;
  if(total>=92){ grade='S'; gradeLabelFr='Legende du multivers'; gradeLabelEn='Multiverse legend'; }
  else if(total>=82){ grade='A'; gradeLabelFr='Carriere majeure'; gradeLabelEn='Major career'; }
  else if(total>=70){ grade='B'; gradeLabelFr='Carriere solide'; gradeLabelEn='Solid career'; }
  else if(total>=56){ grade='C'; gradeLabelFr='Carriere honnete'; gradeLabelEn='Decent career'; }
  else if(total>=40){ grade='D'; gradeLabelFr='Carriere en dents de scie'; gradeLabelEn='Uneven career'; }
  else if(total>=25){ grade='E'; gradeLabelFr='Carriere difficile'; gradeLabelEn='Rough career'; }
  else { grade='F'; gradeLabelFr='Carriere ratee'; gradeLabelEn='Failed career'; }
  return { total, parts, grade, gradeLabel: fr?gradeLabelFr:gradeLabelEn, winRate, fights, locWeight };
}

/* Plafond de conviction : une carriere faite de contradictions et de defaites ne finit jamais a 100%. */
function convictionCap(){
  const fights = S.combat.won + S.combat.lost;
  const lossPen = fights ? Math.round((S.combat.lost/fights) * 16) : 4;
  const contra = Math.min(30, (S.alignContradictions||0) * 5);
  const wobble = S.convictionSeed===undefined ? (S.convictionSeed = 3 + Math.floor(Math.random()*9)) : S.convictionSeed;
  return clamp(100 - contra - lossPen - wobble, 42, 96);
}
/* Les gains d'alignement s'essoufflent quand on est deja tres marque. */
function softenAlign(delta){
  if(!delta) return 0;
  const a = Math.abs(S.align);
  const sameDir = (delta>0 && S.align>=0) || (delta<0 && S.align<=0);
  if(!sameDir){ S.alignContradictions = (S.alignContradictions||0) + (Math.abs(delta)>=4 ? 1 : 0); return delta; }
  const f = a>=85 ? 0.25 : a>=70 ? 0.45 : a>=55 ? 0.7 : 1;
  return Math.round(delta*f*10)/10;
}

function computeStars(){
  const score = careerScore().total;
  if(score<=15) return 1;
  if(score<=30) return 2;
  if(score<=50) return 3;
  if(score<=65) return 4;
  if(score<=80) return 5;
  if(score<=90) return 6;
  return 7;
}
/* ---------- 8eme etoile doree, cachee : avoir reellement sauve (hero) ou detruit (villain) le multivers ---------- */
function eighthStarQualifies(){
  if(computeStars() < 7) return false;
  if(Math.abs(S.align) < 90) return false;
  return (S.trueCosmicWins||0) >= 2;
}
/* Seules 5% des carrieres sont meme capables d'y pretendre (tirage unique au debut de la partie). */
function tryGrantEighthStar(){
  if(S.eighthStar) return false;
  if(!S.eighthStarEligible) return false;
  if(!eighthStarQualifies()) return false;
  S.eighthStar = true;
  return true;
}

let _saveTimer = null;
function scheduleSaveGame(){
  if(!window.storage) return;
  if(!['mission','mentor','yearbreak','invite','summary'].includes(S.screen)) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{ saveGameState(); }, 400);
}
async function saveGameState(){
  if(!window.storage) return;
  try{ await window.storage.set('currentGame', JSON.stringify(S), false); }catch(e){ /* storage unavailable */ }
}
async function loadGameState(){
  if(!window.storage) return null;
  try{ const r = await window.storage.get('currentGame', false); return (r && r.value) ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function clearGameState(){
  if(!window.storage) return;
  try{ await window.storage.delete('currentGame', false); }catch(e){ /* nothing to clear */ }
}
function renderRankBadge(){
  let el = document.getElementById('rankBadgeFixed');
  if(!shouldShowSidebar()){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id='rankBadgeFixed'; el.className='rank-badge'; document.body.appendChild(el); }
  const zone = zoneOf(S.align);
  const label = zone==='hero'?t('rankHero'):(zone==='villain'?t('rankVillain'):t('rankNeutral'));
  const stars = computeStars();
  const cs = careerScore(); const score = cs.total;
  const eighth = S.eighthStar;
  const starColor = zone==='hero' ? '#ffd23f' : (zone==='villain' ? 'var(--red)' : '#b98bff');
  let starsHtml = ''; for(let i=1;i<=7;i++){ starsHtml += `<span style="color:${i<=stars?starColor:'rgba(255,255,255,.15)'}">&#9733;</span>`; }
  if(eighth) starsHtml += `<span style="color:var(--gold); text-shadow:0 0 10px var(--gold); margin-left:2px;">&#9733;</span>`;
  const factionHtml = S.team ? `<div style="display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-top:6px;">
      <span style="font-size:10px; font-weight:800; color:${charColor(S.team.side)};">${factionName(S.team.side, S.team.tier)}</span>
      <div style="width:24px;height:24px;">${factionEmblemSVG(S.team.side, S.team.tier, 24)}</div>
    </div>` : '';
  let loveHtml = '';

    const pc = CHARACTERS[S.romance.charKey];

  }

  if(stars > S.lastStars){ showRankUpToast(stars, zone); }

function pickReactorForZone(zone, excludeKey){
  const keys = Object.keys(CHARACTERS).filter(k=>CHARACTERS[k].align===zone && k!==excludeKey && k!==S.playerCharKey);
  if(!keys.length) return null;
  const known = keys.filter(k=>Math.abs(S.rel[k]||0) >= 3);
  const leaders = keys.filter(k=>k==='volt'||k==='boomnpc'||k==='warlock'||k==='titanwolf');
  const pool = known.length ? known : (leaders.length ? leaders : keys);
  return pick(pool);
}
function showSwitchAnnouncement(fromZone, toZone, cb){
  if(fromZone===toZone || (fromZone!=='hero'&&fromZone!=='villain')){ cb(); return; }
  const isFr = S.lang==='fr';
  const betrayerKey = pickReactorForZone(fromZone);
  const welcomerKey = pickReactorForZone(toZone);
  const betrayLine = betrayerKey ? pick(isFr?SWITCH_BETRAYAL_LINES_FR:SWITCH_BETRAYAL_LINES_EN).replace('{n}', isFr?CHARACTERS[betrayerKey].fr:CHARACTERS[betrayerKey].en) : '';
  const welcomeLines = toZone==='villain' ? (isFr?SWITCH_WELCOME_VILLAIN_FR:SWITCH_WELCOME_VILLAIN_EN) : (isFr?SWITCH_WELCOME_HERO_FR:SWITCH_WELCOME_HERO_EN);

  if(welcomerKey) S.rel[welcomerKey] = clamp((S.rel[welcomerKey]||0) + 3, -20, 20);

/* ---------- Ton ancien camp te rappelle parfois : force, faiblesse, ou tentative de recuperation ---------- */
function maybeOldSideReminder(){
  if(!S.turningPoints.length) return;
  if(Math.random() >= 0.12) return;
  const lastSwitch = S.turningPoints[S.turningPoints.length-1];
  const oldZone = lastSwitch.from;
  if(oldZone!=='hero' && oldZone!=='villain') return;
  if(zoneOf(S.align)===oldZone) return; // tu es deja revenu(e) de ce cote
  const reactorKey = pickReactorForZone(oldZone);
  if(!reactorKey) return;
  const isFr = S.lang==='fr'; const name = isFr?CHARACTERS[reactorKey].fr:CHARACTERS[reactorKey].en;
  const positive = Math.random() < 0.5;
  const lureFr = positive
    ? `${name} te recontacte. "On a toujours une place pour toi si tu reviens." Ses mots te redonnent un peu de force.`
    : `${name} te recontacte, amer. "Tu nous manques a decouvert. On n'oublie pas ceux qui partent." Le poids de la culpabilite pese sur toi.`;
  const lureEn = positive
    ? `${name} reaches out. "There's always a place for you if you come back." The words give you a bit of strength.`
    : `${name} reaches out, bitter. "You left us exposed. We don't forget the ones who leave." The guilt weighs on you.`;
  if(positive) S.stats.courage = clamp(S.stats.courage+2, 0, 100); else S.stats.popularity = clamp(S.stats.popularity-2, 0, 100);
  jarvisSay(lureFr, lureEn, isFr?'signal du passe':'signal from the past');
}
/* ---------- Trahison interne d'equipe, rare (7-8%) ---------- */
function maybeTeamBetrayal(){
  if(!S.team || S.teamBetrayalUsed) return;
  if(Math.random() >= 0.075) return;
  const mySide = zoneOf(S.align)==='villain' ? 'villain' : 'hero';
  const pool = otherCharKeys().filter(k=>CHARACTERS[k].align===mySide);
  if(!pool.length) return;
  const traitorKey = pick(pool);
  S.teamBetrayalUsed = true;
  S.traitorKey = traitorKey;
  S.rel[traitorKey] = clamp((S.rel[traitorKey]||0) - 8, -20, 20);
  const isFr = S.lang==='fr'; const name = isFr?CHARACTERS[traitorKey].fr:CHARACTERS[traitorKey].en;
  const facName = factionName(S.team.side, S.team.tier);
  const txtFr = `${name}, un(e) des votres au sein de ${facName}, retourne discretement sa veste. Tu l'apprends trop tard pour l'empecher.`;
  const txtEn = `${name}, one of your own within ${facName}, quietly switches sides. You find out too late to stop it.`;
  S.stats.popularity = clamp(S.stats.popularity-3, 0, 100);
  jarvisSay(txtFr, txtEn, isFr?'alerte interne':'internal alert');
}
function checkFactionExpulsion(){
  if(!S.team) return false;
  const zone = zoneOf(S.align); const stars = computeStars();
  let expelled = false, reasonBetrayal = false;
  if(zone !== 'neutral' && zone !== S.team.side){ expelled = true; reasonBetrayal = true; }
  else if(stars < S.team.tier - 1){ expelled = true; }
  if(!expelled) return false;
  const facName = factionName(S.team.side, S.team.tier);
  const label = reasonBetrayal
    ? (S.lang==='fr' ? `${facName} t'a exclu(e) sans appel apres ta trahison.` : `${facName} expelled you without appeal after your betrayal.`)
    : (S.lang==='fr' ? `${facName} t'a discretement ecarte(e), jugeant que tu n'etais plus a la hauteur.` : `${facName} quietly cut you loose, deeming you no longer up to standard.`);
  S.log.push({ year:S.currentYear, textFr:label, textEn:label, villain: S.team.side==='villain' });
  const key = S.team.side==='hero' ? 'invitedTierHero' : 'invitedTierVillain';
  S[key] = Math.max(0, S.team.tier - 2);
  S.team = null;
  showExpelToast(facName);
  renderRankBadge();
  const sideEl = document.querySelector('.side-avatar'); if(sideEl) sideEl.innerHTML = sideAvatarPanel();
  return true;
}

/* ---------- Avatar (proportioned silhouette, rim-lit, holographic) ---------- */
function morphConfig(m){
  const cfgs = {
    humain:  { shoulderW:96,  waistW:58, hipW:72, torsoH:130, limbW:20, headR:32, legLen:150, opacity:1,   blocky:false, skinBody:false, ghost:false },
    colosse: { shoulderW:134, waistW:80, hipW:94, torsoH:140, limbW:34, headR:34, legLen:150, opacity:1,   blocky:false, skinBody:true,  ghost:false },
    armure:  { shoulderW:114, waistW:70, hipW:88, torsoH:138, limbW:27, headR:36, legLen:150, opacity:1,   blocky:true,  skinBody:false, ghost:false },
    spectral:{ shoulderW:82,  waistW:50, hipW:60, torsoH:126, limbW:16, headR:30, legLen:140, opacity:0.5, blocky:false, skinBody:false, ghost:true },
    elance:  { shoulderW:78,  waistW:46, hipW:56, torsoH:124, limbW:14, headR:28, legLen:150, opacity:1,   blocky:false, skinBody:false, ghost:false },
  };
  return cfgs[m] || cfgs.humain;
}
function torsoPath(cx, top, shoulderW, waistW, hipW, h){
  const hs=shoulderW/2, hw=waistW/2, hh=hipW/2, waistY=top+h*0.48, bottom=top+h;
  return `M ${cx-hs} ${top}
    C ${cx-hs} ${top+h*0.16} ${cx-hw} ${top+h*0.3} ${cx-hw} ${waistY}
    C ${cx-hw} ${top+h*0.66} ${cx-hh} ${top+h*0.82} ${cx-hh} ${bottom}
    L ${cx+hh} ${bottom}
    C ${cx+hh} ${top+h*0.82} ${cx+hw} ${top+h*0.66} ${cx+hw} ${waistY}
    C ${cx+hw} ${top+h*0.3} ${cx+hs} ${top+h*0.16} ${cx+hs} ${top} Z`;
}
function limbPath(cx, top, len, wTop, wBottom){
  const rt=wTop/2, rb=wBottom/2, bottom=top+len;
  return `M ${cx-rt} ${top+rt} A ${rt} ${rt} 0 0 1 ${cx+rt} ${top+rt}
    L ${cx+rb} ${bottom-rb} A ${rb} ${rb} 0 0 1 ${cx-rb} ${bottom-rb} Z`;
}
function avatarSVG(){

  const light = rgbToHex(rgb[0]+45, rgb[1]+45, rgb[2]+45), dark = rgbToHex(rgb[0]*0.42, rgb[1]*0.42, rgb[2]*0.42);
  const pathColor = { tech:'#00e5ff', mystique:'#b98bff', physique:'#ffb020', psychique:'#37e6a8' }[S.path] || '#00e5ff';
  const uid = 'g'+Math.random().toString(36).slice(2,7);
  const cx=140, torsoTop=76, torsoBottom=torsoTop+cfg.torsoH;
  const isArmure = L.morphology==='armure';
  const helmet = isArmure ? 'full' : L.helmet;
  const glasses = (helmet==='full') ? 'none' : L.glasses;
  const symbol = (L.symbol||'').toUpperCase().slice(0,3);
  const headCy = torsoTop - cfg.headR*1.15;
  const totalH = torsoBottom + cfg.legLen + 46;
  const rim = cfg.ghost ? 0 : 2.4;

  let auraHtml = '';
  if(L.aura==='flame'){ auraHtml = `<circle cx="${cx}" cy="${torsoTop+cfg.torsoH*0.45}" r="${cfg.shoulderW*0.95}" fill="#ff7a1f" opacity="0.12"><animate attributeName="r" values="${cfg.shoulderW*0.95};${cfg.shoulderW*1.2};${cfg.shoulderW*0.95}" dur="2.4s" repeatCount="indefinite"/></circle>`; }
  else if(L.aura==='electric'){ auraHtml = `<circle cx="${cx}" cy="${torsoTop+cfg.torsoH*0.45}" r="${cfg.shoulderW*0.95}" fill="#00e5ff" opacity="0.1"><animate attributeName="opacity" values="0.05;0.18;0.05" dur="1s" repeatCount="indefinite"/></circle>`; }
  else if(L.aura==='dark'){ auraHtml = `<circle cx="${cx}" cy="${torsoTop+cfg.torsoH*0.45}" r="${cfg.shoulderW*0.9}" fill="#5b2b8a" opacity="0.17"><animate attributeName="r" values="${cfg.shoulderW*0.9};${cfg.shoulderW*1.15};${cfg.shoulderW*0.9}" dur="3.2s" repeatCount="indefinite"/></circle>`; }

  let weaponHtml = '';
  if(L.weapon==='sword'){ weaponHtml = `<rect x="${cx+cfg.shoulderW/2+38}" y="${torsoTop+30}" width="7" height="96" rx="3" fill="${pathColor}" filter="url(#${uid}glow)" transform="rotate(16 ${cx+cfg.shoulderW/2+42} ${torsoTop+78})"/>`; }
  else if(L.weapon==='shield'){ weaponHtml = `<ellipse cx="${cx-cfg.shoulderW/2-34}" cy="${torsoTop+70}" rx="19" ry="27" fill="${secondary}" stroke="${pathColor}" stroke-width="3"/>`; }
  else if(L.weapon==='spear'){ weaponHtml = `<rect x="${cx+cfg.shoulderW/2+40}" y="${torsoTop-10}" width="5" height="160" fill="${secondary}"/><polygon points="${cx+cfg.shoulderW/2+42.5},${torsoTop-22} ${cx+cfg.shoulderW/2+35},${torsoTop-4} ${cx+cfg.shoulderW/2+50},${torsoTop-4}" fill="${pathColor}"/>`; }

  const glovesR = L.gloves==='armored' ? (cfg.limbW*0.62) : (L.gloves==='claws' ? (cfg.limbW*0.42) : (cfg.limbW*0.5));
  const armLen = cfg.torsoH*0.72, armTop = torsoTop+8;

async function saveCareerToHistory(){
  if(!window.storage || S.savedToHistory) return;
  try{
    const uniqueLocs = {}; S.locations.forEach(l=>{ uniqueLocs[l.type+':'+l.name]=l; });
    const zone = zoneOf(S.align);
    const ts = Date.now();
    const record = {
      heroName: S.heroName, mode: S.mode,
      years: S.dead ? S.deathInfo.year : S.missionsPlan.length,
      missionsTotal: S.totalMissionsDone, align: S.align, zone,
      dead: S.dead, deathCause: S.dead ? S.deathInfo.cause : null,
      team: S.team, fightsWon: S.combat.won, fightsLost: S.combat.lost,
      locationsCount: Object.keys(uniqueLocs).length, mentees: S.mentees.length,
      morphology: S.look.morphology, path: S.path, stars: computeStars(),
      timestamp: ts, stateKey: 'career_state:'+ts,
    };
    const key = 'career:'+ts+'_'+Math.random().toString(36).slice(2,6);
    await window.storage.set(key, JSON.stringify(record), false);
    /* Etat complet, pour pouvoir revoir le bilan detaille ou relancer cette carriere plus tard. */
    await window.storage.set(record.stateKey, JSON.stringify(S), false);
    S.savedToHistory = true;
  }catch(e){ /* storage unavailable - silently skip */ }
}
async function loadCareerHistory(box){
  if(!window.storage){ box.innerHTML = `<p class="lead" style="text-align:center; margin:0 auto;">${S.lang==='fr'?'Historique indisponible dans ce contexte.':'History unavailable in this context.'}</p>`; return; }
  try{
    const listResult = await window.storage.list('career:', false);
    const keys = (listResult && listResult.keys ? listResult.keys.slice() : []).sort().reverse().slice(0,12);
    if(!keys.length){ box.innerHTML = `<p class="lead" style="text-align:center; margin:0 auto;">${S.lang==='fr'?'Aucune carriere enregistree pour le moment.':'No career saved yet.'}</p>`; return; }
    const items = [];
    for(const k of keys){
      try{ const r = await window.storage.get(k, false); if(r && r.value) items.push({ key:k, data: JSON.parse(r.value) }); }catch(e){}
    }
    renderCareerHistoryList(box, items);
  }catch(e){ box.innerHTML = `<p class="lead" style="text-align:center; margin:0 auto;">${S.lang==='fr'?'Historique indisponible.':'History unavailable.'}</p>`; }
}
function renderCareerHistoryList(box, items){
  if(!items.length){ box.innerHTML = `<p class="lead" style="text-align:center; margin:0 auto;">${S.lang==='fr'?'Aucune carriere enregistree pour le moment.':'No career saved yet.'}</p>`; return; }
  box.innerHTML = `<div class="history-list">${items.map(it=>{
    const c = it.data;
    const zoneLabel = c.zone==='hero'?t('alignHero'):(c.zone==='villain'?t('alignVillain'):t('alignNeutral'));
    const zoneColor = c.zone==='hero'?'#00e5ff':(c.zone==='villain'?'var(--red)':'#b98bff');
    const dateStr = new Date(c.timestamp).toLocaleDateString(S.lang==='fr'?'fr-FR':'en-US');
    const canReplay = c.stateKey && !c.dead;
    return `<div class="history-card">
      <button class="history-del" data-key="${it.key}" title="${S.lang==='fr'?'Supprimer':'Delete'}">&times;</button>
      <div class="hc-name">${c.heroName}${c.dead ? ' &#10013;':''}</div>
      <div class="hc-meta" style="color:${zoneColor};">${zoneLabel} - ${'&#9733;'.repeat(c.stars||1)}</div>
      <div class="hc-meta">${c.years} ${S.lang==='fr'?'ans':'yrs'} - ${c.missionsTotal} ${S.lang==='fr'?'missions':'missions'} - ${dateStr}</div>
      ${c.stateKey ? `<div class="hc-actions" style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;">
        <button class="btn ghost hc-view" data-statekey="${c.stateKey}" style="font-size:11px; padding:6px 10px;">${S.lang==='fr'?'Voir le bilan':'View report'}</button>
        ${canReplay ? `<button class="btn cyan hc-replay" data-statekey="${c.stateKey}" style="font-size:11px; padding:6px 10px;">${S.lang==='fr'?'Relancer +5 ans':'Replay +5 years'}</button>` : ''}
      </div>` : ''}
    </div>`;
  }).join('')}</div>
  <div class="actions" style="justify-content:center;"><button class="btn ghost" id="clearHistory" style="font-size:12px; padding:8px 16px;">${S.lang==="fr"?"Vider l'historique":"Clear history"}</button></div>`;
  box.querySelectorAll('.history-del').forEach(btn=>{
    btn.onclick = async ()=>{ try{ await window.storage.delete(btn.dataset.key, false); }catch(e){} loadCareerHistory(box); };
  });
  box.querySelectorAll('.hc-view').forEach(btn=>{
    btn.onclick = async ()=>{
      try{ const r = await window.storage.get(btn.dataset.statekey, false); if(r && r.value){ S = JSON.parse(r.value); S.screen='end'; render(); } }
      catch(e){}
    };
  });
  box.querySelectorAll('.hc-replay').forEach(btn=>{
    btn.onclick = async ()=>{
      try{ const r = await window.storage.get(btn.dataset.statekey, false); if(r && r.value){ S = JSON.parse(r.value); S.savedToHistory = false; extendCareer(5); } }
      catch(e){}
    };
  });
  const clearBtn = box.querySelector('#clearHistory');
  if(clearBtn) clearBtn.onclick = async ()=>{ for(const it of items){ try{ await window.storage.delete(it.key, false); }catch(e){} } loadCareerHistory(box); };
}
function applyPreset(p){
  S.usingPreset = true; S.look = Object.assign({}, S.look, p.look, { morphology:p.morphology });
  S.path = p.path; S.powers = p.powers.slice(); S.align = p.align || 0; S.lastZone = zoneOf(S.align);
  S.initialAlignMagnitude = Math.abs(p.align||0);
  S.reputationFloor = S.initialAlignMagnitude;
  S.startSide = (p.align||0) > 5 ? 'hero' : ((p.align||0) < -5 ? 'villain' : 'neutral');
  S.heroName = S.lang==='fr'?p.heroFr:p.heroEn;
  S.portrait = p.img || null; S.playerCharKey = p.charKey || null;
  S.playerSex = p.sex || ((p.charKey && CHARACTERS[p.charKey] && CHARACTERS[p.charKey].sex) || 'm');
  S.presetId = p.id;
  const st = p.stats || {};
  S.stats = {
    courage: Math.max(5, Math.min(95, 50 + (st.courage||0))),
    intelligence: Math.max(5, Math.min(95, 50 + (st.intelligence||0))),
    popularity: Math.max(5, Math.min(95, 50 + (st.popularity||0)))
  };
  S.presetPerk = S.lang==='fr'?p.perkFr:p.perkEn;
  S.presetFlaw = S.lang==='fr'?p.flawFr:p.flawEn;
}

async function ffDownscale(dataUrl, maxW, maxH, quality){
  return new Promise((res)=>{
    const img = new Image();
    img.onload = ()=>{
      const r = Math.min(maxW/img.width, maxH/img.height, 1);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg', quality||0.85));
    };
    img.onerror = ()=>res(dataUrl);
    img.src = dataUrl;
  });
}

/* ---------- Generation IA (Lovable AI, cote serveur) ---------- */
const FF_MAX_TRIES = 3;

function ffHttpError(status, body){
  const fr = S.lang==='fr';
  let msg = '';
  try{ const j = JSON.parse(body); msg = (j && (j.message || (j.error && j.error.message))) || ''; }catch(e){}
  if(status === 429){
    return new Error(fr ? "Trop de generations d'un coup. Attends une dizaine de secondes puis relance."
      : "Too many generations at once. Wait ten seconds and retry.");
  }
  if(status === 402 || status === 403){
    return new Error(fr ? ("Generation IA indisponible" + (msg ? " - " + msg : "") + ". Choisis un personnage existant pour continuer.")
      : ("AI generation unavailable" + (msg ? " - " + msg : "") + ". Pick an existing character to continue."));
  }
  if(status >= 500){
    return new Error(fr ? "Le service IA a eu un raté. Relance la generation." : "The AI service glitched. Retry the generation.");
  }
  return new Error((fr?'Generation refusee ':'Generation refused ') + status + (msg ? ' - ' + msg : ''));
}

/* Portrait genere par l'IA du projet (Lovable AI). Pas de cle a fournir par le joueur. */
async function ffGenerate(onFrame){
  const body = { image: FF.photo, prompt: ffPrompt() };
  const res = await fetch('/api/generate-hero', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const txt = await res.text().catch(()=>'');
  if(!res.ok) throw ffHttpError(res.status, txt);
  let j = null; try{ j = JSON.parse(txt); }catch(e){}
  const b64 = j && j.data && j.data[0] && j.data[0].b64_json;
  if(!b64) throw new Error(S.lang==='fr' ? "L'IA n'a renvoye aucune image. Relance la generation." : "The AI returned no image. Retry the generation.");
  onFrame('data:image/png;base64,' + b64, true);
}

  const h = Math.floor(min/60); const m = min % 60;
  if(m === 0) return '~' + h + ' h';

/* ---------- Mission engine ---------- */
/* Les questions d'orientation (choisir son camp) sont rares : 2 par carriere courte, 3-4 sur une longue. */
function orientationCap(){ const y = S.years||10; return y >= 30 ? 3 : (y >= 15 ? 2 : 1); }
function orientationBudgetLeft(){
  if(S.orientationCount===undefined) S.orientationCount = 0;
  if(S.orientationCount >= orientationCap()) return false;
  const last = (S.lastOrientationYear===undefined || S.lastOrientationYear===null) ? -99 : S.lastOrientationYear;
  const gap = Math.max(6, Math.round((S.years||10)/4));
  return (S.currentYear - last) >= gap && S.currentYear >= 3;
}
function pickIntrigueMission(){
  if(!S.usedIntrigueIds) S.usedIntrigueIds = [];
  const zone = zoneOf(S.align)==='villain'?'villain':'hero';
  let pool = INTRIGUE_MISSIONS.filter(m=>!S.usedIntrigueIds.includes(m.id) && (!m.sideOnly || m.sideOnly===zone));
  if(!pool.length){ S.usedIntrigueIds = []; pool = INTRIGUE_MISSIONS.filter(m=>!m.sideOnly || m.sideOnly===zone); }
  const m = pick(pool); S.usedIntrigueIds.push(m.id);
  return Object.assign({}, m, { intrigue:true, type:'social', danger:0, scope:1, location: { name: randLocationName(1), type: 1 } });
}
function pickMission(){
  const rank = computeStars();
  if(orientationBudgetLeft() && Math.random() < 0.07){
    let pPool = PIVOTAL_MISSIONS.filter((m,i)=>!S.usedPivotalIds.includes(i) && (!m.charKey || m.charKey!==S.playerCharKey));
    if(pPool.length===0){ S.usedPivotalIds = []; pPool = PIVOTAL_MISSIONS; }
    const idx = PIVOTAL_MISSIONS.indexOf(pick(pPool)); S.usedPivotalIds.push(idx);
    const m = PIVOTAL_MISSIONS[idx];
    S.orientationCount = (S.orientationCount||0) + 1; S.lastOrientationYear = S.currentYear;
    return Object.assign({}, m, { pivotal:true, type:'social', danger:0, scope:1, location: { name: randLocationName(1), type: 1 } });
  }
  /* Intrigues : enquetes, politique, presse, secrets... pour que le jeu avance sans combat. */
  if(Math.random() < 0.26){ return pickIntrigueMission(); }
  if(Math.random() < 0.24){ return generateSignatureMission(rank); }
  if(Math.random() < 0.83){ return zoneOf(S.align)==='villain' ? generateVillainMission(rank) : generateProceduralMission(rank); }

  let reachable = MISSIONS.filter(m => (m.scope||1) <= rank);
  if(reachable.length===0) reachable = MISSIONS.filter(m=>(m.scope||1)===1);
  reachable = reachable.filter(m=>!m.charKey || m.charKey!==S.playerCharKey);
  reachable = reachable.filter(m=>!m.sideOnly || m.sideOnly===(zoneOf(S.align)==='villain'?'villain':'hero'));
  let pool = reachable.filter(m=>!S.usedIds.includes(m.id));
  if(pool.length===0){ pool = reachable; S.usedIds = S.usedIds.filter(id=>!reachable.some(m=>m.id===id)); }
  pool = shuffle(pool); const m = pool[0]; S.usedIds.push(m.id);
  return Object.assign({}, m, { location: { name: randLocationName(m.scope||1), type: m.scope||1 } });
}
/* ---------- Recrues : ce sont les figures historiques de Volt Industries / PERDITION ---------- */
function recruitSideKey(){ return zoneOf(S.align)==='villain' ? 'villain' : 'hero'; }
function menteeKeys(){ return (S.mentees||[]).map(m=>m.charKey).filter(Boolean); }
function livingMentees(){ return (S.mentees||[]).filter(m=>m.charKey && m.outcome!=='died'); }
function recruitCandidates(){
  const taken = menteeKeys();
  const side = recruitSideKey();
  const leaders = ['theg','siddartha'];
  return ROOKIE_KEYS.filter(k=>{
    if(k===S.playerCharKey || taken.includes(k) || leaders.includes(k)) return false;
    if(S.romance && S.romance.active && S.romance.charKey===k) return false;
    return CHARACTERS[k] && CHARACTERS[k].align===side;
  });
}
function shouldTriggerMentor(){
  if(S.currentYear < 4) return false;
  if(S.mentorCount >= (S.mentorCap||1)) return false;
  if(S.lastMentorYear!=null && (S.currentYear - S.lastMentorYear) < 2) return false;
  if(!recruitCandidates().length) return false;
  return Math.random() < 0.46;
}
/* Entrainements et suivis : plusieurs etapes par recrue, tres regulierement. */
function shouldTriggerRecruitArc(){
  if(!livingMentees().length) return false;
  if(S.lastArcYear!=null && (S.currentYear - S.lastArcYear) < 1) return false;
  return Math.random() < 0.55;
}
function startMentorScene(){
  const cands = recruitCandidates(); if(!cands.length) return false;
  const key = pick(cands); const c = CHARACTERS[key];
  const usedIds = S.usedMentorIds || (S.usedMentorIds=[]);
  let pool = MENTOR_MISSIONS.filter(m=>!usedIds.includes(m.id));
  if(!pool.length){ S.usedMentorIds = []; pool = MENTOR_MISSIONS.slice(); }
  const m = pick(pool); S.usedMentorIds.push(m.id);
  S.mentorCount += 1; S.lastMentorYear = S.currentYear;
  S.currentMission = Object.assign({}, m, { recruitKey:key, recruitName:(S.lang==='fr'?c.fr:c.en), arc:false });
  S.screen='mentor'; render(); maybeTriggerConversation(); return true;
}
function startRecruitArc(){
  const live = livingMentees(); if(!live.length) return false;
  const mentee = pick(live); const c = CHARACTERS[mentee.charKey]; if(!c) return false;
  const usedIds = S.usedArcIds || (S.usedArcIds=[]);
  const beats = mentee.beats||1;
  /* Les premieres etapes sont des entrainements, les arcs narratifs viennent ensuite. */
  const source = beats < 3 ? MENTOR_DRILLS.concat(RECRUIT_ARCS) : RECRUIT_ARCS.concat(MENTOR_DRILLS);
  let pool = source.filter(m=>!usedIds.includes(m.id+':'+mentee.charKey));
  if(!pool.length){ pool = source.slice(); }
  const m = pick(pool); S.usedArcIds.push(m.id+':'+mentee.charKey);
  S.lastArcYear = S.currentYear;
  S.currentMission = Object.assign({}, m, { recruitKey:mentee.charKey, recruitName:(S.lang==='fr'?c.fr:c.en), arc:true });
  S.screen='mentor'; render(); maybeTriggerConversation(); return true;
}
/* ---------- Confrontation avec une ancienne recrue passee de l'autre cote : convertir, affronter, ou laisser filer ---------- */
function shouldTriggerCrossedMenteeArc(){
  if(!crossedMentees().length) return false;
  if(S.lastCrossedArcYear!=null && (S.currentYear - S.lastCrossedArcYear) < 2) return false;
  return Math.random() < 0.35;
}
function startCrossedMenteeArc(){
  const crossed = crossedMentees(); if(!crossed.length) return false;
  const mentee = pick(crossed); const c = CHARACTERS[mentee.charKey]; if(!c) return false;
  const name = S.lang==='fr'?c.fr:c.en;
  const mySide = zoneOf(S.align)==='villain' ? 'villain' : 'hero';
  const m = {
    id:'crossed_confront', tagFr:'Ancienne recrue - camp oppose', tagEn:'Former recruit - opposing side',
    fr:`Tu croises {name}, ton ancienne recrue, desormais de l'autre cote. Son regard ne laisse aucun doute sur ce qu'il/elle pense de toi maintenant.`,
    en:`You run into {name}, your former recruit, now on the other side. Their look leaves no doubt what they think of you now.`,
    choices:[
      { fr:"Tenter de le/la convertir a nouveau vers ton camp.", en:"Try to win them back to your side.", eff:{align:2, intelligence:2}, recruit:mySide, convertAttempt:true },
      { fr:"L'affronter directement, sans detour.", en:"Confront them directly, no detour.", eff:{courage:2}, recruit:mentee.outcome, forceBattle:true },
      { fr:"Le/la laisser filer - ce n'est plus ton combat.", en:"Let them go - this isn't your fight anymore.", eff:{align:-1}, recruit:mentee.outcome },
    ]};
  S.currentMission = Object.assign({}, m, { recruitKey:mentee.charKey, recruitName:name, arc:true, crossed:true });

}
/* ---------- Evenement Majeur : rare, mais capable de faire bondir le score d'un seul coup si tu le remportes ---------- */
function shouldTriggerGrandEvent(){
  if(S.currentYear < 3) return false;
  if(S.lastGrandEventYear!=null && (S.currentYear - S.lastGrandEventYear) < 3) return false;
  return Math.random() < 0.12;
}
function startGrandEvent(){
  const mySide = zoneOf(S.align)==='villain' ? 'villain' : 'hero';
  const pool = otherCharKeys().filter(k=>CHARACTERS[k].align && CHARACTERS[k].align!=='neutral' && CHARACTERS[k].align!==mySide);
  const foeKey = pool.length ? pick(pool) : null;
  const villainSide = mySide==='villain';
  // Un evenement majeur depasse toujours ton niveau habituel, mais reste cohesif avec ton rang actuel (pas un bond a l'aveugle vers le cosmique).
  const eventScope = clamp(computeStars() + 2, 4, 7);
  const m = {
    id:'grand_event', type:'combat', danger:3, scope:eventScope, grandEvent:true, charKey:foeKey,
    tagFr:'EVENEMENT MAJEUR', tagEn:'MAJOR EVENT',
    fr:"Une crise d'ampleur historique frappe plusieurs mondes a la fois. Ce qui se joue aujourd'hui restera dans les annales, quel que soit ton camp.",
    en:"A crisis of historic scale strikes several worlds at once. What happens today will be remembered, whichever side you're on.",
    location: { name: randLocationName(eventScope), type:eventScope },
    choices:[
      { fr:"Foncer au coeur de la crise, sans reserve.", en:"Charge straight into the crisis, holding nothing back.", eff:{courage:6, popularity:4, align: villainSide?-6:6} },
      { fr:"Coordonner la riposte avec sang-froid.", en:"Coordinate the response with cold precision.", eff:{intelligence:6, popularity:3, align: villainSide?-4:4} },
      { fr:"Saisir l'occasion pour asseoir ta reputation, quoi qu'il en coute.", en:"Seize the moment to cement your reputation, whatever the cost.", eff:{courage:4, intelligence:2, popularity:2, align: villainSide?-8:2} },
    ]};
  S.currentMission = m; S.screen='mission'; render(); afterMissionRender(m);
  S.lastGrandEventYear = S.currentYear;
  return true;
}
/* Les propositions de clan ne tombent pas a chaque palier : elles dependent du palmares,
   de la popularite, de la nettete de la trajectoire, et restent rares (2-3 par carriere). */
function checkTeamInvite(){
  const zone = zoneOf(S.align);
  if(zone==='neutral' || S.totalMissionsDone < 10) return false;
  const tier = computeStars();
  const key = zone==='hero' ? 'invitedTierHero' : 'invitedTierVillain';
  if(tier <= S[key]) return false;
  if(Math.abs(S.align) < 55) return false;
  if(S.inviteCount===undefined) S.inviteCount = 0;
  const cap = (S.years||10) >= 30 ? 2 : 1;
  if(S.inviteCount >= cap) return false;
  const last = (S.lastInviteYear===undefined || S.lastInviteYear===null) ? -99 : S.lastInviteYear;
  const gap = S.team ? 14 : 7;
  if(S.currentYear - last < gap) return false;
  const fights = S.combat.won + S.combat.lost;
  const winRate = fights ? S.combat.won/fights : 0.35;
  let p = 0.06 + winRate*0.18 + (S.stats.popularity-58)/420 + (S.locations.length>=4 ? 0.04 : 0);
  if(S.team) p -= 0.10;
  if(Math.random() > clamp(p, 0.02, 0.26)) return false;
  S[key] = tier; S.inviteCount += 1; S.lastInviteYear = S.currentYear;
  S.pendingReturnScreen = S.screen; S.screen = 'invite'; S.inviteSide = zone; S.inviteTier = tier;
  return true;
}
function pushYearHistoryIfDone(){ S.yearsHistory.push({ year: S.currentYear, entries: S.currentYearEntries.slice(), endAlign: S.align }); S.currentYearEntries = []; }
function nextMission(){
  /* Former une recrue ajoute une etape supplementaire dans l'annee. */
  const mentorSteps = Math.min(2, livingMentees().length);
  const missionsThisYear = S.missionsPlan[S.currentYear-1] + mentorSteps;
  if(S.currentMissionInYear >= missionsThisYear){
    pushYearHistoryIfDone();
    if(S.currentYear >= S.missionsPlan.length){ S.screen='end'; render(); return; }
    S.screen='yearbreak'; render(); return;
  }
  S.currentMissionInYear += 1; S.totalMissionsDone += 1;
  if(shouldTriggerTraining()){ S.trainingOffer = skillCandidates(); S.screen='training'; render(); return; }
  if(!S.peacefulEra && shouldTriggerGrandEvent() && startGrandEvent()) return;
  if(shouldTriggerCrossedMenteeArc() && startCrossedMenteeArc()){ S.lastCrossedArcYear = S.currentYear; return; }
  if(shouldTriggerMentor() && startMentorScene()) return;
  if(shouldTriggerRecruitArc() && startRecruitArc()) return;
  S.pendingBattleWin = null;
  S.currentMission = S.peacefulEra ? pickIntrigueMission() : pickMission(); S.screen='mission'; render(); afterMissionRender(S.currentMission);
}
function missionEpicness(mission){
  if(!mission || mission.type!=='combat') return 'none';
  if((mission.scope||1)>=7) return 'cosmic';
  if((mission.scope||1)>=6) return 'system';
  if((mission.danger||0)>=3 || (mission.scope||1)>=5) return 'epic';
  if((mission.danger||0)>=2) return 'major';
  return 'none';
}

/* ---------- Carte-trophee doree de la 8eme etoile, generee en canvas et telechargeable en PNG ---------- */
function drawStarPath(ctx, cx, cy, points, outerR, innerR){
  ctx.beginPath();
  const step = Math.PI / points;
  let rot = -Math.PI/2;
  ctx.moveTo(cx + Math.cos(rot)*outerR, cy + Math.sin(rot)*outerR);
  for(let i=0;i<points;i++){
    rot += step; ctx.lineTo(cx + Math.cos(rot)*innerR, cy + Math.sin(rot)*innerR);
    rot += step; ctx.lineTo(cx + Math.cos(rot)*outerR, cy + Math.sin(rot)*outerR);
  }
  ctx.closePath();
}
function wrapCenteredText(ctx, text, cx, cy, maxWidth, lineHeight){
  const words = text.split(' '); let line = ''; const lines = [];
  for(let n=0;n<words.length;n++){
    const test = line + words[n] + ' ';
    if(ctx.measureText(test).width > maxWidth && n>0){ lines.push(line.trim()); line = words[n] + ' '; }
    else line = test;
  }
  lines.push(line.trim());
  const startY = cy - (lines.length-1)*lineHeight/2;
  lines.forEach((l,i)=> ctx.fillText(l, cx, startY + i*lineHeight));
  return lines.length;
}
function generateTrophyCardCanvas(){
  const isFr = S.lang==='fr'; const villain = zoneOf(S.align)==='villain';
  const W = 1080, H = 1350, cx = W/2;
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const goldA = '#ffe38a', gold = '#ffd23f', goldDark = '#a9761f';
  // Fond degrade sombre
  const bg = ctx.createLinearGradient(0,0,0,H);
  if(villain){ bg.addColorStop(0,'#170406'); bg.addColorStop(.5,'#2a070a'); bg.addColorStop(1,'#0c0304'); }
  else { bg.addColorStop(0,'#070a14'); bg.addColorStop(.5,'#111a2e'); bg.addColorStop(1,'#06080f'); }
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  // Halo central lumineux
  const glow = ctx.createRadialGradient(cx, H*0.32, 40, cx, H*0.32, W*0.78);
  glow.addColorStop(0, villain? 'rgba(255,120,60,.38)' : 'rgba(255,210,63,.4)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);
  // Rayons subtils
  ctx.save(); ctx.globalAlpha = .1; ctx.strokeStyle = gold; ctx.lineWidth = 2;
  for(let a=0;a<360;a+=12){ const r1=140, r2=W*0.8; const rad=a*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(rad)*r1, H*0.32+Math.sin(rad)*r1); ctx.lineTo(cx+Math.cos(rad)*r2, H*0.32+Math.sin(rad)*r2); ctx.stroke(); }
  ctx.restore();
  // Cadre dore double
  const pad = 34;
  ctx.strokeStyle = gold; ctx.lineWidth = 7; ctx.strokeRect(pad,pad,W-pad*2,H-pad*2);
  ctx.strokeStyle = 'rgba(255,210,63,.45)'; ctx.lineWidth = 1.5; ctx.strokeRect(pad+16,pad+16,W-(pad+16)*2,H-(pad+16)*2);
  // Coins decoratifs
  [[pad+16,pad+16,1,1],[W-pad-16,pad+16,-1,1],[pad+16,H-pad-16,1,-1],[W-pad-16,H-pad-16,-1,-1]].forEach(([x,y,sx,sy])=>{
    ctx.strokeStyle = gold; ctx.lineWidth = 4; ctx.beginPath();
    ctx.moveTo(x, y+34*sy); ctx.lineTo(x, y); ctx.lineTo(x+34*sx, y); ctx.stroke();
  });
  // Grande etoile a 8 branches, brillante
  ctx.shadowColor = gold; ctx.shadowBlur = 70;
  const starGrad = ctx.createRadialGradient(cx,225,10,cx,225,110);
  starGrad.addColorStop(0,'#fffbe6'); starGrad.addColorStop(.45, goldA); starGrad.addColorStop(1, goldDark);
  ctx.fillStyle = starGrad;
  drawStarPath(ctx, cx, 225, 8, 100, 46); ctx.fill();
  ctx.shadowBlur = 0;
  // Titre
  ctx.textAlign = 'center';
  ctx.fillStyle = gold; ctx.font = '900 30px Arial, sans-serif';
  ctx.fillText((isFr?'8EME ETOILE DEBLOQUEE':'8TH STAR UNLOCKED'), cx, 388);
  // Accroche principale
  ctx.fillStyle = '#ffffff'; ctx.font = '900 52px Arial, sans-serif';
  const mainLine = villain ? (isFr?"LE MULTIVERS EST TOMBE":"THE MULTIVERSE HAS FALLEN") : (isFr?"LE MULTIVERS EST SAUVE":"THE MULTIVERSE IS SAVED");
  const nLines = wrapCenteredText(ctx, mainLine, cx, 480, W-180, 60);
  // Nom du heros/villain
  const nameY = 480 + (nLines*30) + 90;
  ctx.font = '700 34px Arial, sans-serif'; ctx.fillStyle = villain ? '#ff5c6e' : '#4fd3ff';
  ctx.fillText((S.heroName||'').toUpperCase(), cx, nameY);
  ctx.font = '400 22px Arial, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.fillText(villain ? (isFr?'VILLAIN LEGENDAIRE':'LEGENDARY VILLAIN') : (isFr?'HEROS LEGENDAIRE':'LEGENDARY HERO'), cx, nameY+34);
  // Ligne de statistiques
  const cs = careerScore(); const stars = computeStars();
  ctx.font = '600 25px Arial, sans-serif'; ctx.fillStyle = '#ffffff';
  const starsStr = '\u2605'.repeat(stars) + '\u2605';
  ctx.fillText(`${isFr?'Score':'Score'} ${cs.total}/100  \u2022  ${isFr?'Annee':'Year'} ${S.currentYear}`, cx, nameY+100);
  ctx.fillStyle = gold; ctx.font = '600 32px Arial, sans-serif';
  ctx.fillText(starsStr, cx, nameY+150);
  // Pied de carte
  ctx.font = '400 18px Arial, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.5)';
  const dateStr = new Date().toLocaleDateString(isFr?'fr-FR':'en-US');
  ctx.fillText(`VOLT INDUSTRIES \u2014 ${dateStr}`, cx, H-64);
  return canvas;
}
function downloadTrophyCard(){
  const canvas = generateTrophyCardCanvas();
  canvas.toBlob(blob=>{
    if(!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `8eme-etoile-${(S.heroName||'heros').replace(/[^a-z0-9]+/gi,'_')}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/png');
}

function learnedSkills(){ return (S.skills||[]).map(id=>SKILLS.find(x=>x.id===id)).filter(Boolean); }
function skillCandidates(){
  const known = S.skills||[];
  const pool = SKILLS.filter(sk=>!known.includes(sk.id));
  const fit = pool.filter(sk=>sk.tags.length && sk.tags.some(tg=>(S.powers||[]).includes(tg)));
  const generic = pool.filter(sk=>!sk.tags.length);
  const base = fit.length ? fit : (generic.length ? generic : pool);
  const extra = pool.filter(x=>!base.includes(x));
  return shuffle(base).slice(0,2).concat(shuffle(extra).slice(0,1));
}
function shouldTriggerTraining(){
  if(!S.currentMission && S.screen!=='mission') { /* noop */ }
  if((S.skills||[]).length >= (S.mode==='short'?2:5)) return false;
  if(S.currentYear < 3) return false;
  if(S.lastTrainingYear!=null && (S.currentYear - S.lastTrainingYear) < (S.mode==='short'?4:6)) return false;
  return Math.random() < 0.35;
}
function learnSkill(sk){
  S.skills = S.skills || [];
  if(!S.skills.includes(sk.id)) S.skills.push(sk.id);
  const b = sk.bonus||{};
  const impacts = [];
  ['courage','intelligence','popularity'].forEach(k=>{ if(b[k]){ S.stats[k] = clamp(S.stats[k] + b[k], 0, 100); impacts.push({ label: statLabel(k), delta: b[k] }); } });
  impacts.push({ label:(S.lang==='fr'?'Nouvelle attaque':'New move'), text:(S.lang==='fr'?sk.move.fr:sk.move.en) });
  showImpact(impacts, (S.lang==='fr'?`Competence apprise : ${sk.fr}`:`Skill learned: ${sk.en}`));
  const label = S.lang==='fr' ? `Retour d'exil : maitrise de ${sk.fr}.` : `Back from exile: mastered ${sk.en}.`;
  S.log.push({ year:S.currentYear, textFr:label, textEn:label, villain:false });
  S.currentYearEntries.push({ tag: label, location:null, type:'training', outcome:'skill' });
}

function choiceAlignTendency(choice){
  const eff = choice.eff || {};
  let a = eff.align || 0;
  if(eff.flip || eff.reinforce) a = a || (eff.magnitude || 5);
  if(choice.recruit==='hero') a = Math.max(a, 3);
  if(choice.recruit==='villain') a = Math.min(a, -3);
  return a;
}
function choiceColorFor(choice){
  const a = choiceAlignTendency(choice);
  if(a > 1) return '#3aa0ff';   // tendance heros : bleu
  if(a < -1) return '#ff3b5c';  // tendance villain : rouge
  return '#b98bff';             // tendance neutre : violet
}
function statLabel(k){
  const fr = { courage:'Attaque', intelligence:'Intelligence', popularity:'Popularite', align:'Alignement' };
  const en = { courage:'Attack', intelligence:'Intelligence', popularity:'Popularity', align:'Alignment' };
  return (S.lang==='fr'?fr:en)[k] || k;
}
function showImpact(items, title){
  const list = (items||[]).filter(x=>x && (x.delta || x.text));
  if(!list.length) return;
  const old = document.getElementById('impactToast'); if(old) old.remove();
  const el = document.createElement('div'); el.id='impactToast'; el.className='impact-toast';
  el.innerHTML = `${title?`<div class="it-title">${title}</div>`:''}<div class="it-rows">${list.map(x=>{
    if(x.text) return `<span class="it-row neutral">${x.label} : ${x.text}</span>`;
    const up = x.delta > 0;
    return `<span class="it-row ${up?'up':'down'}">${up?'+':''}${x.delta} ${x.label}</span>`;
  }).join('')}</div>`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 500); }, 2600);
}
function impactFromEff(eff, alignDelta){
  const items = [];
  ['courage','intelligence','popularity'].forEach(k=>{ if(eff && eff[k]) items.push({ label:statLabel(k), delta:eff[k] }); });
  if(alignDelta) items.push({ label:(S.lang==='fr'?(alignDelta>0?'vers Hero':'vers Villain'):(alignDelta>0?'toward Hero':'toward Villain')), delta:alignDelta });
  if(eff && eff.rel){ Object.keys(eff.rel).forEach(k=>{ const c = CHARACTERS[k]; if(c) items.push({ label:(S.lang==='fr'?c.fr:c.en), delta:eff.rel[k] }); }); }
  return items;
}

function squadCapForScope(scope){ return clamp(scope||1, 1, 7); }
function buildBattleSquads(foeKey, mission){
  const empty = { allies:[], foes:[] };
  const cap = squadCapForScope(mission && mission.scope);
  if(cap <= 1) return empty; // combats de quartier : toujours 1 contre 1
  const maxExtra = cap - 1; // en plus de toi / du adversaire principal
  const keys = otherCharKeys().filter(k=>k!==foeKey);
  const myZone = zoneOf(S.align);
  const mySide = myZone==='villain' ? 'villain' : 'hero';
  let allyPool = shuffle(keys.filter(k=>CHARACTERS[k].align===mySide));
  const mine = menteeKeys().filter(k=>allyPool.includes(k));
  if(mine.length) allyPool = mine.concat(allyPool.filter(k=>!mine.includes(k)));
  const foePool = shuffle(keys.filter(k=>CHARACTERS[k].align!==mySide));
  if(maxExtra<=0) return empty;
  // Un seul tirage, partage par les deux camps : les deux equipes ont toujours le meme effectif.
  const r = Math.pow(Math.random(), 0.55);
  const n = clamp(Math.round(maxExtra*r), 0, Math.min(maxExtra, allyPool.length, foePool.length));
  const allies = allyPool.slice(0, n);

function resolveOutcome(mission){

    if(mission.grandEvent && win){
      // Un evenement historique remporte compte pour plusieurs victoires a la fois : un vrai tournant de carriere.
      const evScope = mission.scope||6;
      S.combat.won += 2;
      S.cosmicWins = (S.cosmicWins||0) + 3;
      if(evScope>=7) S.trueCosmicWins = (S.trueCosmicWins||0) + 1;
      for(let i=0;i<2;i++){ S.locations.push({ name: randLocationName(evScope)+' '+(i+2), type:evScope, kind: zoneOf(S.align)==='villain'?'destroyed':'saved' }); }
