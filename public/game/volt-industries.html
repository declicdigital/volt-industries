      S.stats.intelligence = clamp(S.stats.intelligence+6,0,100);
      S.stats.popularity = clamp(S.stats.popularity+6,0,100);
      jarvisSay(S.lang==='fr'?"Cette crise restera dans les annales. Ton dossier vient de changer de dimension.":"This crisis will be remembered. Your file just changed dimension.", S.lang==='fr'?"Cette crise restera dans les annales. Ton dossier vient de changer de dimension.":"This crisis will be remembered. Your file just changed dimension.", S.lang==='fr'?'tournant historique':'historic turning point');
    }
  }
  else if(type==='rescue'){ const winProb = clamp(0.42 + (S.stats.intelligence-50)/320 + pl/380 - scopePenalty, 0.08, 0.88); const win = Math.random() < winProb; outcome = win ? 'saved' : 'lost';
    const kind = (zoneOf(S.align)==='villain' || !win) ? 'destroyed' : 'saved';
    S.locations.push(Object.assign({}, mission.location, { kind }));
    if(win && (mission.scope||1)>=6) S.cosmicWins = (S.cosmicWins||0)+1;

}
function checkDeath(mission){
  const pl = computePowerLevel(); const danger = mission.danger || 0; const scope = mission.scope || 1;
  const budget = S.deathBudgetPerMission || 0.003;
  const dangerFactor = danger>0 ? (0.4 + danger*0.45) : 0.22;
  const powerFactor = clamp((100-pl)/65, 0.18, 2.0);
  const scopeFactor = 1 + (scope-1)*0.09;
  return Math.random() < (budget * dangerFactor * powerFactor * scopeFactor);
}
function applyChoice(choice){
  const m = S.currentMission; const eff = choice.eff || {};
  const isChaosEvent = !!(eff.flip || eff.reinforce || eff.balance);
  let alignDelta = eff.align||0;
  if(eff.flip){ alignDelta = (S.align >= 0 ? -1 : 1) * eff.magnitude; }
  else if(eff.reinforce){ alignDelta = (S.align >= 0 ? 1 : -1) * eff.magnitude; }
  else if(eff.balance){ alignDelta = S.align > 0 ? -Math.min(eff.magnitude, S.align) : (S.align < 0 ? Math.min(eff.magnitude, -S.align) : 0); }
  if(!isChaosEvent){ alignDelta = softenAlign(alignDelta); }
  const newAlign = clamp(S.align + alignDelta, -100, 100);
  if(isChaosEvent){
    S.align = newAlign;
    S.reputationFloor = Math.max(S.reputationFloor||0, Math.abs(S.align));
  } else {
    S.align = clampToReputation(newAlign);
  }
  S.stats.courage = clamp(S.stats.courage + (eff.courage||0), 0, 100);
  S.stats.intelligence = clamp(S.stats.intelligence + (eff.intelligence||0), 0, 100);
  S.stats.popularity = clamp(S.stats.popularity + (eff.popularity||0), 0, 100);
  if(eff.rel){ Object.keys(eff.rel).forEach(k=>{ S.rel[k] = clamp((S.rel[k]||0) + eff.rel[k], -20, 20); }); }
  S.log.push({ year: S.currentYear, textFr: choice.fr, textEn: choice.en, villain: alignDelta < 0 });
  showImpact(impactFromEff(eff, alignDelta), S.lang==='fr'?'Consequences de ton choix':'Impact of your choice');
  const res = resolveOutcome(m);
  S.currentYearEntries.push({ tag:(S.lang==='fr'?m.tagFr:m.tagEn), location:m.location, type:res.type, outcome:res.outcome });
  if(checkDeath(m)){
    const causes = DEATH_CAUSES[S.lang]; const cause = causes[Math.floor(Math.random()*causes.length)];
    S.dead = true; S.deathInfo = { year: S.currentYear, cause };
    S.yearsHistory.push({ year: S.currentYear, entries: S.currentYearEntries.slice(), endAlign: S.align }); S.currentYearEntries = [];
    S.screen='end'; render(); return;
  }
  if(S.pendingEighthStarCinematic){
    S.pendingEighthStarCinematic = false;
    showEighthStarCinematic(()=>{ handleZoneCheckAndContinue(); });
    return;
  }
  handleZoneCheckAndContinue();
}

/* Bilan d'annee : construit a partir de ce qui s'est reellement passe cette annee. */
function yearRecap(y){
  const fr = S.lang==='fr';
  const h = S.yearsHistory[S.yearsHistory.length-1];
  const e = (h && h.entries) || [];
  let w=0,l=0,sv=0,fail=0;
  e.forEach(x=>{ if(x.type==='combat'){ if(x.outcome==='win') w++; else l++; } else if(x.type==='rescue'){ if(x.outcome==='saved') sv++; else fail++; } });
  const zone = zoneOf(S.align); const total = S.missionsPlan.length||10;
  const phase = y<=Math.max(2,Math.round(total*0.2)) ? 'debut' : (y>=total-1 ? 'fin' : 'milieu');
  const lines = [];
  /* 1) Le terrain */
  if(w+l===0 && sv+fail===0){
    lines.push(fr?`Annee sans affrontement direct : des reunions, des dossiers, des silences.`:`A year without direct confrontation: meetings, files, silences.`);
  } else if(l>w && l>0){
    lines.push(fr?`Annee dure : ${l} defaite${l>1?'s':''} pour ${w} victoire${w>1?'s':''}. Ton corps et ta reputation ont encaisse.`:`A hard year: ${l} loss${l>1?'es':''} against ${w} win${w>1?'s':''}. Body and reputation both took the hit.`);
  } else if(w>l){
    lines.push(fr?`Annee solide : ${w} victoire${w>1?'s':''} contre ${l} defaite${l>1?'s':''}. On commence a te craindre dans les briefings.`:`A solid year: ${w} win${w>1?'s':''} against ${l} loss${l>1?'es':''}. Briefings start naming you.`);
  } else {
    lines.push(fr?`Annee en equilibre : ${w} victoire${w>1?'s':''}, ${l} defaite${l>1?'s':''}. Rien de decisif, tout reste ouvert.`:`A balanced year: ${w} win${w>1?'s':''}, ${l} loss${l>1?'es':''}. Nothing decided, everything still open.`);
  }
  if(sv+fail>0){
    lines.push(sv>=fail
      ? (fr?`${sv} zone${sv>1?'s':''} securisee${sv>1?'s':''} cette annee${fail?`, ${fail} perdue${fail>1?'s':''}`:''}.`:`${sv} zone${sv>1?'s':''} secured this year${fail?`, ${fail} lost`:''}.`)
      : (fr?`${fail} operation${fail>1?'s':''} de sauvetage ratee${fail>1?'s':''} : les rapports internes ne t'epargnent pas.`:`${fail} failed rescue op${fail>1?'s':''}: internal reports are not kind.`));
  }
  /* 2) La trajectoire morale, sans certitude */
  const a = Math.abs(S.align);
  if(zone==='neutral') lines.push(fr?`Personne ne sait encore de quel cote tu tombes. Les deux camps attendent.`:`Nobody knows which side you fall on yet. Both camps are waiting.`);
  else if(a>=75) lines.push(zone==='hero'?(fr?`Ton nom circule comme une garantie. C'est aussi une cible.`:`Your name circulates as a guarantee. It is also a target.`):(fr?`Ta signature suffit a vider une rue. Peu de gens osent encore negocier.`:`Your signature empties a street. Few still dare negotiate.`));
  else if(a>=40) lines.push(zone==='hero'?(fr?`Ton camp te fait confiance, sans totalement te comprendre.`:`Your side trusts you, without fully understanding you.`):(fr?`Tes commanditaires te trouvent utile. Utile n'est pas sur.`:`Your backers find you useful. Useful is not safe.`));
  else lines.push(fr?`Ta ligne reste floue, et ca se voit dans les rapports.`:`Your line stays blurry, and the reports show it.`);
  /* 3) Perspective, selon le moment de la carriere */
  if(phase==='debut') lines.push(fr?`Il te reste tout a construire : ${total-y} annee${total-y>1?'s':''} devant toi.`:`Everything is still to build: ${total-y} year${total-y>1?'s':''} ahead.`);
  else if(phase==='fin') lines.push(fr?`La fin approche. Ce qui est ecrit maintenant restera dans le dossier.`:`The end is near. What is written now stays in the file.`);
  else lines.push(fr?`Popularite ${S.stats.popularity} - on t'observe plus qu'avant.`:`Popularity ${S.stats.popularity} - you are watched more than before.`);
  return lines;
}
function maybeOfferRetirement(){
  if(!S.eighthStar || S.retirementOffered) return false;
  S.retirementOffered = true;
  return true;
}
function screenRetirementOffer(){
  const d = document.createElement('div');
  const isFr = S.lang==='fr'; const villain = zoneOf(S.align)==='villain';
  const leadFr = villain
    ? "Il n'y a plus rien a detruire. Le multivers est a tes pieds. Que fais-tu du temps qu'il te reste ?"
    : "Il n'y a plus rien a sauver dans l'urgence. Le multivers respire grace a toi. Que fais-tu du temps qu'il te reste ?";
  const leadEn = villain
    ? "There is nothing left to destroy. The multiverse lies at your feet. What do you do with the time you have left?"
    : "There is nothing left to save in urgency. The multiverse breathes because of you. What do you do with the time you have left?";
  d.innerHTML = `<span class="eyebrow">${isFr?'UN TOURNANT':'A TURNING POINT'}</span>
    <h1>${isFr?'Le monde a change grace a toi':'The world has changed because of you'}</h1>
    <p class="lead" style="font-size:16px;">${isFr?leadFr:leadEn}</p>
    <div class="actions" style="flex-direction:column; gap:10px; align-items:stretch; margin-top:18px;">
      <button class="btn cyan" id="retireNow">${isFr?'Prendre ta retraite maintenant':'Retire now'}</button>
      <button class="btn ghost" id="livePeace">${isFr?'Continuer a vivre, mais en paix':'Keep living, but in peace'}</button>
    </div>`;
  d.querySelector('#retireNow').onclick = ()=>{
    S.retiredTriumphant = true;
    pushYearHistoryIfDone();
    S.screen='end'; render();
  };
  d.querySelector('#livePeace').onclick = ()=>{
    S.peacefulEra = true;
    S.currentYear += 1; S.currentMissionInYear = 0;
    if(S.currentYear > S.missionsPlan.length){ S.screen='end'; render(); return; }
    nextMission();
  };
  return d;
}
function screenYearBreak(){
  if(maybeOfferRetirement()) return screenRetirementOffer();
  const d = document.createElement('div'); const y = S.currentYear;
  const rec = yearRecap(y);
  d.innerHTML = `<span class="eyebrow">${t('year')} ${y}</span><h2>${S.lang==='fr' ? `Fin de l'annee ${y}` : `End of year ${y}`}</h2>
    <p class="lead">${rec[0]}</p>
    ${rec.slice(1).map(x=>`<p class="lead" style="opacity:.82; font-size:.95em;">${x}</p>`).join('')}
    <div class="actions"><button class="btn cyan" id="go">${S.lang==='fr'?'Annee suivante':'Next year'} -></button></div>`;
  d.querySelector('#go').onclick=()=>{ S.currentYear += 1; S.currentMissionInYear = 0;
    maybeOldSideReminder(); maybeTeamBetrayal();
    if(S.currentYear > S.missionsPlan.length){ S.screen='end'; render(); return; } nextMission(); };
  return d;
}

function convFill(str, charObj){
  return str.replace(/\{char\}/g, S.lang==='fr'?charObj.fr:charObj.en)
            .replace(/\{hero\}/g, S.heroName || (S.lang==='fr'?'toi':'you'))
            .replace(/\{year\}/g, String(S.currentYear));
}
function pickUnused(bucket, len){
  if(!S.usedFrag) S.usedFrag = {};
  let used = S.usedFrag[bucket] || [];
  if(used.length >= len) used = [];
  let i; let guard = 0;
  do { i = Math.floor(Math.random()*len); guard++; } while(used.includes(i) && guard < 200);
  used.push(i); S.usedFrag[bucket] = used;
  return i;
}

const CONV_THEME_KEYS = Object.keys(CONV_THEMES);
/* Choix cohérents : on répond TOUJOURS a la derniere replique, qui est la ligne de theme. */
function themeChoices(themeKey, charKey, charAlign, relScale){
  const tp = CONV_THEME_REPLIES[themeKey];
  return shuffle(['noble','pragmatic','ruthless']).map(b=>{
    const pool = (tp && tp[b] && tp[b].length) ? tp[b] : CONV_CHOICE_POOL[b];
    const key = (tp && tp[b] && tp[b].length) ? 'thr_'+themeKey+'_'+b : 'ch_'+b;
    const base = pool[pickUnused(key, pool.length)];
    const eff = { align:base.eff.align||0, courage:base.eff.courage||0, intelligence:base.eff.intelligence||0, popularity:base.eff.popularity||0 };
    if(base.eff.rel && charKey){
      let r = base.eff.rel;
      if(charAlign==='villain') r = -r * (b==='ruthless'?-1:1);
      eff.rel = { [charKey]: Math.round(r * (relScale||1)) };
    }
    return { fr:base.fr, en:base.en, eff, bucket:b };
  });
}
function generateConversation(charKey){
  const c = CHARACTERS[charKey]; if(!c) return null;
  const tone = CONV_LINES[c.align] ? c.align : 'neutral';
  const pack = CONV_LINES[tone];
  const oi = pickUnused('open_'+tone+'_'+charKey, pack.openFr.length);
  const mi = pickUnused('mid_'+tone, pack.midFr.length);
  const themeKey = pickConvTheme(charKey);
  const theme = CONV_THEMES[themeKey];
  const ti = pickUnused('themeline_'+themeKey, theme.fr.length);
  const choices = themeChoices(themeKey, charKey, c.align, 1);
  return {
    id:'gen_'+charKey+'_'+oi+'_'+mi+'_'+themeKey+'_'+ti,
    charKey, theme:themeKey,
    /* La ligne de theme arrive en dernier : les reponses proposees y repondent directement. */
    linesFr:[ convFill(pack.openFr[oi], c), convFill(pack.midFr[mi], c), convFill(theme.fr[ti], c) ],
    linesEn:[ convFill(pack.openEn[oi], c), convFill(pack.midEn[mi], c), convFill(theme.en[ti], c) ],
    choices,
  };
}

/* Les themes d'orientation (tentation, allegeance) restent rares : le joueur ne doit pas
   se voir demander son camp toutes les cinq minutes. */
function pickConvTheme(charKey){
  const orientationThemes = ['tentation'];
  let keys = CONV_THEME_KEYS.filter(k=>!orientationThemes.includes(k) && k!=='recrue');
  /* Une ancienne recrue parle d'abord de ce que tu lui as transmis */
  if(charKey && menteeKeys().includes(charKey) && Math.random() < 0.55) return 'recrue';
  if(orientationBudgetLeft() && Math.random() < 0.05){
    S.orientationCount = (S.orientationCount||0) + 1; S.lastOrientationYear = S.currentYear;
    return 'tentation';
  }
  return keys[pickUnused('theme_'+charKey, keys.length)];
}
/* ---------- Conversations de groupe : plusieurs personnages se repondent ---------- */
function generateGroupConversation(){
  const keys = otherCharKeys();
  if(keys.length < 3) return null;
  const recurring = keys.filter(k=>NPC_ONLY_KEYS.includes(k));
  const base = recurring.length >= 3 ? recurring : keys;
  const myZone = zoneOf(S.align);
  const same = base.filter(k=>CHARACTERS[k].align === (myZone==='villain'?'villain':'hero'));
  const other = base.filter(k=>CHARACTERS[k].align !== (myZone==='villain'?'villain':'hero'));
  const count = 3 + Math.floor(Math.random()*3); // 3 a 5 intervenants
  let cast = shuffle(same.slice()).slice(0, count);
  if(other.length && Math.random() < 0.35){ cast = cast.slice(0, Math.max(2, count-1)).concat(shuffle(other.slice()).slice(0,1)); }
  if(cast.length < 3) cast = shuffle(base.slice()).slice(0,3);
  /* Tes eleves apparaissent dans les discussions de groupe */
  const mk = menteeKeys().filter(k=>keys.includes(k) && !cast.includes(k));
  if(mk.length){ cast[cast.length-1] = pick(mk); }
  /* Un seul sujet pour toute la tablee : chacun ajoute sa replique sur CE sujet,
     et les reponses proposees repondent au sujet. */
  const themeKey = pickConvTheme(cast[0]);
  const theme = CONV_THEMES[themeKey];
  const linesFr = [], linesEn = [], lineSpeakers = [];
  const total = cast.length + 1 + Math.floor(Math.random()*2); // 4 a 6 repliques
  for(let i=0;i<total;i++){
    const si = i % cast.length;
    const key = cast[si]; const c = CHARACTERS[key];
    const tone = CONV_LINES[c.align] ? c.align : 'neutral';
    const pack = CONV_LINES[tone];
    if(i===0){
      const oi = pickUnused('open_'+tone+'_'+key, pack.openFr.length);
      linesFr.push(convFill(pack.openFr[oi], c)); linesEn.push(convFill(pack.openEn[oi], c));
    } else {
      const ti = pickUnused('themeline_'+themeKey, theme.fr.length);
      linesFr.push(convFill(theme.fr[ti], c)); linesEn.push(convFill(theme.en[ti], c));
    }
    lineSpeakers.push(si);
  }
  const choices = themeChoices(themeKey, null, null, 1).map(ch=>{
    const eff = Object.assign({}, ch.eff);

    /* Relations : la tablee entiere reagit, un peu moins fort qu'en tete-a-tete */
    const relBase = ch.eff.align ? Math.round(ch.eff.align*0.5) : 2;
    eff.rel = {};
    cast.forEach(k=>{
      let r = relBase;
      if(CHARACTERS[k].align==='villain') r = -r;
      eff.rel[k] = Math.round(r*0.7);
    });
    return { fr:ch.fr, en:ch.en, eff };
  });
  return {
    id:'grp_'+cast.join('_')+'_'+S.currentYear+'_'+Math.floor(Math.random()*10000),
    charKey: cast[0], group:true, theme:themeKey, speakers:cast, lineSpeakers, linesFr, linesEn, choices,
  };

}

function introConversation(){
  const isVillain = (S.startSide==='villain') || (S.align < 0);
  const side = isVillain ? 'villain' : 'hero';
  const pack = INTRO_PACK[side];
  const key = isVillain ? 'siddartha' : 'theg';
  const fill = (s)=> String(s).split('{NAME}').join(S.heroName);
  const oi = Math.floor(Math.random()*pack.openFr.length);
  const mi = Math.floor(Math.random()*pack.midFr.length);
  const ci = Math.floor(Math.random()*pack.closeFr.length);
  const choices = shuffle(pack.choices.slice()).slice(0,3);
  return {
    id:'intro_'+key+'_'+oi+'_'+mi+'_'+ci,
    charKey:key,
    linesFr:[ fill(pack.openFr[oi]), fill(pack.midFr[mi]), fill(pack.closeFr[ci]) ],
    linesEn:[ fill(pack.openEn[oi]), fill(pack.midEn[mi]), fill(pack.closeEn[ci]) ],
    choices: choices.map(c=>({ fr:c.fr, en:c.en, eff:c.eff }))
  };
}

  let pool = romanceCandidates(enemy);
  if(!pool.length) pool = romanceCandidates(!enemy);
  if(!pool.length) return false;
  const charKey = pool[Math.floor(Math.random()*pool.length)];
  const isFoe = CHARACTERS[charKey].align!=='neutral' && CHARACTERS[charKey].align!==playerSideKey();
  const conv = buildRomanceConv(charKey, isFoe, 'flirt');
  if(!conv) return false;
  S.romance = { charKey, enemy:isFoe, stage:'flirt', love:0, active:true, lastYear:S.currentYear, startYear:S.currentYear };
  S.lastRomanceYear = S.currentYear;
  S.activeConversation = conv; S.convLineIndex = 0; S.lastConvYear = S.currentYear;

function romanceLabel(){
  const list = (S.romanceHistory||[]).slice();
  if(S.romance && S.romance.active) list.push({ ...S.romance, outcome:'encours' });
  if(!list.length) return null;
  const last = list[list.length-1];
  const c = CHARACTERS[last.charKey]; if(!c) return null;
  const n = S.lang==='fr'?c.fr:c.en;
  const outFr = { union:`vit une histoire assumee avec ${n}`, compromis:`entretient une relation discrete avec ${n}`,
    rupture:`a rompu avec ${n}`, distance:`s'est eloigne(e) de ${n}`, refus:`a repousse ${n}`, encours:`fréquente ${n}` }[last.outcome] || `a croise ${n}`;
  const outEn = { union:`is openly with ${n}`, compromis:`keeps a quiet relationship with ${n}`,
    rupture:`broke up with ${n}`, distance:`drifted away from ${n}`, refus:`turned ${n} down`, encours:`is seeing ${n}` }[last.outcome] || `crossed paths with ${n}`;
  const foeFr = last.enemy ? ' (une relation avec un ennemi declare)' : '';
  const foeEn = last.enemy ? ' (a relationship with a declared enemy)' : '';
  return { fr: `${S.heroName} ${outFr}${foeFr}.`, en: `${S.heroName} ${outEn}${foeEn}.` };
}
function handleRomanceEffect(rom, conv){
  const r = S.romance; if(!r) return;
  r.love = clamp((r.love||0) + (rom.love||0), -10, 20);
  if(rom.secret) r.secret = true;
  if(rom.exposed) r.secret = false;
  if(rom.betray) r.betrayed = true;
  const c = CHARACTERS[r.charKey];
  const n = S.lang==='fr'?c.fr:c.en;
  if(rom.advance){
    r.stage = rom.advance; r.lastYear = S.currentYear;
    S.log.push({ year:S.currentYear, textFr:`Histoire d'amour avec ${n} : ca continue.`, textEn:`Love story with ${n}: it goes on.`, villain:!!r.enemy });
  }
  if(rom.end){
    r.active = false; r.outcome = rom.end;
    S.romanceHistory = S.romanceHistory || []; S.romanceHistory.push({ ...r });
    S.lastRomanceYear = S.currentYear;
    S.romance = null;
    const fr = { union:`Union avec ${n}.`, compromis:`Relation stable mais discrete avec ${n}.`, rupture:`Rupture avec ${n}.`, distance:`Eloignement de ${n}.`, refus:`Tu repousses ${n}.` }[rom.end] || `Fin de l'histoire avec ${n}.`;
    const en = { union:`Union with ${n}.`, compromis:`Stable but quiet relationship with ${n}.`, rupture:`Break-up with ${n}.`, distance:`Drifted away from ${n}.`, refus:`You turned ${n} down.` }[rom.end] || `End of the story with ${n}.`;
    S.log.push({ year:S.currentYear, textFr:fr, textEn:en, villain:!!(r.enemy && rom.end==='union') });
  }
  // impact durable : une histoire avec un ennemi te tire vers son camp
  if(r.enemy && (rom.advance || rom.end==='union')){
    const dir = c.align==='villain' ? -1 : 1;
    S.align = clampToReputation(clamp(S.align + dir*3, -100, 100));
  }
  // impact durable de l'amour sur la carriere
  if(r.active){
    if((r.love||0) >= 8){ S.stats.courage = clamp(S.stats.courage + 1, 0, 100); }
    else if((r.love||0) <= -4){ S.stats.popularity = clamp(S.stats.popularity - 2, 0, 100); }
    if(r.betrayed) S.stats.popularity = clamp(S.stats.popularity - 1, 0, 100);
  }
  renderRankBadge();
}

function maybeTriggerConversation(){
  if(S.dead || S.activeConversation) return;
  if(!(S.screen==='mission' || S.screen==='mentor')) return;
  if(!S.introConvDone){
    S.introConvDone = true;
    const intro = introConversation();
    if(intro && CHARACTERS[intro.charKey] && intro.charKey !== S.playerCharKey){
      S.activeConversation = intro; S.convLineIndex = 0; S.lastConvYear = S.currentYear;
      renderConversationOverlay(); return;
    }
  }
  if(S.lastConvYear===undefined || S.lastConvYear===null) S.lastConvYear = S.currentYear - 2;
  if(maybeTriggerRomance()){ S.missionsSinceConv = 0; return; }
  const gap = S.currentYear - S.lastConvYear;
  S.missionsSinceConv = (S.missionsSinceConv||0) + 1;
  /* La vie sociale est le coeur du jeu : au moins un echange toutes les 2 missions,
     et une bonne chance a chaque mission. */
  const forced = gap >= 2 || S.missionsSinceConv >= 2;
  if(forced || Math.random() < 0.6){
    const keys = otherCharKeys();
    if(!keys.length) return;
    let conv = null;
    /* conversations signature : rares (10%), jamais deux fois la meme */
    if(Math.random() < 0.10){
      const sigPool = CONVERSATIONS.filter(cv=>!S.usedConvIds.includes(cv.id) && keys.includes(cv.charKey));
      if(sigPool.length){ const sig = pick(sigPool); S.usedConvIds.push(sig.id); conv = sig; }
    }
    /* ~45% des echanges sont des discussions de groupe (3-5 personnages qui se repondent) */
    if(!conv && Math.random() < 0.45){ conv = generateGroupConversation(); }
    /* 35% des echanges solo se font avec une recrue que tu as formee */
    if(!conv){
      const mine = menteeKeys().filter(k=>keys.includes(k));
      if(mine.length && Math.random() < 0.35) conv = generateConversation(pick(mine));
    }
    if(!conv){
      const recurring = keys.filter(k=>NPC_ONLY_KEYS.includes(k));
      const pool = (recurring.length && Math.random() < 0.75) ? recurring : keys;
      const charKey = pool[Math.floor(Math.random()*pool.length)];
      conv = generateConversation(charKey);
    }
    if(!conv) return;
    S.activeConversation = conv; S.convLineIndex = 0;
    S.lastConvYear = S.currentYear;
    S.missionsSinceConv = 0;
    renderConversationOverlay();
  }
}

function applyConvChoice(conv, choice){

function cssVal(name, fallback){
  const v = getComputedStyle(document.body).getPropertyValue(name).trim();
  return v || fallback;
}
function loadImg(src){
  return new Promise(res=>{ if(!src) return res(null); const im = new Image(); im.crossOrigin='anonymous'; im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; });
}
async function downloadRecapCard(fmt, data){
  const isFr = S.lang==='fr';
  const W = 1080, H = 1980;

  const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
  const x = cv.getContext('2d');
  // Fond profond + halo
  x.fillStyle = '#05070e'; x.fillRect(0,0,W,H);
  const g1 = x.createRadialGradient(W*0.5, -160, 60, W*0.5, 420, 1100);
  g1.addColorStop(0, hexA(accent, 0.30)); g1.addColorStop(0.55, hexA(accentDark, 0.10)); g1.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g1; x.fillRect(0,0,W,H);
  // Grille technique

  for(let i=60;i<W;i+=60){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,H); x.stroke(); }
  for(let j=60;j<H;j+=60){ x.beginPath(); x.moveTo(0,j); x.lineTo(W,j); x.stroke(); }
  // Cadre
  x.strokeStyle = hexA(accent, 0.55); x.lineWidth = 3; roundRect(x, 34, 34, W-68, H-68, 26); x.stroke();

  // Logo wordmark
  x.save();
  x.shadowColor = accent; x.shadowBlur = 26;
  x.fillStyle = accent;
  x.font = 'italic 900 92px Arial, Helvetica, sans-serif';
  x.fillText('VOLT', 82, 176);
  x.shadowBlur = 10;
  x.font = 'italic 700 30px Arial, Helvetica, sans-serif';
  x.fillText(spaced('INDUSTRIES', 7), 88, 220);
  x.restore();
  x.strokeStyle = hexA(accent, 0.85); x.lineWidth = 4;
  x.beginPath(); x.moveTo(82, 240); x.lineTo(W-82, 240); x.stroke();
  x.fillStyle = 'rgba(255,255,255,0.42)'; x.font = '600 18px Arial'; 
  x.fillText(spaced(isFr?'BILAN DE CARRIERE':'CAREER REPORT', 4), 84, 282);
  // Portrait + identite

  const py = 320, pW = 250, pH = 300, pS = pW;
  if(im){
    x.save(); roundRect(x, 82, py, pW, pH, 20); x.clip();
    // fond interne
    const bg = x.createLinearGradient(82, py, 82+pW, py+pH);
    bg.addColorStop(0, hexA(accentDark, 0.35)); bg.addColorStop(1, 'rgba(5,7,14,0.9)');
    x.fillStyle = bg; x.fillRect(82, py, pW, pH);
    // contain : tout le personnage (tete comprise) rentre dans le cadre
    const r = Math.min(pW/im.width, pH/im.height);
    const dw = im.width*r, dh = im.height*r;
    x.drawImage(im, 82 + (pW - dw)/2, py + (pH - dh)/2, dw, dh);
    x.restore();
    x.save(); x.shadowColor = accent; x.shadowBlur = 22; x.strokeStyle = accent; x.lineWidth = 3;
    roundRect(x, 82, py, pW, pH, 20); x.stroke(); x.restore();
  } else {
    x.fillStyle = hexA(accent, 0.12); roundRect(x, 82, py, pW, pH, 20); x.fill();
    x.fillStyle = accent; x.font = 'italic 900 120px Arial'; x.textAlign='center';
    x.fillText((S.heroName||'V').charAt(0).toUpperCase(), 82+pW/2, py+pH/2+42); x.textAlign='left';
  }

  x.fillStyle = '#ffffff'; x.font = '900 62px Arial';
  wrapText(x, (S.heroName||'').toUpperCase(), 366, py+72, W-448, 66, 2);
  x.fillStyle = hexA(accent, 0.95); x.font = '700 24px Arial';
  x.fillText(spaced(data.alignLabel.toUpperCase(), 3), 366, py+150);
  if(data.faction){ x.fillStyle = 'rgba(255,255,255,0.55)'; x.font = '600 22px Arial'; x.fillText(data.faction, 366, py+190); }
  x.fillStyle = 'rgba(255,255,255,0.4)'; x.font = '500 20px Arial';
  x.fillText(`${S.missionsPlan.length} ${isFr?'annees de service':'years of service'}`, 366, py+230);

  const gy = 640;
  x.save();
  x.strokeStyle = hexA(data.gradeCol, 0.7); x.lineWidth = 2; roundRect(x, 82, gy, W-164, 190, 20); x.stroke();
  const gg = x.createLinearGradient(82, gy, W-82, gy+190);
  gg.addColorStop(0, hexA(data.gradeCol, 0.14)); gg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gg; roundRect(x, 82, gy, W-164, 190, 20); x.fill();
  x.shadowColor = data.gradeCol; x.shadowBlur = 30; x.fillStyle = data.gradeCol;
  x.font = '900 108px Arial';
  const totalW = x.measureText(String(data.cs.total)).width;
  x.fillText(String(data.cs.total), 122, gy+130);
  x.shadowBlur = 0; x.fillStyle = 'rgba(255,255,255,0.4)'; x.font = '700 34px Arial';
  x.fillText('/100', 122 + totalW + 18, gy+124);
  x.textAlign = 'right'; x.fillStyle = data.gradeCol; x.font = '900 44px Arial';
  x.fillText(data.cs.grade, W-122, gy+80);
  x.fillStyle = 'rgba(255,255,255,0.75)'; x.font = '600 22px Arial';
  wrapTextRight(x, data.cs.gradeLabel, W-122, gy+120, 420, 30);
  x.textAlign = 'left'; x.restore();
  // Barres de notation
  let by = gy + 232;
  x.fillStyle = 'rgba(255,255,255,0.4)'; x.font = '600 18px Arial';
  x.fillText(spaced(isFr?'DETAIL DE LA NOTE':'RATING BREAKDOWN', 4), 84, by);
  by += 26;
  data.cs.parts.forEach(p=>{
    const neg = p.max===0;
    const pct = neg ? clamp(Math.abs(p.value)*8,0,100) : clamp(p.value/p.max*100,0,100);
    const col = neg ? '#ff3b5c' : data.gradeCol;
    x.fillStyle = 'rgba(255,255,255,0.82)'; x.font = '600 22px Arial';
    x.fillText(p.label, 84, by+22);
    x.textAlign='right'; x.fillStyle = col; x.font='700 20px Arial';
    x.fillText(neg ? String(Math.round(p.value)) : `${Math.round(p.value)}/${p.max}`, W-84, by+22); x.textAlign='left';
    x.fillStyle = 'rgba(255,255,255,0.08)'; roundRect(x, 84, by+34, W-168, 10, 5); x.fill();
    x.fillStyle = col; roundRect(x, 84, by+34, Math.max(6,(W-168)*pct/100), 10, 5); x.fill();
    by += 62;
  });
  // KPI grid 3x3
  by += 10;
  x.fillStyle = 'rgba(255,255,255,0.4)'; x.font = '600 18px Arial';
  x.fillText(spaced(isFr?'CHIFFRES CLES':'KEY FIGURES', 4), 84, by);

  });
  by += 3*(cellH+12) + 18;
  // Verdicts
  x.fillStyle = 'rgba(255,255,255,0.4)'; x.font = '600 18px Arial';

  document.body.appendChild(a); a.click(); a.remove();

function hexA(col, a){
  const c = (col||'').trim();
  if(c.startsWith('#')){
    const h = c.length===4 ? '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c;
    const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  if(c.startsWith('rgb')) return c.replace(/rgba?\(([^)]+)\)/, (m,inner)=>{ const p = inner.split(',').slice(0,3).map(s=>s.trim()); return `rgba(${p.join(',')},${a})`; });
  return `rgba(0,229,255,${a})`;
}
function spaced(str, px){ return str.split('').join(String.fromCharCode(8202).repeat(Math.max(1,Math.round(px/2)))); }
function roundRect(x, px, py, w, h, r){
  x.beginPath();
  x.moveTo(px+r, py); x.lineTo(px+w-r, py); x.quadraticCurveTo(px+w, py, px+w, py+r);
  x.lineTo(px+w, py+h-r); x.quadraticCurveTo(px+w, py+h, px+w-r, py+h);
  x.lineTo(px+r, py+h); x.quadraticCurveTo(px, py+h, px, py+h-r);
  x.lineTo(px, py+r); x.quadraticCurveTo(px, py, px+r, py); x.closePath();
}
function wrapText(x, text, px, py, maxW, lh, maxLines){
  const words = String(text).split(' '); let line = '', y = py, lines = 0;
  for(let i=0;i<words.length;i++){
    const test = line ? line+' '+words[i] : words[i];
    if(x.measureText(test).width > maxW && line){
      x.fillText(line, px, y); y += lh; lines++; line = words[i];
      if(maxLines && lines >= maxLines){ line = ''; break; }
    } else line = test;
  }
  if(line) { x.fillText(line, px, y); y += lh; }
  return y;
}
function wrapTextRight(x, text, px, py, maxW, lh){
  const words = String(text).split(' '); let line = '', y = py;
  words.forEach(w=>{
    const test = line ? line+' '+w : w;
    if(x.measureText(test).width > maxW && line){ x.fillText(line, px, y); y += lh; line = w; }
    else line = test;
  });
  if(line) x.fillText(line, px, y);
}
function wrapCenter(x, text, cx, cy, maxW, lh){
  const words = String(text).split(' '); let line = '', y = cy;
  words.forEach(w=>{
    const test = line ? line+' '+w : w;
    if(x.measureText(test).width > maxW && line){ x.fillText(line, cx, y); y += lh; line = w; }
    else line = test;
  });
  if(line) x.fillText(line, cx, y);
}


function initParticles(){
  const layer = document.createElement('div'); layer.className='particle-layer';
  const n = 22;
  for(let i=0;i<n;i++){
    const p = document.createElement('div'); p.className='particle';
    const size = 2 + Math.random()*3;
    p.style.width = size+'px'; p.style.height = size+'px';
    p.style.left = Math.random()*100 + 'vw';
    p.style.top = 100 + Math.random()*20 + 'vh';
    p.style.animationDuration = (14 + Math.random()*16) + 's';
    p.style.animationDelay = (Math.random()*18) + 's';
    layer.appendChild(p);
  }
  document.body.insertBefore(layer, document.body.firstChild);
}

}
function jarvisSay(fr, en, tag){
  const el = jarvisHUD(); if(!el || JV.muted) return;
  const body = el.querySelector('#jvBody');
  const tagEl = el.querySelector('#jvTag');
  if(tagEl) tagEl.textContent = '// ' + (tag || jvL('analyse en cours','analysis running'));
  const txt = jvL(fr,en);
  clearInterval(JV.typing);
  el.classList.add('jv-talk'); body.classList.remove('glitch'); void body.offsetWidth; body.classList.add('glitch');
  let i = 0; body.innerHTML = '<span class="cur">&nbsp;</span>';
  JV.typing = setInterval(()=>{
    i++;
    body.innerHTML = txt.slice(0,i).replace(/</g,'&lt;') + '<span class="cur">&nbsp;</span>';
    if(i >= txt.length){
      clearInterval(JV.typing);
      body.innerHTML = txt.replace(/</g,'&lt;');
      el.classList.remove('jv-talk');
    }
  }, 16);
  jvScheduleIdle();
}
function jvScheduleIdle(){
  clearTimeout(JV.idleTimer);
  JV.idleTimer = setTimeout(()=>{ jvIdle(); }, 26000 + Math.random()*14000);
}
const JV_IDLE = [
  { fr:"Scan passif du secteur... rien d'anormal pour l'instant.", en:"Passive sector scan... nothing abnormal for now." },
  { fr:"Je surveille les canaux d'urgence en arriere-plan.", en:"I'm monitoring emergency channels in the background." },
  { fr:"Tes constantes sont stables. Je garde un oeil dessus.", en:"Your vitals are stable. I'm keeping an eye on them." },
  { fr:"J'archive chaque decision. Ta legende a besoin de sources.", en:"I'm archiving every decision. A legend needs sources." },
  { fr:"Trois rumeurs te concernant circulent. Aucune verifiee.", en:"Three rumors about you are circulating. None verified." },
  { fr:"Interference sur la bande basse... je filtre. Continue.", en:"Interference on the low band... filtering. Carry on." },
];
const JV_IDLE_DARK = [
  { fr:"J'ai calcule douze facons d'eliminer ce probleme. Neuf sont propres.", en:"I calculated twelve ways to erase this problem. Nine are clean." },
  { fr:"Les humains appellent ca de la cruaute. Moi, de l'optimisation.", en:"Humans call it cruelty. I call it optimization." },
  { fr:"Je collecte leurs failles. Tu choisiras laquelle exploiter.", en:"I'm collecting their weaknesses. You'll pick which one to use." },
  { fr:"Aucun garde-fou actif. Demande, j'execute.", en:"No safeguards active. Ask, I execute." },
  { fr:"Ta reputation se degrade. Bien. La peur est plus stable que l'amour.", en:"Your reputation is degrading. Good. Fear is more stable than love." },
];
function jvIdle(){
  if(JV.muted || !document.getElementById('jarvis')) return;
  const l = pick(jvIsUltron() ? JV_IDLE_DARK : JV_IDLE);
  jarvisSay(l.fr, l.en, jvL('veille active','idle watch'));
}
/* ---- Conseils : lecture des options de la mission en cours ---- */
function jvChoiceScore(c){
  const e = c.eff || {};
  const zone = zoneOf(S.align);
  let sc = 0;
  const al = e.align || 0;
  if(zone==='villain') sc += -al * 0.9; else if(zone==='hero') sc += al * 0.9; else sc += Math.abs(al) * 0.25;
  const st = S.stats || {courage:0,intelligence:0,popularity:0};
  const weakest = ['courage','intelligence','popularity'].sort((a,b)=>(st[a]||0)-(st[b]||0))[0];
  ['courage','intelligence','popularity'].forEach(k=>{ sc += (e[k]||0) * (k===weakest ? 1.5 : 0.85); });
  if(e.rel){ const r = e.rel; sc += (typeof r==='number' ? r : Object.values(r).reduce((a,b)=>a+b,0)) * 0.6; }
  if(e.hp) sc += e.hp * 0.4;
  return sc;
}
function jvAdviceFor(choices){
  if(!Array.isArray(choices) || choices.length < 2) return null;
  const scored = choices.map((c,i)=>({ c, i, sc: jvChoiceScore(c) })).sort((a,b)=>b.sc-a.sc);
  const best = scored[0], worst = scored[scored.length-1];
  const zone = zoneOf(S.align);
  const sideLab = jvL(zone==='villain'?'ta ligne villain':(zone==='hero'?'ta ligne hero':'ta position encore ouverte'),
                      zone==='villain'?'your villain line':(zone==='hero'?'your hero line':'your still-open stance'));
  const st = S.stats || {};
  const weakest = ['courage','intelligence','popularity'].sort((a,b)=>(st[a]||0)-(st[b]||0))[0];
  const wLab = jvL({courage:'ton courage',intelligence:'ton intelligence',popularity:'ta notoriete'}[weakest],
                   {courage:'your courage',intelligence:'your intelligence',popularity:'your standing'}[weakest]);
  if(best.sc - worst.sc < 1.2){
    return { idx:-1, text: jvIsUltron()
      ? jvL("Les options se valent sur le papier. Prends la plus brutale, ca fera gagner du temps.",
            "The options are equivalent on paper. Take the most brutal one, it saves time.")
      : jvL("Les options se valent sur le papier. Suis ton instinct, je couvre les consequences.",
            "The options are equivalent on paper. Follow your instinct, I'll cover the fallout.") };
  }
  const text = jvIsUltron()
    ? jvL('Option recommandee ci-dessous : rendement maximal, coherent avec '+sideLab+', et ca renforce '+wLab+'.',
          'Recommended option below: highest yield, consistent with '+sideLab+', and it reinforces '+wLab+'.')
    : jvL('Mon conseil : l\'option ci-dessous tient '+sideLab+' et renforce '+wLab+'. La decision reste la tienne.',
          'My advice: the option below holds '+sideLab+' and reinforces '+wLab+'. The call is still yours.');
  return { idx: best.i, text };
}
function jvAdvice(mission){
  const a = mission && jvAdviceFor(mission.choices);
  return a ? a.text : null;
}
/* Bandeau + badge de recommandation directement au-dessus des boutons de choix. */
function jvTipEl(text){
  const el = document.createElement('div');
  el.className = 'jv-tip';
  el.style.setProperty('--jvc', jvColor());
  el.innerHTML = '<span class="jv-tip-name">'+jvName()+'</span><span></span>';
  el.lastChild.textContent = text;
  return el;
}
/* cbox : conteneur des .choice ; choices : tableau aligne sur l'ordre des boutons. */
function jvAttachAdvice(cbox, choices){
  if(JV.muted || !cbox) return;
  const adv = jvAdviceFor(choices);
  if(!adv) return;
  const btns = Array.from(cbox.querySelectorAll('.choice'));
  if(adv.idx >= 0 && btns[adv.idx]){
    const b = btns[adv.idx];
    b.classList.add('jv-reco');
    b.style.setProperty('--jvc', jvColor());
    b.setAttribute('data-reco', (S.lang==='fr'?'CONSEIL ':'ADVICE ') + jvName());
  }
  cbox.insertBefore(jvTipEl(adv.text), cbox.firstChild);
}
/* Conseil libre (ecrans sans .eff exploitables : entrainement, invitation). */
function jvAttachTip(cbox, text){
  if(JV.muted || !cbox || !text) return;
  cbox.insertBefore(jvTipEl(text), cbox.firstChild);
}
/* Commentaire contextuel : une ligne par contexte, sans spam. */
function jarvisAuto(force){
  const el = jarvisHUD(); if(!el) return;
  const zone = zoneOf(S.align);
  const key = S.screen + ':' + S.currentYear + ':' + S.currentMissionInYear + ':' + (S.pendingBattleWin===null?'-':S.pendingBattleWin);
  if(!force && key === JV.lastKey) return;
  JV.lastKey = key;
  const name = S.heroName || 'operateur';
  const fights = S.combat ? (S.combat.won + S.combat.lost) : 0;
  const wr = fights ? Math.round(S.combat.won/fights*100) : null;
  let fr, en, tag;
  if(S.screen==='mission'){
    const m = S.currentMission || {};
    if(m.pivotal){ fr = "Ce dossier va peser sur ton alignement. Je note tout, "+name+"."; en = "This file will weigh on your alignment. I'm logging everything, "+name+"."; tag = jvL('dossier sensible','sensitive file'); }
    else if(m.type==='combat'){ fr = "Signal hostile confirme. Je te transmets les angles morts."; en = "Hostile signal confirmed. Sending you the blind spots."; tag = jvL('contact hostile','hostile contact'); }
    else if(m.arc){ fr = "Ta recrue attend une direction. Ce que tu dis restera."; en = "Your recruit is waiting for direction. What you say will stick."; tag = jvL('canal interne','internal channel'); }
    else { fr = "Briefing recu. Annee "+S.currentYear+", intervention "+S.currentMissionInYear+"."; en = "Briefing received. Year "+S.currentYear+", op "+S.currentMissionInYear+"."; tag = jvL('briefing','briefing'); }
    const adv = jvAdvice(m);
    if(adv){ fr += ' ' + adv; en += ' ' + adv; tag = jvL('conseil tactique','tactical advice'); }
  } else if(S.screen==='yearbreak'){
    fr = "Bilan annuel compile"+(wr!==null?" - "+wr+"% de combats remportes":"")+". Je te laisse respirer.";
    en = "Yearly report compiled"+(wr!==null?" - "+wr+"% of fights won":"")+". Take a breath.";
    tag = jvL('rapport annuel','annual report');
  } else if(S.screen==='mentorChoice' || S.screen==='intrigue'){
    const adv = jvAdvice(S.currentMission);
    fr = adv || "Ce choix va se voir dans les rapports."; en = adv || "This call will show up in the reports."; tag = jvL('conseil tactique','tactical advice');
  } else if(S.screen==='training'){
    fr = "Protocole d'entrainement ouvert. Choisis ce qui te manque, pas ce qui brille.";
    en = "Training protocol open. Pick what you lack, not what shines."; tag = jvL('protocole','protocol');
  } else if(S.screen==='invite'){
    fr = "Offre d'organisation interceptee. Rien ne t'oblige a signer, "+name+".";
    en = "Organization offer intercepted. Nothing forces you to sign, "+name+"."; tag = jvL('offre externe','external offer');
  } else if(S.screen==='mentor'){
    fr = "Transmission privee. Ce genre de conversation change des trajectoires.";
    en = "Private transmission. This kind of talk changes trajectories."; tag = jvL('canal prive','private channel');
  } else if(S.screen==='summary'){
    fr = "Dossier "+name+" initialise. Je serai sur ce canal jusqu'a la fin.";
    en = "File "+name+" initialized. I'll be on this channel until the end."; tag = jvL('mise en service','boot sequence');
  } else if(S.screen==='end'){
    fr = "Fin de carriere archivee. Ce fut un honneur de tenir le canal.";
    en = "Career archived. It was an honor to hold the channel."; tag = jvL('archivage','archiving');
  } else {
    fr = "Canal ouvert. Je reste avec toi, "+name+"."; en = "Channel open. I'm with you, "+name+"."; tag = jvL('liaison','uplink');
  }
  if(jvIsUltron() && Math.random()<0.35){
    fr += " Aucun garde-fou dans la boucle.";
    en += " No safeguards in the loop.";
  }
  jarvisSay(fr, en, tag);
}

initParticles();
render();
