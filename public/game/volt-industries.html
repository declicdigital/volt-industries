<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOLT INDUSTRIES</title>
<style>
  :root{
    --accent:#00c2ff; --accent-dark:#0088cc; --accent-soft: rgba(0,194,255,.15);
    --gold:#ffb020; --red:#ff3b5c; --green:#22c98a;
    --bg0:#03060d; --bg1:#070c18;
    --panel: rgba(14,20,34,.72); --line: rgba(120,180,255,.18);
    --ink:#eef3fb; --dim:#8ea0bd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse 90% 70% at 50% -10%, var(--accent-soft), transparent 65%),
      radial-gradient(ellipse 70% 60% at 100% 100%, var(--accent-soft), transparent 60%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 55%, var(--bg0));
    color:var(--ink); font-family: -apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; overflow-x:hidden; position:relative; transition: background 1.4s ease;
  }
  .bg-grid{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 46px 46px; mask-image: radial-gradient(ellipse 100% 90% at 50% 10%, black 30%, transparent 85%); animation: gridshift 30s linear infinite; }
  @keyframes gridshift{ from{ background-position:0 0,0 0;} to{ background-position:46px 46px,-46px 46px; } }
  .scanline{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5; background: repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0px, transparent 1px, transparent 3px); }
  .glow-orb{ position:fixed; border-radius:50%; filter: blur(90px); opacity:.28; z-index:0; animation: float 14s ease-in-out infinite; transition: background 1s ease;}
  .glow-orb.a{ width:420px;height:420px; background:var(--accent); top:-140px; left:-100px; }
  .glow-orb.b{ width:360px;height:360px; background:var(--accent-dark); bottom:-120px; right:-80px; animation-delay:4s;}
  @keyframes float{ 0%,100%{ transform: translateY(0) translateX(0);} 50%{ transform: translateY(-36px) translateX(24px);} }
  #app{ position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:28px 20px 90px; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
  .brand{ font-weight:800; letter-spacing:4px; font-size:15px; display:flex; align-items:center; gap:10px; color:var(--ink); transition:opacity .15s; }
  .brand:hover{ opacity:.8; }
  .logo-mark{ width:34px; height:34px; filter: drop-shadow(0 0 8px var(--accent)); flex-shrink:0; }
  .langsel{ display:flex; gap:6px; }
  .langsel button{ border:1px solid var(--line); background:rgba(255,255,255,.03); padding:6px 14px; border-radius:20px; font-size:12px; font-weight:700; letter-spacing:1px; cursor:pointer; color:var(--dim); }
  .langsel button.active{ background:var(--accent); color:#03060d; border-color:var(--accent);}
  .rank-badge{ position:fixed; top:16px; right:16px; z-index:80; background:rgba(8,12,22,.85); backdrop-filter:blur(12px);
    border:1.5px solid var(--line); border-radius:16px; padding:10px 16px; text-align:right; box-shadow:0 10px 30px -12px rgba(0,0,0,.6); }
  .rank-badge .rname{ font-size:12px; font-weight:800; color:var(--ink); letter-spacing:1px; }
  .rank-badge .rlabel{ font-size:9.5px; font-weight:800; letter-spacing:1.5px; color:var(--dim); text-transform:uppercase; margin-top:2px;}
  .rank-badge .stars{ margin-top:4px; font-size:15px; letter-spacing:2px; }
  .rank-badge .score-line{ margin-top:3px; font-size:13px; font-weight:900; }
  .game-shell{ display:flex; gap:26px; align-items:flex-start; }
  .side-avatar{ position:sticky; top:20px; width:300px; flex-shrink:0; }
  .main-col{ flex:1; min-width:0; }
  @media (max-width:920px){ .game-shell{ flex-direction:column; } .side-avatar{ position:relative; top:0; width:100%; } }
  .card{ background: var(--panel); backdrop-filter: blur(18px); border:1px solid var(--line); border-radius:22px; padding:34px;
    box-shadow: 0 30px 70px -30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.04); animation: rise .5s ease; }
  @keyframes rise{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
  h1{ font-size: clamp(26px, 4.5vw, 42px); letter-spacing:-1px; margin:0 0 8px; color:var(--ink);}
  h2{ font-size:21px; margin:0 0 4px; letter-spacing:-0.4px; color:var(--ink);}
  h3{ font-size:15.5px; margin:22px 0 6px; color:var(--ink); text-transform:uppercase; letter-spacing:1px;}
  .eyebrow{ text-transform:uppercase; font-size:11px; letter-spacing:3.5px; font-weight:800; color:var(--accent); margin-bottom:10px; display:block; text-shadow:0 0 12px var(--accent-soft); }
  p.lead{ color:var(--dim); font-size:15.5px; line-height:1.65; max-width:680px; }
  input[type=text]{ width:100%; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px; font-size:16px; outline:none; transition:.2s; background:rgba(255,255,255,.03); color:var(--ink); }
  input[type=text]::placeholder{ color:#5a6a85; }
  input[type=text]:focus{ border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  input[type=color]{ width:52px;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:2px;cursor:pointer; background:transparent;}
  input[type=range]{ accent-color: var(--accent); width:100%; }
  .btn{ display:inline-flex; align-items:center; gap:8px; justify-content:center; background:rgba(255,255,255,.06); color:var(--ink);
    border:1px solid var(--line); padding:14px 26px; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; transition:.15s; }
  .btn:hover{ transform:translateY(-2px); border-color:var(--accent); }
  .btn:disabled{ opacity:.3; cursor:not-allowed; transform:none; }
  .btn.ghost{ background:transparent; }
  .btn.cyan{ background:linear-gradient(135deg, var(--accent), var(--accent-dark)); color:#03060d; border:none; box-shadow:0 12px 28px -10px var(--accent);}
  .actions{ margin-top:26px; display:flex; gap:12px; flex-wrap:wrap; }
  .optgrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-top:12px;}
  .opt{ border:1.5px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; text-align:left; background:rgba(255,255,255,.02); transition:.15s; color:var(--ink); }
  .opt:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .opt.selected{ border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft); }
  .opt .oname{ font-weight:800; font-size:14px; margin-bottom:3px;}
  .opt .odesc{ font-size:12px; color:var(--dim); line-height:1.4;}
  .opt.disabled{ opacity:.3; cursor:not-allowed; }
  .badge{ display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:1px; padding:3px 9px; border-radius:20px; margin-left:8px; vertical-align:middle;}
  .badge.tech{ background:rgba(0,194,255,.18); color:#7fe0ff;} .badge.mystique{ background:rgba(139,92,246,.2); color:#c8b3ff;}
  .badge.physique{ background:rgba(255,176,32,.2); color:#ffd28a;} .badge.psychique{ background:rgba(34,201,138,.2); color:#8fe8c8;}
  .avatar-wrap{ background: radial-gradient(ellipse at 50% 15%, var(--accent-soft), transparent 70%), rgba(255,255,255,.015);
    border:1.5px solid var(--line); border-radius:20px; padding:14px; display:flex; align-items:center; justify-content:center; min-height:320px; position:relative; overflow:hidden; }
  .avatar-wrap::before{ content:''; position:absolute; inset:0; background-image: repeating-linear-gradient(0deg, var(--accent-soft) 0 1px, transparent 1px 30px); opacity:.35; pointer-events:none; }
  .hud-label{ position:absolute; top:10px; left:14px; font-size:9.5px; letter-spacing:2px; font-weight:800; color:var(--accent); opacity:.85; }
  .hud-corner{ position:absolute; width:20px; height:20px; border-color:var(--accent); opacity:.7; }
  .hud-corner.tl{ top:8px; left:8px; border-top:2px solid; border-left:2px solid; } .hud-corner.tr{ top:8px; right:8px; border-top:2px solid; border-right:2px solid; }
  .hud-corner.bl{ bottom:8px; left:8px; border-bottom:2px solid; border-left:2px solid; } .hud-corner.br{ bottom:8px; right:8px; border-bottom:2px solid; border-right:2px solid; }
  .sidebar-stats{ margin-top:14px; }
  .statbar{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .stat{ flex:1; min-width:100px; background:rgba(255,255,255,.03); border-radius:12px; padding:9px 12px; border:1px solid var(--line);}
  .stat .slabel{ font-size:9.5px; letter-spacing:1.2px; font-weight:800; color:var(--dim); margin-bottom:5px; text-transform:uppercase;}
  .barbg{ height:6px; background:rgba(255,255,255,.06); border-radius:10px; overflow:hidden;}
  .barfill{ height:100%; border-radius:10px; transition:width .5s ease; }
  .align-track{ height:9px; border-radius:10px; background:linear-gradient(90deg, var(--red), rgba(255,255,255,.08) 50%, var(--accent)); position:relative; margin-top:6px;}
  .align-dot{ position:absolute; top:-4px; width:16px; height:16px; border-radius:50%; background:var(--ink); border:3px solid var(--bg0); box-shadow:0 2px 12px rgba(0,0,0,.6); transition:left .5s ease; transform:translateX(-50%);}
  .mission-tag{ font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--gold); text-transform:uppercase;}
  .mission-year{ font-size:12px; color:var(--dim); font-weight:700; margin-bottom:6px;}
  .mission-loc{ font-size:12.5px; color:var(--accent); font-weight:700; margin:4px 0 2px; }
  .choice{ display:block; width:100%; text-align:left; background:rgba(255,255,255,.02); border:1.5px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-top:12px; cursor:pointer; font-size:15px; line-height:1.5; transition:.15s; color:var(--ink); }
  .choice:hover{ border-color:var(--accent); transform:translateX(4px); box-shadow:0 8px 26px -14px var(--accent); background:var(--accent-soft); }
  .log-entry{ border-left:3px solid var(--accent); padding:10px 16px; margin-bottom:10px; background:rgba(255,255,255,.02); border-radius:0 10px 10px 0; font-size:14px; color:#c3cee2;}
  .log-entry.villain{ border-left-color:var(--red); }
  .relwrap{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:14px;}
  .relcard{ border:1px solid var(--line); border-radius:12px; padding:12px; background:rgba(255,255,255,.02);}
  .relcard .rn{ font-weight:800; font-size:13px; margin-bottom:6px;}
  .team-hero-banner{ border-radius:18px; padding:22px; margin-top:18px; text-align:center; background: radial-gradient(ellipse at 50% 0%, var(--accent-soft), transparent 70%); border:1.5px solid var(--accent); }
  .team-hero-banner .tname{ font-size:22px; font-weight:900; letter-spacing:2px; color:var(--accent); text-shadow:0 0 20px var(--accent);}
  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-top:14px; }
  .kpi{ border:1px solid var(--line); border-radius:14px; padding:16px; background:rgba(255,255,255,.02); text-align:center;}
  .kpi .kval{ font-size:24px; font-weight:900; color:var(--accent); } .kpi .klabel{ font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-top:4px;}
  details.yearcard{ border:1px solid var(--line); border-radius:12px; padding:10px 16px; margin-top:10px; background:rgba(255,255,255,.02); }
  details.yearcard summary{ cursor:pointer; font-weight:800; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
  details.yearcard summary .tag{ font-size:11px; font-weight:700; padding:2px 10px; border-radius:12px; }
  .ymission{ font-size:13px; color:#c3cee2; padding:8px 0; border-top:1px solid var(--line); }
  .ymission:first-of-type{ border-top:none; }
  .death-banner{ border:1.5px solid var(--red); background:rgba(255,59,92,.08); border-radius:18px; padding:22px; text-align:center; margin-bottom:22px;}
  .death-banner .dtitle{ font-size:20px; font-weight:900; letter-spacing:2px; color:var(--red); }
  .turn-item{ font-size:13.5px; color:#c3cee2; padding:8px 0; border-bottom:1px dashed var(--line); }
  .preset-card{ border:1.5px solid var(--line); border-radius:16px; padding:0 0 14px; background:rgba(255,255,255,.02); cursor:pointer; transition:.15s; text-align:center; overflow:hidden; }
  .preset-card:hover{ border-color:var(--pc-color, var(--accent)); transform:translateY(-3px); box-shadow:0 0 26px -8px var(--pc-color, var(--accent)); }
  .preset-card .pname{ font-weight:900; font-size:14px; margin-top:10px; padding:0 12px; }
  .preset-card .pdesc{ font-size:11.5px; color:var(--dim); margin-top:4px; line-height:1.4; padding:0 12px; }
  .preset-photo{ position:relative; height:230px; overflow:hidden; background:radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--pc-color) 22%, transparent), rgba(0,0,0,.55)); }
  .preset-photo img{ width:100%; height:100%; object-fit:cover; object-position:50% 14%; }
  .preset-photo::after{ content:''; position:absolute; inset:0; box-shadow: inset 0 0 55px -12px var(--pc-color), inset 0 -40px 40px -30px rgba(0,0,0,.9); }
  .preset-badge{ position:absolute; top:10px; left:10px; z-index:2; font-size:9.5px; font-weight:900; letter-spacing:1.4px;
    padding:4px 8px; border-radius:999px; color:#0a0d14; background:var(--pc-color); box-shadow:0 0 14px var(--pc-color); }
  .preset-mini{ width:100%; display:flex; justify-content:center; }
  .portrait-avatar{ width:100%; height:100%; min-height:200px; aspect-ratio:3/4; border-radius:12px; overflow:hidden; position:relative; }
  .portrait-avatar img{ width:100%; height:100%; object-fit:cover; object-position:50% 12%; }
  .pstats{ margin-top:8px; font-size:10.5px; font-weight:900; letter-spacing:1px; color:var(--pc-color); }
  .ptrait{ margin-top:6px; font-size:11.5px; line-height:1.45; color:var(--muted); }
  .ptrait.good{ color:#7ef0c0; } .ptrait.bad{ color:#ff9aa8; }
  .pgal{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin-top:10px; }
  .pgal{ grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); }
  .pgal .pitem{ position:relative; border:2px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; height:126px; background:rgba(255,255,255,.03); transition:.15s; }
  .pgal .pitem img{ width:100%; height:100%; object-fit:cover; object-position:50% 12%; }
  .pgal .pitem.sel{ border-color:var(--accent); box-shadow:0 0 20px -6px var(--accent); }
  .pgal .pitem.none{ display:flex; align-items:center; justify-content:center; text-align:center; font-size:10.5px; font-weight:800; color:var(--dim); padding:6px; }

  .scratch-card{ border:1.5px dashed var(--accent); border-radius:16px; padding:22px; text-align:center; cursor:pointer; background: var(--accent-soft); margin-bottom:18px; }
  .scratch-card .pname{ font-weight:900; font-size:16px; }
  .conv-overlay{ position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; }
  .conv-backdrop{ position:absolute; inset:0; background:rgba(3,6,13,.78); backdrop-filter:blur(6px); }
  .conv-card{ position:relative; z-index:2; background:var(--panel); border:1.5px solid var(--line); border-radius:20px; padding:0; max-width:760px; width:100%; min-height:min(360px, 70vh); max-height:min(540px, 86vh); box-shadow:0 30px 80px -20px rgba(0,0,0,.8); animation:rise .3s ease; overflow:hidden; display:flex; align-items:stretch; gap:0; }
  .conv-stage{ position:relative; flex:0 0 38%; min-height:0; align-self:stretch; background:radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--cp-color) 26%, transparent), rgba(0,0,0,.55) 70%); overflow:hidden; }
  .conv-body{ flex:1 1 auto; padding:24px; display:flex; flex-direction:column; justify-content:center; min-width:0; overflow-y:auto; }
  .conv-charname{ font-weight:900; font-size:13.5px; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .conv-dot{ width:10px; height:10px; border-radius:50%; }
  .conv-line{ font-size:16px; line-height:1.6; color:var(--ink); min-height:70px; }
  @media (max-width:720px){
    .conv-overlay{ padding:12px; }
    .conv-card{ flex-direction:column; max-width:440px; min-height:0; max-height:92vh; }
    .conv-stage{ flex:0 0 auto; height:min(38vh, 240px); min-height:0; }
    .conv-stage .conv-portrait img{ object-position:50% 8%; }
    .conv-body{ padding:16px 16px 18px; justify-content:flex-start; }
    .conv-line{ font-size:14.5px; min-height:0; }
    .conv-charname{ font-size:12px; margin-bottom:8px; }
    .conv-stage .conv-portrait .cp-glyph{ font-size:64px; }
  }
  @media (max-width:720px) and (orientation:landscape){
    .conv-card{ flex-direction:row; max-width:640px; min-height:0; }
    .conv-stage{ flex:0 0 34%; height:auto; }
  }

  @media (max-width:720px){
    .preset-photo{ height:200px; }
    .pgal{ grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:8px; }
    .pgal .pitem{ height:100px; }
    .portrait-avatar{ min-height:0; max-height:34vh; }
    .side-avatar .avatar-wrap{ max-width:260px; margin:0 auto; }
  }

  footer.mini{ text-align:center; color:#4b5876; font-size:11px; margin-top:44px; letter-spacing:1px;}

  .rankup-toast{ position:fixed; top:90px; right:16px; z-index:90; background:rgba(8,12,22,.92); backdrop-filter:blur(12px);
    border:1.5px solid var(--toast-color); border-radius:14px; padding:12px 18px; text-align:right;
    box-shadow:0 0 30px -4px var(--toast-color); animation: toastIn .4s ease; }
  .rankup-toast.fadeout{ animation: toastOut .7s ease forwards; }
  .rankup-toast .ru-title{ font-size:10px; font-weight:800; letter-spacing:2px; color:var(--toast-color); }
  .rankup-toast .ru-sub{ font-size:15px; font-weight:900; color:var(--ink); margin-top:2px; }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(30px); } to{ opacity:1; transform:translateX(0);} }
  @keyframes toastOut{ to{ opacity:0; transform:translateX(30px);} }

  .particle-layer{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .particle{ position:absolute; border-radius:50%; background:var(--accent); opacity:.5; filter:blur(.5px);
    animation: particleFloat linear infinite; box-shadow:0 0 6px var(--accent); }
  @keyframes particleFloat{ 0%{ transform:translateY(0) translateX(0); opacity:0;} 10%{opacity:.6;} 90%{opacity:.4;} 100%{ transform:translateY(-110vh) translateX(20px); opacity:0;} }

  .conv-portrait{ width:118px; height:118px; border-radius:50%; margin:0 auto 14px; position:relative; display:flex; align-items:center; justify-content:center;
    overflow:hidden; background:radial-gradient(circle at 40% 30%, rgba(255,255,255,.08), rgba(0,0,0,.3)); }
  .conv-portrait img{ width:125%; height:125%; object-fit:cover; object-position:50% 8%; }
  .conv-portrait .cp-glyph{ font-size:40px; font-weight:900; color:#fff; opacity:.85; }

  .conv-portrait.materialize-in{ animation: materializeIn .7s cubic-bezier(.2,.8,.3,1); }
  .conv-portrait.glitch-in{ animation: glitchIn .6s steps(2,end); }
  .conv-portrait::after{ content:''; position:absolute; inset:0; border-radius:50%; border:2px solid var(--cp-color, var(--accent)); box-shadow:0 0 18px var(--cp-color, var(--accent)); }
  .conv-portrait .cp-sweep{ position:absolute; left:0; right:0; height:14px; background:linear-gradient(180deg, transparent, rgba(255,255,255,.55), transparent);
    animation: sweepDown .7s ease; }
  @keyframes materializeIn{ 0%{ opacity:0; transform:scale(.5); filter:blur(6px);} 60%{ opacity:1; transform:scale(1.06); filter:blur(0);} 100%{ transform:scale(1);} }
  @keyframes glitchIn{ 0%{ opacity:0; transform:translateX(-6px);} 20%{opacity:.7; transform:translateX(5px);} 40%{opacity:.3; transform:translateX(-4px);} 60%{opacity:.9; transform:translateX(3px);} 80%{opacity:.5; transform:translateX(-2px);} 100%{ opacity:1; transform:translateX(0);} }
  @keyframes sweepDown{ from{ top:-14px;} to{ top:100%;} }

  /* --- Grand portrait de conversation, faisceau neon --- */
  .conv-stage .conv-portrait{ width:100%; height:100%; position:absolute; inset:0; margin:0; border-radius:0; background:none; overflow:hidden; }
  .conv-stage .conv-portrait img{ width:100%; height:100%; object-fit:cover; object-position:50% 12%;
    filter: drop-shadow(0 0 26px var(--cp-color)) saturate(1.05) contrast(1.05); }
  .conv-stage .conv-portrait::after{ border:none; border-radius:0;
    box-shadow: inset 0 0 70px -10px var(--cp-color), inset 0 0 160px -40px var(--cp-color); }
  .conv-stage .conv-portrait .cp-glyph{ font-size:110px; }
  .conv-stage .conv-portrait .cp-sweep{ height:34px; animation: sweepDown 1.1s ease; }
  .conv-beam{ position:absolute; inset:0; pointer-events:none; z-index:3;
    background:
      radial-gradient(ellipse at 50% 55%, transparent 45%, color-mix(in srgb, var(--cp-color) 40%, transparent) 100%),
      linear-gradient(0deg, color-mix(in srgb, var(--cp-color) 35%, transparent), transparent 22%);
    mix-blend-mode:screen; opacity:.85; animation: beamPulse 2.6s ease-in-out infinite; }

  .conv-beam::before{ content:''; position:absolute; inset:0; border:2px solid var(--cp-color);

<script>
/* ============================ STORAGE (localStorage) ============================ */
(function(){
  var PREFIX = 'volt:';
  function ok(v){ return Promise.resolve(v); }
  window.storage = {
    set: function(key, value){
      try{ localStorage.setItem(PREFIX+key, String(value)); }catch(e){}
      return ok({ key:key, ok:true });
    },
    get: function(key){
      var v = null;
      try{ v = localStorage.getItem(PREFIX+key); }catch(e){}
      return ok(v===null ? null : { key:key, value:v });
    },
    delete: function(key){
      try{ localStorage.removeItem(PREFIX+key); }catch(e){}
      return ok({ key:key, ok:true });
    },
    list: function(prefix){
      var keys = [];
      try{
        for(var i=0;i<localStorage.length;i++){
          var k = localStorage.key(i);
          if(k && k.indexOf(PREFIX)===0){
            var bare = k.slice(PREFIX.length);
            if(!prefix || bare.indexOf(prefix)===0) keys.push(bare);
          }
        }
      }catch(e){}
      return ok({ keys:keys });
    }
  };
})();

/* ============================ THEME ============================ */
function lerp(a,b,tt){ return a+(b-a)*tt; }
function hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)]; }
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join(''); }
function themeColors(align){
  const tt = clamp((align+40)/80, 0, 1);
  const villain = hexToRgb('#ff3b5c'), villainDark = hexToRgb('#a5122f');
  const hero = hexToRgb('#00c2ff'), heroDark = hexToRgb('#0088cc');
  const bg0Villain = hexToRgb('#200308'), bg0Hero = hexToRgb('#020913');
  const bg1Villain = hexToRgb('#4a0d18'), bg1Hero = hexToRgb('#071429');
  return {
    accent: rgbToHex(lerp(villain[0],hero[0],tt), lerp(villain[1],hero[1],tt), lerp(villain[2],hero[2],tt)),
    accentDark: rgbToHex(lerp(villainDark[0],heroDark[0],tt), lerp(villainDark[1],heroDark[1],tt), lerp(villainDark[2],heroDark[2],tt)),
    bg0: rgbToHex(lerp(bg0Villain[0],bg0Hero[0],tt), lerp(bg0Villain[1],bg0Hero[1],tt), lerp(bg0Villain[2],bg0Hero[2],tt)),
    bg1: rgbToHex(lerp(bg1Villain[0],bg1Hero[0],tt), lerp(bg1Villain[1],bg1Hero[1],tt), lerp(bg1Villain[2],bg1Hero[2],tt)),
  };
}
function applyTheme(){
  const {accent, accentDark, bg0, bg1} = themeColors(S.align);
  document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--accent-dark', accentDark);
  document.documentElement.style.setProperty('--bg0', bg0);
  document.documentElement.style.setProperty('--bg1', bg1);
  const rgb = hexToRgb(accent);
  document.documentElement.style.setProperty('--accent-soft', `rgba(${rgb[0]},${rgb[1]},${rgb[2]},.24)`);
}

/* ============================ LOGO ============================ */
function logoSVG(size, withText){
  const uid = 'lg'+Math.random().toString(36).slice(2,7);
  const ticks = Array.from({length:12}).map((_,i)=>{
    const ang=i*30*Math.PI/180;
    const x1=(50+41*Math.cos(ang)).toFixed(1), y1=(50+41*Math.sin(ang)).toFixed(1);
    const x2=(50+46*Math.cos(ang)).toFixed(1), y2=(50+46*Math.sin(ang)).toFixed(1);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="url(#${uid}g)" stroke-width="1.4" opacity="0.55"/>`;
  }).join('');
  const textPart = withText ? `
    <path id="${uid}circ" d="M 50,50 m -33,0 a 33,33 0 1,1 66,0 a 33,33 0 1,1 -66,0" fill="none"/>
    <text font-size="6.6" font-weight="800" letter-spacing="2.6" fill="url(#${uid}g)">
      <textPath href="#${uid}circ" startOffset="1%">VOLT INDUSTRIES • VOLT INDUSTRIES •</textPath>
    </text>` : '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${uid}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--accent-dark)"/></linearGradient>
      <filter id="${uid}f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#${uid}g)" stroke-width="2.5" opacity="0.9"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="url(#${uid}g)" stroke-width="1" opacity="0.45"/>
    ${ticks}
    ${textPart}
    <polygon points="50,20 76,68 24,68" fill="none" stroke="url(#${uid}g)" stroke-width="4.5" stroke-linejoin="round" filter="url(#${uid}f)"/>
    <polygon points="50,36 64,60 36,60" fill="url(#${uid}g)" opacity="0.9"/>
    <circle cx="50" cy="50" r="2.6" fill="#ffffff"/>
  </svg>`;
}

    case 'crack': icon = `<path d="M50 26 L44 44 L52 46 L40 70 L58 48 L50 46 L60 30 Z" fill="#fff" opacity="0.92"/>`; break;
    case 'coil': icon = `<path d="M50 28 a11 11 0 1 1 -0.1 0" fill="none" stroke="#fff" stroke-width="4"/><path d="M50 40 a7 7 0 1 1 -0.1 0" fill="none" stroke="#fff" stroke-width="4"/><circle cx="50" cy="48" r="2.4" fill="#fff"/>`; break;

const MISSION_SENTENCE_PATTERNS = [

const CHOICE_PHRASES = {
  bold: [

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }
function pickScopeForRank(rank){
  const r = Math.random();
  if(r<0.45) return rank;
  if(r<0.75 && rank>1) return rank-1;
  return 1 + Math.floor(Math.random()*rank);
}
function dangerForScope(scope, type){ if(type==='social') return scope>=5?1:0; return scope>=5?3:(scope>=3?2:1); }
function generateProceduralMission(rank){
  const type = pick(['combat','combat','rescue','rescue','social']);
  const scope = pickScopeForRank(rank);
  const danger = dangerForScope(scope, type);
  const threat = pick(THREATS);
  const stakes = pick(STAKES);
  const locName = randLocationName();
  const pattern = pick(MISSION_SENTENCE_PATTERNS);
  const useChar = Math.random() < 0.3;
  const charKey = useChar ? pick(otherCharKeys()) : null;
  let fr = pattern.fr(threat.fr, stakes.fr, locName);
  let en = pattern.en(threat.en, stakes.en, locName);
  if(charKey){
    const c = CHARACTERS[charKey];
    fr += ` ${c.fr} t'alerte personnellement de la situation.`;
    en += ` ${c.en} personally alerts you to the situation.`;
  }
  const boldP = pick(CHOICE_PHRASES.bold), cleverP = pick(CHOICE_PHRASES.clever), selfishP = pick(CHOICE_PHRASES.selfish);
  const fillT = (s, T) => s.replace('{t}', T);
  const choices = [
    { fr: fillT(boldP.fr, threat.fr), en: fillT(boldP.en, threat.en),
      eff: Object.assign({ align: randInt(6,11), courage: randInt(4,8), popularity: randInt(2,6) }, charKey ? { rel:{[charKey]: randInt(2,5)} } : {}) },
    { fr: fillT(cleverP.fr, threat.fr), en: fillT(cleverP.en, threat.en),
      eff: Object.assign({ align: randInt(2,6), intelligence: randInt(4,9), popularity: randInt(1,3) }, charKey ? { rel:{[charKey]: randInt(1,3)} } : {}) },
    { fr: fillT(selfishP.fr, threat.fr), en: fillT(selfishP.en, threat.en),
      eff: Object.assign({ align: -randInt(6,12), popularity: -randInt(2,6), intelligence: randInt(0,3) }, charKey ? { rel:{[charKey]: -randInt(2,5)} } : {}) },
  ];
  const tagFr = type==='combat' ? 'Affrontement' : (type==='rescue' ? 'Sauvetage' : 'Situation');
  const tagEn = type==='combat' ? 'Confrontation' : (type==='rescue' ? 'Rescue' : 'Situation');
  return { id:'gen', generated:true, type, danger, scope, charKey, tagFr, tagEn, fr, en, choices,
    location: { name: locName, type: scope } };
}

}
let S = freshState('fr');
function t(key){ return T[S.lang][key]; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function computePowerLevel(){
  const base = 12 + S.powers.length*6;
  const statBonus = Math.round((S.stats.courage+S.stats.intelligence+S.stats.popularity)/9);
  const growth = Math.min(30, Math.floor(S.totalMissionsDone/8));
  return clamp(base+statBonus+growth,1,100);
}
function zoneOf(align){ return align>=15?'hero':(align<=-15?'villain':'neutral'); }
function heroVillainScore(){ return Math.round(clamp(Math.abs(S.align),0,100)); }
function reputationCap(){ return clamp((S.reputationFloor||0) + S.totalMissionsDone * 6, 0, 100); }
function clampToReputation(v){ const cap = reputationCap(); return v>=0 ? Math.min(v,cap) : Math.max(v,-cap); }
function charColor(align){ return align==='hero' ? '#00c2ff' : (align==='villain' ? 'var(--red)' : '#b98bff'); }
function computeStars(){ const score = heroVillainScore(); return Math.max(1, Math.min(7, Math.round(score/100*7))); }

/* ============================ RENDER ============================ */
const app = document.getElementById('app');
function shouldShowSidebar(){ return !!S.heroName && !['welcome','profileChoice','name'].includes(S.screen); }
function render(){
  applyTheme();
  app.innerHTML = '';
  app.appendChild(topbar());
  renderRankBadge();
  if(shouldShowSidebar()){
    const shell = document.createElement('div'); shell.className='game-shell';
    const side = document.createElement('div'); side.className='side-avatar'; side.innerHTML = sideAvatarPanel();
    const main = document.createElement('div'); main.className='main-col';
    const card = document.createElement('div'); card.className='card'; card.appendChild(screenContent());
    main.appendChild(card);
    shell.appendChild(side); shell.appendChild(main);
    app.appendChild(shell);
  } else {
    const card = document.createElement('div'); card.className='card'; card.appendChild(screenContent());
    app.appendChild(card);
  }
  const foot = document.createElement('footer'); foot.className='mini';
  foot.textContent = S.lang==='fr' ? "VOLT INDUSTRIES - univers de fiction original" : "VOLT INDUSTRIES - original fictional universe";
  app.appendChild(foot);
  scheduleSaveGame();
}
let _saveTimer = null;
function scheduleSaveGame(){
  if(!window.storage) return;
  if(!['mission','mentor','yearbreak','invite','summary'].includes(S.screen)) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{ saveGameState(); }, 400);
}
async function saveGameState(){
  if(!window.storage) return;
  try{ await window.storage.set('currentGame', JSON.stringify(S), false); }catch(e){ /* storage unavailable */ }
}
async function loadGameState(){
  if(!window.storage) return null;
  try{ const r = await window.storage.get('currentGame', false); return (r && r.value) ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function clearGameState(){
  if(!window.storage) return;
  try{ await window.storage.delete('currentGame', false); }catch(e){ /* nothing to clear */ }
}
function renderRankBadge(){
  let el = document.getElementById('rankBadgeFixed');
  if(!shouldShowSidebar()){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id='rankBadgeFixed'; el.className='rank-badge'; document.body.appendChild(el); }
  const zone = zoneOf(S.align);
  const label = zone==='hero'?t('rankHero'):(zone==='villain'?t('rankVillain'):t('rankNeutral'));
  const stars = computeStars();
  const score = heroVillainScore();
  const starColor = zone==='hero' ? '#ffd23f' : (zone==='villain' ? 'var(--red)' : '#b98bff');
  let starsHtml = ''; for(let i=1;i<=7;i++){ starsHtml += `<span style="color:${i<=stars?starColor:'rgba(255,255,255,.15)'}">&#9733;</span>`; }
  const factionHtml = S.team ? `<div style="display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-top:6px;">
      <span style="font-size:10px; font-weight:800; color:${charColor(S.team.side)};">${factionName(S.team.side, S.team.tier)}</span>
      <div style="width:24px;height:24px;">${factionEmblemSVG(S.team.side, S.team.tier, 24)}</div>
    </div>` : '';
  el.innerHTML = `<div class="rname">${S.heroName}</div><div class="rlabel">${label} - ${scopeLabel(stars).toUpperCase()}</div>
    <div class="stars">${starsHtml}</div><div class="score-line" style="color:${starColor};">${score}<span style="color:var(--dim);">/100</span></div>${factionHtml}`;
  if(stars > S.lastStars){ showRankUpToast(stars, zone); }
  S.lastStars = stars;
}
function showRankUpToast(stars, zone){
  const old = document.getElementById('rankUpToast'); if(old) old.remove();
  const color = zone==='villain' ? 'var(--red)' : (zone==='hero' ? '#ffd23f' : '#b98bff');
  const toast = document.createElement('div'); toast.id='rankUpToast'; toast.className='rankup-toast';
  toast.style.setProperty('--toast-color', color);
  toast.innerHTML = `<div class="ru-title">${S.lang==='fr'?'PORTEE ETENDUE':'REACH EXPANDED'}</div><div class="ru-sub">${scopeLabel(stars)}</div>`;
  document.body.appendChild(toast);
  setTimeout(()=>{ toast.classList.add('fadeout'); setTimeout(()=>toast.remove(), 700); }, 3200);
}
function showExpelToast(facName){
  const old = document.getElementById('rankUpToast'); if(old) old.remove();
  const toast = document.createElement('div'); toast.id='rankUpToast'; toast.className='rankup-toast';
  toast.style.setProperty('--toast-color', 'var(--red)');
  toast.innerHTML = `<div class="ru-title">${S.lang==='fr'?'EXCLUSION':'EXPELLED'}</div><div class="ru-sub">${facName}</div>`;
  document.body.appendChild(toast);
  setTimeout(()=>{ toast.classList.add('fadeout'); setTimeout(()=>toast.remove(), 700); }, 3600);
}
function checkFactionExpulsion(){
  if(!S.team) return false;
  const zone = zoneOf(S.align); const stars = computeStars();
  let expelled = false, reasonBetrayal = false;
  if(zone !== 'neutral' && zone !== S.team.side){ expelled = true; reasonBetrayal = true; }
  else if(stars < S.team.tier - 1){ expelled = true; }
  if(!expelled) return false;
  const facName = factionName(S.team.side, S.team.tier);
  const label = reasonBetrayal
    ? (S.lang==='fr' ? `${facName} t'a exclu(e) sans appel apres ta trahison.` : `${facName} expelled you without appeal after your betrayal.`)
    : (S.lang==='fr' ? `${facName} t'a discretement ecarte(e), jugeant que tu n'etais plus a la hauteur.` : `${facName} quietly cut you loose, deeming you no longer up to standard.`);
  S.log.push({ year:S.currentYear, textFr:label, textEn:label, villain: S.team.side==='villain' });
  const key = S.team.side==='hero' ? 'invitedTierHero' : 'invitedTierVillain';
  S[key] = Math.max(0, S.team.tier - 2);
  S.team = null;
  showExpelToast(facName);
  renderRankBadge();
  const sideEl = document.querySelector('.side-avatar'); if(sideEl) sideEl.innerHTML = sideAvatarPanel();
  return true;
}
function wordmarkLogoSVG(heightPx){
  const uid = 'wm'+Math.random().toString(36).slice(2,7);
  const w = Math.round(heightPx*1.85);
  return `<svg width="${w}" height="${heightPx}" viewBox="0 0 185 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${uid}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--accent-dark)"/></linearGradient>
      <filter id="${uid}f" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <text x="4" y="56" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" font-size="52" letter-spacing="-1" fill="url(#${uid}g)" filter="url(#${uid}f)">VOLT</text>
    <text x="8" y="82" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-style="italic" font-size="17" letter-spacing="7" fill="url(#${uid}g)">INDUSTRIES</text>
    <line x1="4" y1="88" x2="181" y2="88" stroke="url(#${uid}g)" stroke-width="2.5" opacity="0.8"/>
  </svg>`;

/* ---------- Avatar (proportioned silhouette, rim-lit, holographic) ---------- */
function morphConfig(m){
  const cfgs = {
    humain:  { shoulderW:96,  waistW:58, hipW:72, torsoH:130, limbW:20, headR:32, legLen:150, opacity:1,   blocky:false, skinBody:false, ghost:false },
    colosse: { shoulderW:134, waistW:80, hipW:94, torsoH:140, limbW:34, headR:34, legLen:150, opacity:1,   blocky:false, skinBody:true,  ghost:false },
    armure:  { shoulderW:114, waistW:70, hipW:88, torsoH:138, limbW:27, headR:36, legLen:150, opacity:1,   blocky:true,  skinBody:false, ghost:false },
    spectral:{ shoulderW:82,  waistW:50, hipW:60, torsoH:126, limbW:16, headR:30, legLen:140, opacity:0.5, blocky:false, skinBody:false, ghost:true },
    elance:  { shoulderW:78,  waistW:46, hipW:56, torsoH:124, limbW:14, headR:28, legLen:150, opacity:1,   blocky:false, skinBody:false, ghost:false },
  };
  return cfgs[m] || cfgs.humain;
}
function torsoPath(cx, top, shoulderW, waistW, hipW, h){
  const hs=shoulderW/2, hw=waistW/2, hh=hipW/2, waistY=top+h*0.48, bottom=top+h;
  return `M ${cx-hs} ${top}
    C ${cx-hs} ${top+h*0.16} ${cx-hw} ${top+h*0.3} ${cx-hw} ${waistY}
    C ${cx-hw} ${top+h*0.66} ${cx-hh} ${top+h*0.82} ${cx-hh} ${bottom}
    L ${cx+hh} ${bottom}
    C ${cx+hh} ${top+h*0.82} ${cx+hw} ${top+h*0.66} ${cx+hw} ${waistY}
    C ${cx+hw} ${top+h*0.3} ${cx+hs} ${top+h*0.16} ${cx+hs} ${top} Z`;
}
function limbPath(cx, top, len, wTop, wBottom){
  const rt=wTop/2, rb=wBottom/2, bottom=top+len;
  return `M ${cx-rt} ${top+rt} A ${rt} ${rt} 0 0 1 ${cx+rt} ${top+rt}
    L ${cx+rb} ${bottom-rb} A ${rb} ${rb} 0 0 1 ${cx-rb} ${bottom-rb} Z`;
}

    ${legsBlock}
    <path d="${limbPath(armLx, armTop, armLen, cfg.limbW*1.15, cfg.limbW*0.75)}" fill="url(#${uid}suit)" stroke="${pathColor}" stroke-width="${rim}" stroke-opacity="0.55"/>

    ${glovesExtra}
    <path d="${torsoPath(cx, torsoTop, cfg.shoulderW, cfg.waistW, cfg.hipW, cfg.torsoH)}" fill="url(#${uid}suit)" stroke="${pathColor}" stroke-width="${rim}" stroke-opacity="0.7" filter="url(#${uid}glow)"/>

    ${symbol ? `<text x="${cx}" y="${torsoTop+cfg.torsoH*0.68}" font-size="16" font-weight="800" fill="#ffffffdd" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="1">${symbol}</text>` : ''}

    ${glasses==='aviator' ? `<ellipse cx="${cx-cfg.headR*0.3}" cy="${headCy}" rx="10" ry="8" fill="#111820" opacity="0.9"/><ellipse cx="${cx+cfg.headR*0.34}" cy="${headCy}" rx="10" ry="8" fill="#111820" opacity="0.9"/>` : ''}
    ${glasses==='hud' ? `<rect x="${cx-cfg.headR*0.62}" y="${headCy-4}" width="${cfg.headR*1.24}" height="8" rx="4" fill="${pathColor}" opacity="0.95"/>` : ''}

async function saveCareerToHistory(){
  if(!window.storage || S.savedToHistory) return;
  try{
    const uniqueLocs = {}; S.locations.forEach(l=>{ uniqueLocs[l.type+':'+l.name]=l; });
    const zone = zoneOf(S.align);
    const record = {
      heroName: S.heroName, mode: S.mode,
      years: S.dead ? S.deathInfo.year : S.missionsPlan.length,
      missionsTotal: S.totalMissionsDone, align: S.align, zone,
      dead: S.dead, deathCause: S.dead ? S.deathInfo.cause : null,
      team: S.team, fightsWon: S.combat.won, fightsLost: S.combat.lost,
      locationsCount: Object.keys(uniqueLocs).length, mentees: S.mentees.length,
      morphology: S.look.morphology, path: S.path, stars: computeStars(),
      timestamp: Date.now(),
    };
    const key = 'career:'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    await window.storage.set(key, JSON.stringify(record), false);
    S.savedToHistory = true;
  }catch(e){ /* storage unavailable - silently skip */ }
}
async function loadCareerHistory(box){
  if(!window.storage){ box.innerHTML = `<p class="lead" style="text-align:center; margin:0 auto;">${S.lang==='fr'?'Historique indisponible dans ce contexte.':'History unavailable in this context.'}</p>`; return; }
  try{
    const listResult = await window.storage.list('career:', false);
    const keys = (listResult && listResult.keys ? listResult.keys.slice() : []).sort().reverse().slice(0,12);
    if(!keys.length){ box.innerHTML = `<p class="lead" style="text-align:center; margin:0 auto;">${S.lang==='fr'?'Aucune carriere enregistree pour le moment.':'No career saved yet.'}</p>`; return; }
    const items = [];
    for(const k of keys){
      try{ const r = await window.storage.get(k, false); if(r && r.value) items.push({ key:k, data: JSON.parse(r.value) }); }catch(e){}
    }
    renderCareerHistoryList(box, items);
  }catch(e){ box.innerHTML = `<p class="lead" style="text-align:center; margin:0 auto;">${S.lang==='fr'?'Historique indisponible.':'History unavailable.'}</p>`; }
}
function renderCareerHistoryList(box, items){
  if(!items.length){ box.innerHTML = `<p class="lead" style="text-align:center; margin:0 auto;">${S.lang==='fr'?'Aucune carriere enregistree pour le moment.':'No career saved yet.'}</p>`; return; }
  box.innerHTML = `<div class="history-list">${items.map(it=>{
    const c = it.data;
    const zoneLabel = c.zone==='hero'?t('alignHero'):(c.zone==='villain'?t('alignVillain'):t('alignNeutral'));
    const zoneColor = c.zone==='hero'?'#00e5ff':(c.zone==='villain'?'var(--red)':'#b98bff');
    const dateStr = new Date(c.timestamp).toLocaleDateString(S.lang==='fr'?'fr-FR':'en-US');
    return `<div class="history-card">
      <button class="history-del" data-key="${it.key}" title="${S.lang==='fr'?'Supprimer':'Delete'}">&times;</button>
      <div class="hc-name">${c.heroName}${c.dead ? ' &#10013;':''}</div>
      <div class="hc-meta" style="color:${zoneColor};">${zoneLabel} - ${'&#9733;'.repeat(c.stars||1)}</div>
      <div class="hc-meta">${c.years} ${S.lang==='fr'?'ans':'yrs'} - ${c.missionsTotal} ${S.lang==='fr'?'missions':'missions'} - ${dateStr}</div>
    </div>`;
  }).join('')}</div>
  <div class="actions" style="justify-content:center;"><button class="btn ghost" id="clearHistory" style="font-size:12px; padding:8px 16px;">${S.lang==="fr"?"Vider l'historique":"Clear history"}</button></div>`;
  box.querySelectorAll('.history-del').forEach(btn=>{
    btn.onclick = async ()=>{ try{ await window.storage.delete(btn.dataset.key, false); }catch(e){} loadCareerHistory(box); };
  });
  const clearBtn = box.querySelector('#clearHistory');
  if(clearBtn) clearBtn.onclick = async ()=>{ for(const it of items){ try{ await window.storage.delete(it.key, false); }catch(e){} } loadCareerHistory(box); };

/* ---------- Mission engine ---------- */
function pickMission(){
  const rank = computeStars();
  if(Math.random() < 0.05){
    let pPool = PIVOTAL_MISSIONS.filter((m,i)=>!S.usedPivotalIds.includes(i) && (!m.charKey || m.charKey!==S.playerCharKey));
    if(pPool.length===0){ S.usedPivotalIds = []; pPool = PIVOTAL_MISSIONS; }
    const idx = PIVOTAL_MISSIONS.indexOf(pick(pPool)); S.usedPivotalIds.push(idx);
    const m = PIVOTAL_MISSIONS[idx];
    return Object.assign({}, m, { pivotal:true, type:'social', danger:0, scope:1, location: { name: randLocationName(), type: 1 } });
  }
  if(Math.random() < 0.052){
    let bPool = BREAKTHROUGH_MISSIONS.filter((m,i)=>!S.usedBreakthroughIds.includes(i) && (!m.charKey || m.charKey!==S.playerCharKey));
    if(bPool.length===0){ S.usedBreakthroughIds = []; bPool = BREAKTHROUGH_MISSIONS; }
    const idx = BREAKTHROUGH_MISSIONS.indexOf(pick(bPool)); S.usedBreakthroughIds.push(idx);
    const m = BREAKTHROUGH_MISSIONS[idx];
    return Object.assign({}, m, { breakthrough:true, type:'social', danger:1, scope:Math.max(1,rank), location: { name: randLocationName(), type: Math.max(1,rank) } });
  }
  if(Math.random() < 0.27){ return generateSignatureMission(rank); }
  if(Math.random() < 0.83){ return zoneOf(S.align)==='villain' ? generateVillainMission(rank) : generateProceduralMission(rank); }
  let reachable = MISSIONS.filter(m => (m.scope||1) <= rank);
  if(reachable.length===0) reachable = MISSIONS.filter(m=>(m.scope||1)===1);
  reachable = reachable.filter(m=>!m.charKey || m.charKey!==S.playerCharKey);
  let pool = reachable.filter(m=>!S.usedIds.includes(m.id));
  if(pool.length===0){ pool = reachable; S.usedIds = S.usedIds.filter(id=>!reachable.some(m=>m.id===id)); }
  pool = shuffle(pool); const m = pool[0]; S.usedIds.push(m.id);
  return Object.assign({}, m, { location: { name: randLocationName(), type: m.scope||1 } });
}
function shouldTriggerMentor(){ if(S.mode!=='long') return false; if(S.currentYear < 10) return false; if(S.mentorCount >= S.mentorCap) return false; return Math.random() < 0.22; }
function checkTeamInvite(){
  const zone = zoneOf(S.align);
  if(zone==='neutral' || S.totalMissionsDone < 2) return false;
  const tier = computeStars();
  const key = zone==='hero' ? 'invitedTierHero' : 'invitedTierVillain';
  if(tier > S[key]){
    S[key] = tier;
    S.pendingReturnScreen = S.screen; S.screen = 'invite'; S.inviteSide = zone; S.inviteTier = tier;
    return true;
  }
  return false;
}
function pushYearHistoryIfDone(){ S.yearsHistory.push({ year: S.currentYear, entries: S.currentYearEntries.slice(), endAlign: S.align }); S.currentYearEntries = []; }
function nextMission(){
  const missionsThisYear = S.missionsPlan[S.currentYear-1];
  if(S.currentMissionInYear >= missionsThisYear){
    pushYearHistoryIfDone();
    if(S.currentYear >= S.missionsPlan.length){ S.screen='end'; render(); return; }
    S.screen='yearbreak'; render(); return;
  }
  S.currentMissionInYear += 1; S.totalMissionsDone += 1;
  if(shouldTriggerMentor()){
    S.mentorCount += 1; const pool = shuffle(MENTOR_MISSIONS); const m = pool[0]; const name = randRecruitName();
    S.currentMission = Object.assign({}, m, { recruitName:name }); S.screen='mentor'; render(); maybeTriggerConversation(); return;
  }
  S.currentMission = pickMission(); S.screen='mission'; render(); afterMissionRender(S.currentMission);
}
function missionEpicness(mission){
  if(!mission || mission.type!=='combat') return 'none';
  if((mission.danger||0)>=3 || (mission.scope||1)>=5) return 'epic';
  if((mission.danger||0)>=2) return 'major';
  return 'none';
}
function showCombatCinematic(mission, epicness){
  const overlay = document.createElement('div'); overlay.className = 'cine-overlay ' + epicness;

function applyMentorChoice(choice, name){
  const eff = choice.eff || {};
  S.align = clampToReputation(clamp(S.align + (eff.align||0), -100, 100));
  S.stats.courage = clamp(S.stats.courage + (eff.courage||0), 0, 100);
  S.stats.intelligence = clamp(S.stats.intelligence + (eff.intelligence||0), 0, 100);
  S.stats.popularity = clamp(S.stats.popularity + (eff.popularity||0), 0, 100);
  if(eff.rel){ Object.keys(eff.rel).forEach(k=>{ S.rel[k] = clamp((S.rel[k]||0) + eff.rel[k], -20, 20); }); }
  S.mentees.push({ name, outcome: choice.recruit });
  const label = S.lang==='fr' ? choice.fr : choice.en;
  S.log.push({ year:S.currentYear, textFr:label, textEn:label, villain:(eff.align||0)<0 });
  S.currentYearEntries.push({ tag: t('mentorTag'), location:null, type:'mentor', outcome:choice.recruit });
  handleZoneCheckAndContinue();
}
function handleZoneCheckAndContinue(){
  const newZone = zoneOf(S.align);
  if(newZone !== S.lastZone){ S.turningPoints.push({ year:S.currentYear, from:S.lastZone, to:newZone }); S.lastZone = newZone; }
  if(checkFactionExpulsion()){ nextMission(); return; }
  if(checkTeamInvite()){ render(); return; }
  nextMission();
}
function resolveOutcome(mission){
  const pl = computePowerLevel(); const type = mission.type || 'social'; let outcome = null;
  const scopePenalty = ((mission.scope||1)-1) * 0.06;
  if(type==='combat'){ const winProb = clamp(0.42 + (S.stats.courage-50)/320 + pl/380 - scopePenalty, 0.08, 0.88); const win = Math.random() < winProb; if(win) S.combat.won++; else S.combat.lost++; outcome = win ? 'win' : 'lose'; }
  else if(type==='rescue'){ const winProb = clamp(0.42 + (S.stats.intelligence-50)/320 + pl/380 - scopePenalty, 0.08, 0.88); const win = Math.random() < winProb; outcome = win ? 'saved' : 'lost'; if(win){ S.locations.push(mission.location); } }
  return { type, outcome };
}
function checkDeath(mission){
  const pl = computePowerLevel(); const danger = mission.danger || 0; const scope = mission.scope || 1;
  const budget = S.deathBudgetPerMission || 0.003;
  const dangerFactor = danger>0 ? (0.4 + danger*0.45) : 0.22;
  const powerFactor = clamp((100-pl)/65, 0.18, 2.0);
  const scopeFactor = 1 + (scope-1)*0.09;
  return Math.random() < (budget * dangerFactor * powerFactor * scopeFactor);
}
function applyChoice(choice){
  const m = S.currentMission; const eff = choice.eff || {};
  const isChaosEvent = !!(eff.flip || eff.reinforce || eff.balance);
  let alignDelta = eff.align||0;
  if(eff.flip){ alignDelta = (S.align >= 0 ? -1 : 1) * eff.magnitude; }
  else if(eff.reinforce){ alignDelta = (S.align >= 0 ? 1 : -1) * eff.magnitude; }
  else if(eff.balance){ alignDelta = S.align > 0 ? -Math.min(eff.magnitude, S.align) : (S.align < 0 ? Math.min(eff.magnitude, -S.align) : 0); }
  const newAlign = clamp(S.align + alignDelta, -100, 100);
  if(isChaosEvent){
    S.align = newAlign;
    S.reputationFloor = Math.max(S.reputationFloor||0, Math.abs(S.align));
  } else {
    S.align = clampToReputation(newAlign);
  }
  S.stats.courage = clamp(S.stats.courage + (eff.courage||0), 0, 100);
  S.stats.intelligence = clamp(S.stats.intelligence + (eff.intelligence||0), 0, 100);
  S.stats.popularity = clamp(S.stats.popularity + (eff.popularity||0), 0, 100);
  if(eff.rel){ Object.keys(eff.rel).forEach(k=>{ S.rel[k] = clamp((S.rel[k]||0) + eff.rel[k], -20, 20); }); }
  S.log.push({ year: S.currentYear, textFr: choice.fr, textEn: choice.en, villain: alignDelta < 0 });
  const res = resolveOutcome(m);
  S.currentYearEntries.push({ tag:(S.lang==='fr'?m.tagFr:m.tagEn), location:m.location, type:res.type, outcome:res.outcome });
  if(checkDeath(m)){
    const causes = DEATH_CAUSES[S.lang]; const cause = causes[Math.floor(Math.random()*causes.length)];
    S.dead = true; S.deathInfo = { year: S.currentYear, cause };
    S.yearsHistory.push({ year: S.currentYear, entries: S.currentYearEntries.slice(), endAlign: S.align }); S.currentYearEntries = [];
    S.screen='end'; render(); return;
  }
  handleZoneCheckAndContinue();
}

function convFill(str, charObj){
  return str.replace(/\{char\}/g, S.lang==='fr'?charObj.fr:charObj.en)
            .replace(/\{hero\}/g, S.heroName || (S.lang==='fr'?'toi':'you'))
            .replace(/\{year\}/g, String(S.currentYear));
}
function pickUnused(bucket, len){
  if(!S.usedFrag) S.usedFrag = {};
  let used = S.usedFrag[bucket] || [];
  if(used.length >= len) used = [];
  let i; let guard = 0;
  do { i = Math.floor(Math.random()*len); guard++; } while(used.includes(i) && guard < 200);
  used.push(i); S.usedFrag[bucket] = used;
  return i;
}
function generateConversation(charKey){
  const c = CHARACTERS[charKey]; if(!c) return null;
  const tone = CONV_LINES[c.align] ? c.align : 'neutral';
  const pack = CONV_LINES[tone];
  const oi = pickUnused('open_'+tone+'_'+charKey, pack.openFr.length);
  const mi = pickUnused('mid_'+tone, pack.midFr.length);
  const buckets = ['noble','pragmatic','ruthless'];
  const choices = shuffle(buckets).map(b=>{
    const pool = CONV_CHOICE_POOL[b];
    const ci = pickUnused('ch_'+b, pool.length);
    const base = pool[ci];
    const eff = { align:base.eff.align||0, courage:base.eff.courage||0, intelligence:base.eff.intelligence||0, popularity:base.eff.popularity||0 };
    if(base.eff.rel){ let r = base.eff.rel; if(c.align==='villain') r = -r * (b==='ruthless'?-1:1); eff.rel = { [charKey]: Math.round(r) }; }
    return { fr:base.fr, en:base.en, eff };
  });
  return {
    id:'gen_'+charKey+'_'+oi+'_'+mi+'_'+Date.now(),
    charKey,
    linesFr:[ convFill(pack.openFr[oi], c), convFill(pack.midFr[mi], c) ],
    linesEn:[ convFill(pack.openEn[oi], c), convFill(pack.midEn[mi], c) ],
    choices,
  };
}

    const pool = (recurring.length && Math.random() < 0.75) ? recurring : keys;
    const charKey = pool[Math.floor(Math.random()*pool.length)];
    const conv = generateConversation(charKey);
    if(!conv) return;
    S.activeConversation = conv; S.convLineIndex = 0;
    S.lastConvYear = S.currentYear;
    renderConversationOverlay();
  }
}
function convBeamColor(align){ return align==='villain' ? '#ff2d55' : (align==='hero' ? '#00e5ff' : '#c084fc'); }
function characterPortraitHTML(charObj, animate){
  const col = convBeamColor(charObj.align);

  const entranceClass = animate ? (charObj.align==='villain' ? 'glitch-in' : 'materialize-in') : '';
  const name = S.lang==='fr'?charObj.fr:charObj.en;
  const initial = name.replace(/^(Le |La |Dr |L')/,'').charAt(0).toUpperCase();
  const inner = charObj.img
    ? `<img src="${charObj.img}" alt="${name}">`
    : `<span class="cp-glyph">${initial}</span>`;
  return `<div class="conv-portrait ${entranceClass}" style="--cp-color:${col};">${inner}${animate ? '<div class="cp-sweep"></div>' : ''}</div>`;
}
function renderConversationOverlay(){
  removeConvOverlay();
  const conv = S.activeConversation; if(!conv) return;
  const charObj = CHARACTERS[conv.charKey];
  const lines = S.lang==='fr'?conv.linesFr:conv.linesEn;
  const isLast = S.convLineIndex >= lines.length-1;
  const col = charColor(charObj.align);
  const beam = convBeamColor(charObj.align);
  const isFirstReveal = S.convLineIndex===0;
  const el = document.createElement('div'); el.id='convOverlay'; el.className='conv-overlay';
  el.innerHTML = `<div class="conv-backdrop"></div><div class="conv-card">
    <div class="conv-stage" style="--cp-color:${beam};">
      ${characterPortraitHTML(charObj, isFirstReveal)}
      <div class="conv-beam"></div>
    </div>
    <div class="conv-body">
      <div class="conv-charname"><span class="conv-dot" style="background:${col};"></span>${S.lang==='fr'?charObj.fr:charObj.en}</div>
      <div class="conv-line">${lines[S.convLineIndex]}</div>
      ${!isLast ? `<div class="actions"><button class="btn cyan" id="convNext">${t('convNext')} -></button></div>` : `<div id="convChoices">${conv.choices.map((c,i)=>`<button class="choice" data-idx="${i}">${S.lang==='fr'?c.fr:c.en}</button>`).join('')}</div>`}
    </div>
  </div>`;

  document.body.appendChild(el);
  if(!isLast){ el.querySelector('#convNext').onclick=()=>{ S.convLineIndex++; renderConversationOverlay(); }; }
  else { el.querySelectorAll('.choice').forEach(btn=>{ btn.onclick = ()=>{ applyConvChoice(conv, conv.choices[parseInt(btn.dataset.idx)]); }; }); }
}
function applyConvChoice(conv, choice){
  const eff = choice.eff || {};
  S.align = clampToReputation(clamp(S.align + (eff.align||0), -100, 100));
  S.stats.courage = clamp(S.stats.courage + (eff.courage||0), 0, 100);
  S.stats.intelligence = clamp(S.stats.intelligence + (eff.intelligence||0), 0, 100);
  S.stats.popularity = clamp(S.stats.popularity + (eff.popularity||0), 0, 100);
  if(eff.rel){ Object.keys(eff.rel).forEach(k=>{ S.rel[k] = clamp((S.rel[k]||0) + eff.rel[k], -20, 20); }); }
  if(eff.rom){ handleRomanceEffect(eff.rom, conv); }
  const label = S.lang==='fr' ? choice.fr : choice.en;
  S.log.push({ year:S.currentYear, textFr:label, textEn:label, villain:(eff.align||0)<0 });
  const newZone = zoneOf(S.align);
  if(newZone !== S.lastZone){ S.turningPoints.push({ year:S.currentYear, from:S.lastZone, to:newZone }); S.lastZone = newZone; }
  checkFactionExpulsion();
  removeConvOverlay(); S.activeConversation=null; S.convLineIndex=0;
  applyTheme(); renderRankBadge();
  const sideEl = document.querySelector('.side-avatar'); if(sideEl) sideEl.innerHTML = sideAvatarPanel();
}
function removeConvOverlay(){ const el=document.getElementById('convOverlay'); if(el) el.remove(); }

/* ---------- End screen ---------- */
function screenEnd(){
  saveCareerToHistory();
  clearGameState();
  const d = document.createElement('div');
  const topRelKey = Object.keys(S.rel).reduce((a,b)=> (S.rel[b]>S.rel[a] ? b : a), Object.keys(S.rel)[0]);
  const topRel = CHARACTERS[topRelKey];
  const teamLineFr = S.team ? ` En tant que membre de ${factionName(S.team.side,S.team.tier)}, ${S.heroName} ${S.team.side==='hero'?'combat aux cotes des plus grands':"etend son influence dans l'ombre"}.` : '';
  const teamLineEn = S.team ? ` As a member of ${factionName(S.team.side,S.team.tier)}, ${S.heroName} ${S.team.side==='hero'?'fights alongside the greatest':'extends their influence from the shadows'}.` : '';
  let endingFr, endingEn;
  if(S.dead){ endingFr = `${S.heroName} n'aura pas vu la fin de cette carriere. ${topRel.fr} se souvient neanmoins d'un destin marquant.`; endingEn = `${S.heroName} did not live to see the end of this career. ${topRel.en} still remembers a remarkable fate.`; }
  else if(S.align >= 40){ endingFr = `${S.heroName} est devenu(e) une legende protectrice apres ${S.missionsPlan.length} annees de service. ${topRel.fr} le/la considere comme un allie indefectible.${teamLineFr}`; endingEn = `${S.heroName} became a protective legend after ${S.missionsPlan.length} years of service. ${topRel.en} considers them an unshakeable ally.${teamLineEn}`; }
  else if(S.align <= -40){ endingFr = `${S.heroName} a sombre du cote des fleaux au fil de ${S.missionsPlan.length} annees, semant la crainte partout ou il/elle passe. ${topRel.fr} salue cette ascension.${teamLineFr}`; endingEn = `${S.heroName} fell to the side of menace over ${S.missionsPlan.length} years, sowing fear wherever they go. ${topRel.en} welcomes this rise.${teamLineEn}`; }
  else { endingFr = `Apres ${S.missionsPlan.length} annees, ${S.heroName} trace sa propre voie, entre ombre et lumiere. ${topRel.fr} reste la relation la plus marquante.${teamLineFr}`; endingEn = `After ${S.missionsPlan.length} years, ${S.heroName} walks their own path, between shadow and light. ${topRel.en} remains the most defining relationship.${teamLineEn}`; }
  const romLine = romanceLabel();
  if(romLine){ endingFr += ' ' + romLine.fr; endingEn += ' ' + romLine.en; }
  const alignLabel = S.align>=15 ? t('alignHero') : (S.align<=-15 ? t('alignVillain') : t('alignNeutral'));
  const finalZone = zoneOf(S.align);
  const locLabel = finalZone==='villain' ? t('locationsDestroyed') : t('locationsSaved');
  const uniqueLocs = {}; S.locations.forEach(l=>{ uniqueLocs[l.type+':'+l.name]=l; }); const locArr = Object.values(uniqueLocs);
  const tierCounts = [0,0,0,0,0,0,0,0]; locArr.forEach(l=>{ tierCounts[l.type] = (tierCounts[l.type]||0)+1; });
  const menteeHero = S.mentees.filter(m=>m.outcome==='hero').length, menteeVillain = S.mentees.filter(m=>m.outcome==='villain').length;
  const menteeDied = S.mentees.filter(m=>m.outcome==='died').length, menteeNeutral = S.mentees.filter(m=>m.outcome==='neutral').length;
  const kpiHtml = `<div class="kpi-grid">
    <div class="kpi"><div class="kval">${S.dead ? S.deathInfo.year : S.missionsPlan.length}</div><div class="klabel">${t('yearsServed')}</div></div>
    <div class="kpi"><div class="kval">${S.totalMissionsDone}</div><div class="klabel">${t('missionsTotal')}</div></div>
    <div class="kpi"><div class="kval">${locArr.length}</div><div class="klabel">${locLabel}</div></div>
    <div class="kpi"><div class="kval">${S.combat.won}</div><div class="klabel">${t('fightsWon')}</div></div>
    <div class="kpi"><div class="kval">${S.combat.lost}</div><div class="klabel">${t('fightsLost')}</div></div>
    <div class="kpi"><div class="kval">${S.mentees.length}</div><div class="klabel">${t('menteesCount')}</div></div></div>`;
  const menteeDetail = S.mentees.length ? `<p class="lead" style="margin-top:10px;">${menteeHero} ${t('menteeHero')}, ${menteeVillain} ${t('menteeVillain')}, ${menteeDied} ${t('menteeDied')}, ${menteeNeutral} ${t('menteeNeutral')}.</p>` : '';
  const locBreak = locArr.length ? `<p class="lead" style="margin-top:6px;">${[1,2,3,4,5,6,7].filter(lv=>tierCounts[lv]>0).map(lv=>`${tierCounts[lv]} ${scopeLabel(lv)}`).join(', ')}.</p>` : '';
  const turningHtml = S.turningPoints.length ? S.turningPoints.map(tp=>{ const fromL = tp.from==='hero'?t('alignHero'):(tp.from==='villain'?t('alignVillain'):t('alignNeutral')); const toL = tp.to==='hero'?t('alignHero'):(tp.to==='villain'?t('alignVillain'):t('alignNeutral'));
    return `<div class="turn-item">${t('year')} ${tp.year}: ${fromL} -> ${toL}</div>`; }).join('') : `<p class="lead">${t('noTurning')}</p>`;
  const yearsHtml = S.yearsHistory.map(yh=>{ const zone = zoneOf(yh.endAlign); const col = zone==='hero'?'#00e5ff':(zone==='villain'?'var(--red)':'#b98bff');
    const missionsHtml = yh.entries.map(e=>{ if(e.type==='mentor'){ const lbl = e.outcome==='hero'? t('menteeHero') : e.outcome==='villain'? t('menteeVillain') : e.outcome==='died'? t('menteeDied') : t('menteeNeutral'); return `<div class="ymission">${t('mentorTag')} - ${lbl}</div>`; }
      let outcomeLabel = ''; if(e.type==='combat') outcomeLabel = e.outcome==='win' ? t('combatOutcomeWin') : t('combatOutcomeLose'); else if(e.type==='rescue') outcomeLabel = e.outcome==='saved' ? t('rescueSaved') : t('rescueLost');
      const locTxt = e.location ? ` - ${e.location.name} (${locTypeLabel(e.location.type)})` : ''; return `<div class="ymission">${e.tag}${locTxt}${outcomeLabel? ' - '+outcomeLabel:''}</div>`; }).join('');
    return `<details class="yearcard"><summary>${t('year')} ${yh.year} <span class="tag" style="background:${col}22; color:${col};">${zone==='hero'?t('alignHero'):(zone==='villain'?t('alignVillain'):t('alignNeutral'))}</span></summary>${missionsHtml}</details>`; }).join('');
  d.innerHTML = `
    ${S.dead ? `<div class="death-banner"><div class="dtitle">${t('inMemoriam')}</div><p class="lead" style="margin:8px auto 0;">${S.heroName} - ${t('diedAt')} ${t('year').toLowerCase()} ${S.deathInfo.year}. ${t('causeLabel')}: ${S.deathInfo.cause}.</p></div>` : ''}
    <span class="eyebrow">${t('endTitle')}</span><h1>${S.heroName}</h1>
    <p class="lead" style="font-size:17px;">${S.lang==='fr'?endingFr:endingEn}</p>
    ${S.team ? `<div class="team-hero-banner" style="border-color:${charColor(S.team.side)};">
      <div style="display:flex; justify-content:center; margin-bottom:10px;">${factionEmblemSVG(S.team.side, S.team.tier, 84)}</div>
      <div class="tname" style="color:${charColor(S.team.side)}; text-shadow:0 0 20px ${charColor(S.team.side)};">${factionName(S.team.side,S.team.tier)}</div></div>` : ''}
    <p class="lead" style="margin-top:14px;">${S.lang==='fr'?'Alignement final':'Final alignment'}: <b>${alignLabel}</b></p>
    <h2 style="margin-top:20px;">${t('fullReportTitle')}</h2>
    ${kpiHtml}${locBreak}${menteeDetail}
    <h3>${t('turningPointsTitle')}</h3>${turningHtml}
    <h3>${t('relations')}</h3>
    <div class="relwrap">${otherCharKeys().map(k=>{ const c = CHARACTERS[k]; const v = S.rel[k]||0; const pct = clamp((v+20)/40*100,0,100);
      const col = charColor(c.align);
      return `<div class="relcard"><div class="rn">${S.lang==='fr'?c.fr:c.en}</div><div class="barbg"><div class="barfill" style="width:${pct}%; background:${col};"></div></div></div>`; }).join('')}</div>
    <h3>${t('yearByYearTitle')}</h3><div style="margin-top:6px;">${yearsHtml}</div>
    <h3>${t('logTitle')}</h3>
    <div style="margin-top:10px; max-height:280px; overflow:auto;">${S.log.map(e=>`<div class="log-entry ${e.villain?'villain':''}">${t('year')} ${e.year} - ${S.lang==='fr'?e.textFr:e.textEn}</div>`).join('')}</div>
    <div class="actions"><button class="btn cyan" id="restart">${t('restart')}</button></div>`;
  d.querySelector('#restart').onclick=()=>{ const lang = S.lang; S = freshState(lang); const badge=document.getElementById('rankBadgeFixed'); if(badge) badge.remove(); removeConvOverlay(); render(); };
  return d;
}

function initParticles(){
  const layer = document.createElement('div'); layer.className='particle-layer';
  const n = 22;
  for(let i=0;i<n;i++){
    const p = document.createElement('div'); p.className='particle';
    const size = 2 + Math.random()*3;
    p.style.width = size+'px'; p.style.height = size+'px';
    p.style.left = Math.random()*100 + 'vw';
    p.style.top = 100 + Math.random()*20 + 'vh';
    p.style.animationDuration = (14 + Math.random()*16) + 's';
    p.style.animationDelay = (Math.random()*18) + 's';
    layer.appendChild(p);
  }
  document.body.insertBefore(layer, document.body.firstChild);
}
initParticles();
render();
</script>
</body>
</html>
